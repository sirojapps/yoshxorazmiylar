<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yosh Xorazmiylar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Yosh Xorazmiylar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap">
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface2:#eef2f7; --fg:#1e293b; --muted:#64748b; --line:#e5eaf1;
  --navy:#2f4f8f; --stage:linear-gradient(135deg,#e9f3ff 0%,#e7f8f5 100%); --stage-fg:#1e293b; --stage-lb:#0b7f7c; --stage-line:rgba(15,157,154,.18); --stage-on:#12a39f; --accent:#12a39f; --accent-strong:#0b8581; --accent-soft:#e0f5f3; --gold:#a07612; --gold-soft:#f8ecd0;
  --good:#1f8a4c; --low:#6a7792; --wrong:#c2414b; --wrong-soft:#f7dfe1; --blank:#c3cad8; --on-accent:#fff;
  --display:"Golos Text",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media not all{:root{
  --bg:#0e1424; --surface:#161e33; --surface2:#1e2842; --fg:#e7ecf6; --muted:#9aa6bf; --line:#2a3552;
  --navy:#8fb0ff; --stage:linear-gradient(135deg,#1a2540 0%,#16303a 100%); --stage-fg:#e7ecf6; --stage-lb:#7fdcd7; --stage-line:rgba(255,255,255,.18); --stage-on:#5fe0d9; --accent:#2fb8b3; --accent-strong:#3cc7c2; --accent-soft:#163b3d; --gold:#e3b54a; --gold-soft:#3b3218;
  --good:#4cc47f; --low:#8d99b3; --wrong:#ee6b74; --wrong-soft:#41222a; --blank:#3a4562; --on-accent:#06201f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);flex:none}
.role{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-strong);background:var(--accent-soft);padding:4px 8px;border-radius:999px;flex:none}
main{flex:1;padding-block:16px 100px;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent-strong)}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.stage{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--stage);color:var(--stage-fg);border:1px solid var(--line);border-radius:16px}
.stage .t{font-family:var(--display);font-size:17px;font-weight:700}
.stage .slb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--stage-lb)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps span{font-size:11px;text-align:center;padding-top:7px;border-top:3px solid var(--stage-line);opacity:.65;border-radius:2px}
.steps span.on{border-color:var(--stage-on);opacity:1;font-weight:600}
.steps span.done{border-color:var(--stage-on);opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;overflow:hidden}
.list>*{border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
.row .m{flex:1;min-width:0}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;flex:none}
.num small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.rank{width:24px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;flex:none}
.chev{color:var(--muted);flex:none}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.gray{background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent-strong)}
.pill.warn{background:var(--wrong-soft);color:var(--wrong)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(20,33,61,.12)}
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.q{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.q.ok{background:var(--accent-soft);color:var(--accent-strong)}
.q.no{background:var(--wrong-soft);color:var(--wrong)}
.q.bl{background:var(--surface2);color:var(--muted);border:1px dashed var(--blank)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hero{padding:18px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:17px;color:var(--muted);font-weight:500}
.cmp{display:flex;flex-direction:column;gap:10px;padding:14px}
.cmp .r{display:grid;grid-template-columns:104px 1fr 46px;align-items:center;gap:10px;font-size:13.5px}
.cmp .track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.cmp .track i{display:block;height:100%;border-radius:5px}
.note{font-size:13px;color:var(--muted);margin:0}
.inst{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:12px}
.inst .go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px 0;text-align:left;font-size:14px;font-weight:600;color:var(--accent-strong)}
.inst .go img{width:26px;height:26px;flex:none}
.inst .go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inst .ib{width:32px;height:32px;background:none;color:var(--muted)}
.warnc{border-color:var(--gold);background:var(--gold-soft)}
.isteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.hard{display:flex;gap:6px;flex-wrap:wrap}
.hard span{padding:6px 10px;border-radius:10px;background:var(--wrong-soft);color:var(--wrong);font-size:13px;font-weight:600}
.hard span small{font-weight:500;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:13px;font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:disabled{opacity:.45}
.btn.sec{background:var(--surface2)}
.btn.dan{background:var(--wrong-soft);color:var(--wrong)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.lnk{color:var(--accent-strong);font-weight:600;font-size:14px;padding:6px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.field textarea{min-height:110px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.check{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.empty{padding:20px 16px;text-align:center;color:var(--muted);font-size:14px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:13px 14px 13px 42px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 30px}
.sh-top{display:flex;align-items:flex-start;gap:12px}
.sh-top .m{flex:1;min-width:0}
.sh-top h2{font-size:20px;margin:0;line-height:1.25}
.sh-top .s{color:var(--muted);font-size:13.5px}
.score{display:flex;align-items:baseline;gap:8px;padding:14px 16px}
.score b{font-family:var(--display);font-size:32px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.score .r{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1/.82;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--display);font-size:20px;font-weight:500;display:grid;place-items:center}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.letters{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.lcol{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:22px repeat(5,1fr);gap:3px;align-items:center}
.lrow>span{font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;padding-right:3px}
.lb{height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.lb[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--wrong);color:#fff}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:44px 32px;text-align:center}
.logo{width:140px;height:140px}
.login h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0;color:var(--navy)}
.pinbox{display:flex;gap:8px;justify-content:center}
.pinbox span{width:42px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.pinbox span.f{border-color:var(--accent)}
.kp{display:grid;grid-template-columns:repeat(3,74px);gap:10px;justify-content:center}
.kp button{height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:600}
.err{color:var(--wrong);font-size:14px;min-height:20px;margin:0}
.code{font-family:var(--display);font-size:22px;letter-spacing:.12em;color:var(--accent-strong)}
.sms{white-space:pre-wrap;font-size:14px;background:var(--surface2);padding:12px;border-radius:10px}
.tbl{overflow-x:auto}
.ti{position:relative;display:inline-flex}
.tabs .badge{position:absolute;top:-4px;right:-10px}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--wrong);color:#fff;font-size:11px;font-weight:700;margin-left:6px}
.msgs{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:14px 14px 4px 14px}
.bubble .who{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.bubble img{display:block;max-width:100%;border-radius:10px;margin-top:6px;cursor:zoom-in}
.bubble .who{display:flex;align-items:center;gap:6px}
.bubble .mm{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px 0 8px;cursor:pointer}
.bubble .ma{display:flex;gap:14px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
.bubble .ma button{border:0;background:none;padding:2px 0;font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-strong);cursor:pointer}
.bubble .ma button.del{color:var(--wrong)}
.bubble .ed{font-size:11px;color:var(--muted);margin-top:3px;text-align:right}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;overflow:auto}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
.zoom .zb{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;right:12px}
.zoom .zb a,.zoom .zb button{display:inline-grid;place-items:center;height:42px;min-width:42px;padding:0 14px;border-radius:21px;border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.offline{background:var(--gold-soft);color:var(--fg);font-size:13px;padding:8px 14px;border-radius:10px}
@media (min-width:900px){
.app:has(> .tabs){max-width:none;margin:0 0 0 256px}
.app:has(> .tabs) .top,.app:has(> .tabs) main{padding-left:40px;padding-right:40px}
.app:has(> .tabs) main{max-width:1040px;width:100%;padding-bottom:48px}
.top h1{font-size:20px}
.tabs{top:0;bottom:0;right:auto;width:240px;border-top:0;border-right:1px solid var(--line);padding:20px 14px}
.tabs .in{max-width:none;display:flex;flex-direction:column;gap:3px;min-height:100%}
.tabs{width:256px;overflow-y:auto;scrollbar-width:thin}
.tabs .in>.dk{display:flex}
.brand{align-items:center;gap:12px;padding:2px 6px 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.brand img{width:54px;height:54px;border-radius:50%;flex:none;background:#fff;box-shadow:0 0 0 3px #fff,0 4px 14px rgba(31,56,100,.22)}
.brand b{display:block;font-family:"Unbounded",var(--display);font-weight:600;font-size:15px;line-height:1.25;color:var(--navy)}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.side-l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:16px 14px 4px}
.tabs button.sl{padding:8px 14px;font-size:14px;color:var(--fg)}
.tabs button.sl svg{width:18px;height:18px;color:var(--muted)}
.tabs button.sl[aria-current="true"]{background:var(--accent-soft);color:var(--accent-strong)}
.tabs .sch{margin-top:auto;padding-top:16px}
.tabs .sch .schc{padding:14px;font-size:12.5px}
.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:9px 14px;border-radius:11px;font-size:15px}
.tabs button[aria-current="true"]{background:var(--accent-soft)}
.tabs .badge{position:static;margin-left:auto}
.kpis{grid-template-columns:repeat(6,1fr)}
.sheet{background:rgba(15,23,42,.38);padding:40px 16px}
.sheet .in{max-width:600px;background:var(--bg);border-radius:18px;padding:20px 24px 26px}
.toast{bottom:28px}
}

/* ============ atmosfera: har bo'limga o'z yumshoq rangi, sokin harakat ============ */
@property --c1{syntax:'<color>';inherits:true;initial-value:#cdeeea}
@property --c2{syntax:'<color>';inherits:true;initial-value:#d6e6ff}
@property --c3{syntax:'<color>';inherits:true;initial-value:#fdf3d8}
body{--c1:#b6ebe3;--c2:#c6dbff;--c3:#ffeab8;--gop:.13;transition:--c1 .9s ease,--c2 .9s ease,--c3 .9s ease}
body[data-theme=mint]{--c1:#bdeccb;--c2:#def3b4;--c3:#bfe8ec}
body[data-theme=sand]{--c1:#ffd9b8;--c2:#ffecbd;--c3:#d4ece7;--gop:.08}
body[data-theme=lilac]{--c1:#dccfff;--c2:#c9e0ff;--c3:#fbd5e6}
body[data-theme=rose]{--c1:#ffd1dc;--c2:#ffe3bb;--c3:#ddd6ff}
body[data-theme=dusk]{--c1:#ccd2ff;--c2:#b8e9e3;--c3:#ecdcff}
body[data-theme=sun]{--c1:#ffe89c;--c2:#c4eed3;--c3:#ffd4c2}
@media not all{
 body{--c1:#123a3d;--c2:#1a2a52;--c3:#3a3320;--gop:.11}
 body[data-theme=mint]{--c1:#14402c;--c2:#2c3d18;--c3:#123a40}
 body[data-theme=sand]{--c1:#46301c;--c2:#3d3518;--c3:#14373a;--gop:.08}
 body[data-theme=lilac]{--c1:#2e2456;--c2:#18305a;--c3:#45203a}
 body[data-theme=rose]{--c1:#4a2030;--c2:#43331a;--c3:#2a2552}
 body[data-theme=dusk]{--c1:#232a60;--c2:#123f3d;--c3:#3a2552}
 body[data-theme=sun]{--c1:#45401a;--c2:#163d29;--c3:#45281e}
}
#atmo{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#atmo .b{position:absolute;width:80vmax;height:80vmax;border-radius:50%;opacity:1}
#atmo .b1{background:radial-gradient(circle at center,var(--c1) 0,transparent 62%);left:-30vmax;top:-32vmax;animation:drift1 46s ease-in-out infinite alternate}
#atmo .b2{background:radial-gradient(circle at center,var(--c2) 0,transparent 62%);right:-32vmax;top:18vh;animation:drift2 58s ease-in-out infinite alternate}
#atmo .b3{background:radial-gradient(circle at center,var(--c3) 0,transparent 62%);left:5vw;bottom:-45vmax;animation:drift3 64s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.08)}}
@keyframes drift2{to{transform:translate(-10vw,-8vh) scale(1.12)}}

  catch(e){const er=new Error('Server bilan aloqa yo’q. Internetni tekshiring yoki birozdan keyin qayta urinib ko’ring.');er.net=true;throw er}
  if(r.status>=502&&r.status<=504){const er=new Error('Sayt bir daqiqaga yangilanmoqda. Birozdan keyin qayta urinib ko’ring.');er.net=true;throw er}
  let d={};try{d=await r.json()}catch(e){}

  return d;
}

async function load(auto){
  try{const n=await api('state');const j=JSON.stringify(n);if(auto&&S&&!netTry&&j===SJ)return;SJ=j;S=n;if(netTry){netTry=0;pinErr='';if(S)toast('Aloqa tiklandi')}}
  catch(e){

  const res={};(S.results||[]).forEach(r=>{(res[r.test_id]||={})[r.student_id]=r});
  return{sc,cl,st,res};
}

const pct=r=>r&&!r.absent&&r.score!=null?Math.round(r.score/r.qn*100):null;
function avgPct(list,tid=testId){const v=list.map(s=>pct(R(s.id,tid))).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
function present(list,tid=testId){return list.filter(s=>{const r=R(s.id,tid);return r&&!r.absent})}
function giftedSet(tid=testId){
  const t=S.tests.find(x=>x.id===tid);const set=new Set();if(!t)return set;
  if(!isTeam()){(S.gifted||[]).forEach(k=>{const[a,b]=k.split(':');if(+a===tid)set.add(+b)});return set}
  [...new Set(X.st.map(s=>s.school_id+':'+s.grade))].forEach(g=>{ // har bir maktab va sinf bosqichi alohida
    const p=present(X.st.filter(s=>s.school_id+':'+s.grade===g),tid).map(s=>R(s.id,tid)).filter(r=>r.score!=null).sort((a,b)=>b.score-a.score);
    if(!p.length)return;const cut=p[Math.max(0,Math.ceil(p.length*t.gifted_top/100)-1)].score;
    p.forEach(r=>{if(r.score>=cut&&r.score/r.qn*100>=t.gifted_min)set.add(r.student_id)});});
  return set;
}
function hardest(list,k=5,tid=testId){const p=present(list,tid).map(s=>R(s.id,tid)).filter(r=>r.bits);if(!p.length)return[];
  const n=Math.max(...p.map(r=>r.bits.length));const w=Array(n).fill(0);p.forEach(r=>[...r.bits].forEach((c,i)=>{if(c!=='1')w[i]++}));
  return w.map((x,i)=>({q:i+1,p:Math.round(x/p.length*100)})).sort((a,b)=>b.p-a.p).slice(0,k)}
const colorFor=p=>p>=70?'var(--good)':p>=45?'var(--accent)':'var(--low)';

function findDups(list){const m={};list.forEach(s=>{const k=s.class_id+'|'+nKey(s.name);(m[k]=m[k]||[]).push(s)});

const digits=x=>String(x||'').replace(/\D/g,'');
function searchBox(ph){return `<label class="search">${I.search}<input id="gq" type="search" autocomplete="off" placeholder="${ph}" value="${esc(gq)}" aria-label="Qidirish"></label><div id="gres">${searchRes()}</div>`}
function searchRes(){
  let raw=String(gq); const cm=raw.match(/(^|\s)(\d{1,2})\s*-?\s*([a-zA-Zа-яА-Я])(?=\s|$)/); const want=cm?(cm[2]+'-'+cm[3]).toUpperCase():'';
  if(cm)raw=raw.replace(cm[0],' ');
  const t=norm(raw).trim().split(/\s+/).filter(Boolean); if(!t.length&&!want)return'';
  const okC=n=>!want||String(n||'').toUpperCase()===want;
  const hit=(words,phone)=>t.every(x=>words.some(w=>w.startsWith(x))||(x.length>=4&&/^\d+$/.test(x)&&digits(phone).includes(x)));
  const many=S.schools.length>1;
  const st=X.st.filter(s=>okC(s.cls)&&hit(norm(`${s.name} ${s.cls||''} ${s.num||''} maktab`).split(' ').filter(Boolean),s.phone)).sort((a,b)=>a.name.localeCompare(b.name,'uz'));
  const ppl=[];
  if(isTeam()||S.me.role==='direktor'){
    S.classes.forEach(c=>{if((c.teacher_name||c.teacher_phone)&&okC(c.name)){const sc=X.sc[c.school_id];if(hit(norm(`${c.teacher_name||''} ${c.name} ${sc?.num||''} maktab rahbar`).split(' ').filter(Boolean),c.teacher_phone))ppl.push({go:'class:'+c.id,n:c.teacher_name||'Ismi kiritilmagan',s:`Sinf rahbari · ${many?sc?.num+'-maktab · ':''}${c.name}`})}});
    if(isTeam()&&!want)S.schools.forEach(sc=>{if(sc.director_name||sc.director_phone){if(hit(norm(`${sc.director_name||''} ${sc.num} maktab direktor`).split(' ').filter(Boolean),sc.director_phone))ppl.push({go:'school:'+sc.id,n:sc.director_name||'Ismi kiritilmagan',s:`Direktor · ${sc.num}-maktab`})}});
  }
  if(!st.length&&!ppl.length)return `<div class="empty">Hech narsa topilmadi. Harflarni tekshiring.</div>`;
  const sub=s=>`${many?s.num+'-maktab · ':''}${s.cls||''}`;
  return `${ppl.length?`<section class="sec"><p class="label">Xodimlar · ${ppl.length}</p><div class="card list">${ppl.slice(0,15).map(x=>`<button class="row" data-go="${x.go}"><div class="m"><div class="n">${esc(x.n)}</div><div class="s">${esc(x.s)}</div></div>${I.chev}</button>`).join('')}</div></section>`:''}
  ${st.length?`<section class="sec"><p class="label">O’quvchilar · ${st.length}</p><div class="card list">${st.slice(0,30).map((x,i)=>stuRow(x,i,{sub})).join('')}</div>${st.length>30?`<p class="note">Yana ${st.length-30} ta bor. Qidiruvni aniqroq yozing.</p>`:''}</section>`:''}`}

function scrItest(id){

  if(itClass&&!cls.some(c=>c.id===itClass))itClass=0;

  const done=ll.filter(s=>{const r=IR(t.id,s.id);return r&&!r.absent});const abs=ll.filter(s=>IR(t.id,s.id)?.absent).length;
  const sorted=[...ll].sort((a,b)=>(IR(t.id,b.id)?.absent?-2:IR(t.id,b.id)?.score??-1)-(IR(t.id,a.id)?.absent?-2:IR(t.id,a.id)?.score??-1)||a.name.localeCompare(b.name,'uz'));

  const rows=sorted.map((s,i)=>{const r=IR(t.id,s.id);const ok=r&&!r.absent;if(ok&&r.score!==prev){place=i+1;prev=r.score}

      :r?.absent?`<span class="pill gray">kelmadi</span>`:ok?`<div class="num">${r.score}/${t.qn}<small>${p}%</small></div>`:`<span class="pill gray">—</span>`;

const REC={on:false,to:'',data:'',mr:null,ch:[],t0:0,tm:0,stream:null,drop:false};
const AUD={};
const recFmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function recBox(to){let h='';
  if(REC.to===to&&REC.on)h=`<div class="card pad" style="flex-direction:row;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--wrong);animation:pulse 1s infinite;flex:none"></span><b id="recT" style="font-variant-numeric:tabular-nums">${recFmt(Math.floor((Date.now()-REC.t0)/1000))}</b><span class="note">Ovoz yozilmoqda… eng ko’pi 3 daqiqa</span></div>`;
  else if(REC.to===to&&REC.data)h=`<div class="card pad" style="flex-direction:row;align-items:center;gap:10px"><audio controls src="${REC.data}" style="flex:1;min-width:0;height:40px"></audio><button class="btn dan sm" data-act="recDel">O’chirish</button></div>`;
  return `<div id="recbox-${to}">${h}</div>`}
function recBtn(to){const on=REC.on&&REC.to===to;return `<span id="recbtn-${to}" style="display:contents"><button class="btn ${on?'dan':'sec'}" data-act="${on?'recStop':'recStart'}" data-to="${to}">${on?'■ To’xtatish':'🎤 Ovoz'}</button></span>`}
function recRedraw(){['cm','rp'].forEach(to=>{const b=$('#recbox-'+to);if(b)b.outerHTML=recBox(to);const t=$('#recbtn-'+to);if(t)t.outerHTML=recBtn(to)})}
async function recStart(to){
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Bu brauzerda ovoz yozib bo’lmaydi. Chrome orqali oching.',true);return}
  if(REC.on)return; recClear();
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Mikrofonga ruxsat berilmadi. Brauzer sozlamasidan ruxsat bering.',true);return}
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m=>MediaRecorder.isTypeSupported?.(m))||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{});
  Object.assign(REC,{on:true,to,data:'',mr,ch:[],t0:Date.now(),stream,drop:false});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.ch.push(e.data)};

        pdf.setFillColor(232,170,20);pdf.lines(pts.slice(1).map((p,k)=>[p[0]-pts[k][0],p[1]-pts[k][1]]),pts[0][0],pts[0][1],[1,1],'F',true)}});
  });

// imzo/muhr rasmidan qog'oz fonini olib tashlab, faqat siyohni qoldiradi va chetlarini kesadi
function inkOnly(img){
  if(!img)return null;
  try{const W=img.width,H=img.height,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(img,0,0);
    const d=g.getImageData(0,0,W,H),p=d.data;
    // fon rangi: chetlardagi piksellarning o'rtachasi
    let r=0,gg=0,b=0,n=0;const add=i=>{r+=p[i];gg+=p[i+1];b+=p[i+2];n++};
    for(let x=0;x<W;x+=4){add((x)*4);add(((H-1)*W+x)*4)}for(let y=0;y<H;y+=4){add((y*W)*4);add((y*W+W-1)*4)}
    r/=n;gg/=n;b/=n;
    let x0=W,y0=H,x1=0,y1=0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(p[i+3]<10){p[i+3]=0;continue}
      // ko'k/rangli siyoh rang to'yinganligidan, qora siyoh esa fondan ancha to'qligidan topiladi (soya va notekis yorug'lik hisobga olinmaydi)
      const mx=Math.max(p[i],p[i+1],p[i+2]),mn=Math.min(p[i],p[i+1],p[i+2]),chroma=(mx-mn)-(Math.max(r,gg,b)-Math.min(r,gg,b));
      const dark=(r+gg+b)/3-(p[i]+p[i+1]+p[i+2])/3;
      const a=Math.max(0,Math.min(1,Math.max((chroma-14)/30,(dark-60)/40)));
      p[i+3]=Math.round(p[i+3]*a);
      if(a>.5){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}}
    g.putImageData(d,0,0);
    if(x1<=x0||y1<=y0)return img;
    const pad=Math.round(Math.max(x1-x0,y1-y0)*.04);x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
    const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o}
  catch(e){return img}}

  const tests=[...new Set(all.map(c=>c.test_id))];if(cfTest&&!tests.includes(cfTest))cfTest=0;

  l=l.filter(c=>!cfSchool||c.s.school_id===cfSchool);
  const grades=[...new Set(l.map(c=>c.s.grade))].filter(Boolean).sort((a,b)=>a-b);if(cfGrade&&!grades.includes(cfGrade)){cfGrade=0;cfClass=0}

// generator → bitta savol: {q, o[4], a, s, t}
function makeQ(key,topic){const g=G[key];if(!g)return null;
  for(let tries=0;tries<12;tries++){let r;try{r=g()}catch(e){continue}
    if(!r||r.a==null)continue;const A=fN(r.a);
    const ws=[...new Set((r.w||[]).map(fN))].filter(x=>x!==A&&x!=='NaN'&&x!=='undefined'&&!/-\d|NaN|undefined|Infinity/.test(x));
    if(ws.length<1)continue;
    const opts=shuf([A,...shuf(ws).slice(0,3)]);
    return {q:r.q,o:opts,a:opts.indexOf(A),s:r.s||'',t:topic||''}}
  return null}
// bir xil savol ikki marta tushmasin
function makeSet(key,topic,n){const out=[],seen=new Set();for(let i=0;i<n*6&&out.length<n;i++){const q=makeQ(key,topic);if(q&&!seen.has(q.q)){seen.add(q.q);out.push(q)}}return out}
const topicList=g=>(MV[g]||[]).flatMap(([sec,ts],si)=>ts.map(([name,key],ti)=>({id:`${g}-${si+1}-${ti+1}`,sec,si,name,key,g})));
const topicById=id=>{const g=+String(id).split('-')[0];return topicList(g).find(t=>t.id===id)||null};

function spark(pts){const W=600,H=120,p=14;const n=pts.length;const x=i=>p+(n<2?0:i*(W-2*p)/(n-1)),y=v=>H-p-(v/100)*(H-2*p);

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-label="Natijalar o‘zgarishi">${[25,50,75].map(v=>`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="4 4"/>`).join('')}
   <polyline fill="none" stroke="var(--navy)" stroke-opacity=".35" stroke-width="2" points="${pts.map((q,i)=>`${x(i)},${y(q.p)}`).join(' ')}" vector-effect="non-scaling-stroke"/>
   ${pts.map((q,i)=>`<circle cx="${x(i)}" cy="${y(q.p)}" r="5" fill="${col(q.k)}" vector-effect="non-scaling-stroke"><title>${esc(q.n)}: ${q.p}%</title></circle>`).join('')}</svg>`}

function printTest(qs,title,variants=1){const c=myCls();const sc=S.schools[0];
  const vs=variants>1?[qs,...Array.from({length:variants-1},()=>shuf(qs).map(q=>{const o=shuf(q.o.map((x,k)=>({x,k})));return {...q,o:o.map(y=>y.x),a:o.findIndex(y=>y.k===q.a)}}))]:[qs];
  const page=(v,vi)=>`<section class="pg"><div class="hd"><div><b>${esc(S.school?.name||'KARAKUL INTERNATIONAL SCHOOL')}</b> · Yosh Xorazmiylar</div><div>${sc?.num?sc.num+'-maktab · ':''}${esc(c?.name||'')} sinf</div></div>
   <h1>${esc(title)}${variants>1?` · ${vi+1}-variant`:''}</h1><div class="nm">Familiya, ism: ______________________________ &nbsp; Sana: ____________</div>
   <ol>${v.map(q=>`<li><div class="q">${esc(q.q)}</div><div class="o">${q.o.map((o,k)=>`<span>${'ABCDE'[k]}) ${esc(o)}</span>`).join('')}</div></li>`).join('')}</ol>
   <div class="ans"><b>Javoblar:</b> ${v.map((q,i)=>`<span>${i+1}. ___</span>`).join('')}</div></section>`;
  const key=`<section class="pg key"><h1>Javoblar kaliti · ${esc(title)}</h1><p>Faqat o’qituvchi uchun.</p>${vs.map((v,vi)=>`<h2>${variants>1?`${vi+1}-variant`:''}</h2><table><tr>${v.map((q,i)=>`<td><b>${i+1}</b><br>${'ABCDE'[q.a]}</td>`).join('')}</tr></table>`).join('')}</section>`;
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>
   @page{size:A4;margin:14mm}body{font-family:Arial,sans-serif;color:#111;font-size:12.5pt}.pg{page-break-after:always}.pg:last-child{page-break-after:auto}
   .hd{display:flex;justify-content:space-between;font-size:10pt;border-bottom:1.5px solid #13244f;padding-bottom:6px;color:#13244f}
   h1{font-size:15pt;margin:12px 0 6px}.nm{margin:4px 0 12px;font-size:11pt}ol{padding-left:22px;margin:0}li{margin:0 0 10px;break-inside:avoid}
   .q{font-weight:600;margin-bottom:4px}.o{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 12px}.ans{margin-top:12px;border-top:1px dashed #999;padding-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11pt}
   table{border-collapse:collapse;margin:6px 0 14px}td{border:1px solid #888;padding:4px 8px;text-align:center;font-size:11pt}.key p{color:#666}
  </style></head><body>${vs.map(page).join('')}${key}</body></html>`;
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  f.contentDocument.open();f.contentDocument.write(html);f.contentDocument.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('Chop etib bo’lmadi',true)}setTimeout(()=>f.remove(),60000)},400)}

   <label class="search">${I.search}<input id="msgq" type="search" autocomplete="off" placeholder="Bola ismi yoki xabar…" value="${esc(msgQ)}" aria-label="Xabarlarni qidirish"></label>
   <div class="seg">${[['all','Hammasi'],['ota','Ota-ona'],['sinf','Sinf'],['drh','Direktor'],['jamoa','Jamoa']].map(([k,l])=>`<button data-ra="msgF" data-rv="${k}" aria-pressed="${msgF===k}">${l}${k==='all'?'':''}</button>`).join('')}</div>`}
function rahbarMsgFilter(list){let l=list;if(msgF!=='all')l=l.filter(t=>msgF==='drh'?['drh','drhs','dotalar'].includes(t.kind):t.kind===msgF);
  const q=norm(msgQ).trim();if(q)l=l.filter(t=>norm(t.title+' '+(t.last?.text||'')).includes(q));
  return [...l].sort((a,b)=>(b.unread>0)-(a.unread>0)||String(b.updated_at).localeCompare(String(a.updated_at)))}

// ================================================================ OTA-ONA: ustoz topshiriqlari va yechish
function parentAsgSection(kid){if(!ASG){loadAsg();return '<div class="card empty">Yuklanmoqda…</div>'}
  const rows=(ASG.rows||[]).filter(a=>a.student_id===kid.id);if(!rows.length)return '';
  const open=rows.filter(a=>!a.done),done=rows.filter(a=>a.done);
  const card=a=>`<button class="card row" data-ra="solve" data-rv="${a.id}" data-rs="${kid.id}" style="width:100%"><span style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:${a.kind==='sinov'?'#fde7cf':'#dff1ef'};flex:none;font-size:18px">${a.kind==='sinov'?'🧪':'📝'}</span><div class="m"><div class="n">${esc(a.title)}</div><div class="s">${a.questions.length} savol${a.minutes?` · ${a.minutes} daqiqa`:''}${a.due&&!a.done?` · muddat ${dd(a.due)}`:''}</div></div>${a.done?`<div class="num">${a.score}/${a.qn}<small>${pc(a.score,a.qn)}%</small></div>`:`<span class="pill ${a.due&&a.due<ASG.today?'warn':'ok'}">${a.started_at&&a.kind==='sinov'?'davom':'yangi'}</span>`}</button>`;
  return `<section class="sec"><p class="label">Ustoz topshiriqlari${open.length?` · ${open.length} ta yangi`:''}</p>${open.map(card).join('')}
   ${done.length?`<details><summary class="lnk" style="cursor:pointer">Bajarilganlar (${done.length})</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${done.map(card).join('')}</div></details>`:''}</section>`}
let SV=null,svTimer=0;
function openSolve(aid,sid){const a=(ASG?.rows||[]).find(x=>x.id===aid&&x.student_id===sid);if(!a)return;
  SV={a,sid,ans:Array(a.questions.length).fill(-1),res:a.done?{score:a.score,qn:a.qn,questions:a.questions,answers:a.answers}:null,started:a.started_at};
  drawSolve()}
function drawSolve(){const {a,res}=SV;const kid=X.st.find(s=>s.id===SV.sid);clearInterval(svTimer);
  const head=`<div class="sh-top"><div class="m"><h2>${esc(a.title)}</h2><div class="s">${esc(kid?.name||'')} · ${a.questions.length} savol${a.minutes?` · ${a.minutes} daqiqa`:''}</div></div><button class="ib" data-ra="svClose" aria-label="Yopish">${I.x}</button></div>`;
  if(res){const p=pc(res.score,res.qn);
    openSheet(`${head}<div class="card hero" style="text-align:center;align-items:center"><div class="big">${res.score}<small>/${res.qn}</small></div><p style="margin:0;font-weight:600">${p>=80?'Ajoyib! Barakalla! 🌟':p>=50?'Yaxshi! Xatolar ustida ishlaymiz 👍':'Harakat qildingiz! Xatolarni birga ko’rib chiqing 💪'}</p></div>
     ${res.questions.map((q,i)=>{const my=res.answers[i];return `<div class="qcard"><div class="qt"><b>${i+1}.</b> ${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<div class="opt ${k===q.a?'ok':k===my?'no':''}"><span class="L">${'ABCDE'[k]}</span>${esc(o)}</div>`).join('')}</div>${my!==q.a?`<div class="note">${my<0?'Javob berilmagan. ':''}To’g’ri javob: <b>${esc(q.o[q.a])}</b>${q.s?` — ${esc(q.s)}`:''}</div>`:''}</div>`}).join('')}
     <button class="btn pri" data-ra="svClose">Yopish</button>`);return}
  if(a.kind==='sinov'&&!SV.started){openSheet(`${head}<div class="card pad" style="text-align:center;align-items:center;gap:14px"><div style="font-size:44px">🧪</div><b style="font-size:18px">Online sinov</b><p style="margin:0">${a.questions.length} ta savol, vaqt — <b>${a.minutes} daqiqa</b>.</p><p class="note">“Boshlash”ni bosganingizdan keyin vaqt ketadi. Javoblar sinov oxirida ko’rinadi. Farzandingiz o’zi yechsin.</p><button class="btn pri" data-ra="svStart" style="width:100%">Boshlash</button></div>`);return}
  const left=()=>a.minutes&&SV.started?Math.max(0,Math.round((new Date(SV.started).getTime()+a.minutes*60000-Date.now())/1000)):null;
  const n=SV.ans.filter(x=>x>=0).length;
  openSheet(`${head}${a.kind==='sinov'?`<div class="timer"><span>⏱ <span id="svT">${recFmt(left()??0)}</span></span><span>${n}/${a.questions.length}</span></div>`:`<div class="bar" style="height:8px"><i style="width:${n/a.questions.length*100}%"></i></div>`}
   ${a.questions.map((q,i)=>`<div class="qcard" id="svq${i}"><div class="qt"><b>${i+1}.</b> ${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-ra="svPick" data-rv="${i}:${k}" aria-pressed="${SV.ans[i]===k}"><span class="L">${'ABCDE'[k]}</span>${esc(o)}</button>`).join('')}</div></div>`).join('')}
   <div class="actions"><button class="btn sec" data-ra="svClose">Keyinroq</button><button class="btn pri" data-ra="svSubmit">Topshirish (${n}/${a.questions.length})</button></div>`);
  if(a.kind==='sinov'){svTimer=setInterval(()=>{const l=left();const el=$('#svT');if(el)el.textContent=recFmt(l);if(l<=0){clearInterval(svTimer);svSubmit(true)}},1000)}}
async function svSubmit(auto){if(!SV||SV.res)return;try{const r=await api('asg.submit',{id:SV.a.id,student_id:SV.sid,answers:SV.ans});SV.res=r;if(auto)toast('Vaqt tugadi, javoblar topshirildi');loadAsg(true);load(true);drawSolve()}catch(e){toast(e.message,true)}}

  ota:()=>[['farzand','Farzandim',I.home],['mashq','Mashq',I.pen,(S.exNew||0)+(S.asgNew||0)],['xabar','Ustoz',I.chat,S.unread]],

function screen(){
  const top=stack[stack.length-1];
  if(top){const [k,v]=top.split(':');
    if(k==='itest')return scrItest(+v);
    if(k==='mv')return scrTopic(v); if(k==='asg')return scrAsg(+v); if(k==='pinless')return scrPinless();
    if(k==='school')return scrSchool(+v); if(k==='class')return scrClass(+v); if(k==='stu')return scrStudent(+v);
    if(k==='tests')return scrTests(); if(k==='pins')return scrPins(); if(k==='team')return scrTeam(); if(k==='history')return scrHistory();
    if(k==='savat')return scrTrash();
    if(k==='info')return scrInfo(); if(k==='phones')return scrPhones(); if(k==='backup')return scrBackup(); if(k==='resimport')return scrResImport();
    if(k==='certs')return scrCerts(); if(k==='mashq')return scrExTeam(); if(k==='settings')return scrSettings(); if(k==='reyting')return scrRanking(); if(k==='yuqori')return scrTop();}
  const r=S.me.role;
  if(tab==='xabar')return scrMessages();
  if(isTeam())return tab==='maktab'?scrSchools():tab==='kirit'?scrEntry():tab==='more'?scrMore():scrTeamHome();
  if(r==='direktor')return tab==='tahlil'?scrDirAnalysis():tab==='ichki'?scrItests():scrDirHome();
  if(r==='rahbar')return tab==='tahlil'?scrRTahlil():tab==='sinf'?scrRSinf():tab==='mavzu'?scrRMavzu():tab==='mashq'?scrRAsg():tab==='sinov'?scrRSinov():scrRBosh();
  return tab==='mashq'?scrExParent():scrParent();
}

// ---- atmosfera
const THEME={mavzu:'mint',sinov:'sand',ichki:'sand',bosh:'sky',sinf:'sky',farzand:'sky',maktab:'mint',kirit:'sand',xabar:'lilac',more:'rose',tahlil:'dusk',mashq:'sun'};
(function atmo(){
  const tk=document.getElementById('tk'),dg=document.getElementById('dg'),gl=document.getElementById('gl');if(!gl)return;
  let t='';for(let i=0;i<72;i++){const a=i*5*Math.PI/180,r1=i%6?284:276;t+=`<line x1="${310+Math.cos(a)*r1}" y1="${310+Math.sin(a)*r1}" x2="${310+Math.cos(a)*300}" y2="${310+Math.sin(a)*300}" stroke-width="${i%6?1:2}"/>`}if(tk)tk.innerHTML=t;
  const D='٠١٢٣٤٥٦٧٨٩';let d='';for(let i=0;i<10;i++){const a=(i*36-90)*Math.PI/180;d+=`<text x="${310+Math.cos(a)*240}" y="${318+Math.sin(a)*240}">${D[i]}</text>`}if(dg)dg.innerHTML=d;
  const G=['x²','π','√','∑','÷','=','7','3','9','∞','△','½','+','×','a+b','%','0','1'];
  const n=innerWidth>=900?18:7;let h='';
  for(let i=0;i<n;i++){h+=`<span class="g" style="--x:${(i*97)%100}vw;--s:${16+(i*7)%26}px;--d:${38+(i*13)%40}s;--w:-${(i*11)%60}s;--r:${(i%2?1:-1)*(20+i*9)}deg">${G[i%G.length]}</span>`}
  gl.innerHTML=h;
})();

  NAV.set({tab,stack,hs:histStudent??null});
  document.body.dataset.theme=THEME[tab]||'sky';
  const [title,sub,body]=screen();
  const focus=document.activeElement?.id==='q', gfocus=document.activeElement?.id==='gq';
  $('#app').innerHTML=`<header class="top gut">${stack.length?`<button class="ib" data-act="back" aria-label="Orqaga">${I.back}</button>`:''}
   <h1>${esc(title)}<span class="sub">${esc(sub)}</span></h1><span class="role">${ROLE_L[S.me.role]}</span><button data-act="avPick" aria-label="Profil rasmi" style="border:0;background:none;padding:0;cursor:pointer;flex:none">${avHtml(S.me.avatar,36,S.me.name)}</button>

let histD=+(history.state?.yxd||0),navSkip=0,navT=0,exitArmed=false;
function firstTab(){if(!S)return null;const t=TABS[isTeam()?'team':S.me.role]();return t[0]?.[0]||null}
function appDepth(){if(!S)return 0;return (exitArmed?0:1)+(!$('#sheet').hidden?1:0)+stack.length+(tab&&tab!==firstTab()?1:0)}
function navSync(){if(!navT)navT=setTimeout(navDo,0)}
function navDo(){navT=0;if(navSkip)return;const d=appDepth();
  try{if(d>histD){for(let i=histD+1;i<=d;i++)history.pushState({yxd:i},'');histD=d}
  else if(d<histD){const n=d-histD;histD=d;navSkip=1;history.go(n)}}catch(e){}}
addEventListener('popstate',e=>{
  if($('#zoom')&&!navSkip){closeZoom();try{history.pushState({yxd:histD},'')}catch(_){}return} // orqaga: avval kattalashtirilgan rasm yopiladi
  if(navSkip){navSkip=0;navDo();return}
  const d=+(e.state?.yxd||0);
  while(appDepth()>d){
    if(!$('#sheet').hidden)closeSheet();
    else if(stack.length)stack.pop();
    else if(tab&&tab!==firstTab()){tab=firstTab();stack=[]}
    else break}
  if(d===0&&S&&!exitArmed){exitArmed=true;toast('Chiqish uchun yana bir marta bosing')}
  histD=d;render();scrollTo(0,0)});

   case 'impSave':{const num=val('impNum');if(!num){toast('Maktab raqamini yozing',true);break}const r=await api('students.import',{school_num:num,rows:IMP,test_id:testId});closeSheet();toast(`${r.added} ta qo’shildi${r.skipped?`, ${r.skipped} ta avvaldan bor edi`:''}${r.results?`, ${r.results} ta natija yozildi`:''}${r.absents?`, ${r.absents} ta kelmadi`:''}`,!!r.errors?.length);if(r.errors?.length)alert('Natija yozilmadi:\n'+r.errors.join('\n'));await load();break}

     formSheet(d.id?'Sinovni tahrirlash':'Yangi sinov',[{id:'fTN',label:'Nomi',value:t.name,ph:'2026–2027 · 1-bosqich'},{id:'fTD',label:'Sana',type:'date',value:t.date},{id:'fTS',label:'Holati',type:'select',options:STATUS.slice(0,3).concat(t.status==='yakunlandi'?[STATUS[3]]:[]),value:t.status},{id:'fTG',label:'Iqtidorli: eng yaxshi necha foiz',value:t.gifted_top,mode:'numeric'},{id:'fTM',label:'Iqtidorli: kamida necha foiz ball',value:t.gifted_min,mode:'numeric'}],'testSave');$('#sheet').dataset.id=d.id||'';break}
   case 'dupFix':{const pairs=d.ids.split(',').map(x=>x.split('-').map(Number)).filter(x=>x[0]&&x[1]);
     if(!confirm(`${pairs.length} ta ortiqcha nusxa olib tashlanadi. Natijasi bor nusxa qoladi, ortiqchasidagi telefon va boshqa ma’lumotlar unga o’tkaziladi.`))break;
     const r=await api('students.merge',{pairs});toast(`${r.n} ta ortiqcha nusxa olib tashlandi`);await load();break}
   case 'itEdit':openItEdit(+d.id||0,+d.school||S.schools[0]?.id);break;
   case 'itSave':{const sh=$('#sheet').dataset;const r=await api('itest.save',{id:+sh.id||undefined,school_id:+sh.school,name:val('itN'),subject:val('itS'),day:val('itD'),qn:val('itQ'),grade:val('itG')[0]==='g'?+val('itG').slice(1):0,class_id:val('itG')[0]==='c'?+val('itG').slice(1):0});closeSheet();toast('Saqlandi');await load();if(!sh.id){stack.push('itest:'+r.id);render()}break}
   case 'itDel':{if(!confirm('Bu ichki sinov va uning hamma natijalari o’chiriladi. 30 kun ichida “O’chirilganlar” bo’limidan qaytarish mumkin. Davom etasizmi?'))break;await api('itest.delete',{id:+d.id});stack.pop();toast('O’chirildi');await load();break}
   case 'irAbs':{const tid=+(stack[stack.length-1]||'').split(':')[1];const r=IR(tid,+d.sid);await api('iresult.save',r?.absent?{itest_id:tid,student_id:+d.sid,clear:1}:{itest_id:tid,student_id:+d.sid,absent:1});await load();break}
   case 'avPick':openAvPick(0);break;
   case 'kidAv':openAvPick(+d.id);break;
   case 'avUpload':{const kid=+d.kid;pickImage(async u=>{try{if(kid){const r=await api('student.avatar',{id:kid,avatar:u});const s=(S.students||[]).find(x=>x.id===kid);if(s)s.avatar='ph:'+r.v}else{await api('me.avatar',{avatar:u});S.me.avatar=u}closeSheet();toast('Surat saqlandi');render()}catch(e){toast(e.message,true)}},kid?200:240);break}
   case 'avNudgeOff':ls.set('avn',1);render();break;
   case 'avSet':{const kid=+d.kid;if(kid){await api('student.avatar',{id:kid,avatar:d.v});const s=(S.students||[]).find(x=>x.id===kid);if(s)s.avatar=''}else{await api('me.avatar',{avatar:d.v});S.me.avatar=d.v}closeSheet();toast('Saqlandi');render();break}
   case 'reload':location.reload();break;
   case 'delOpen':openDel(d.k,+d.id);break;
   case 'delGo':{const k=d.k,id=+d.id;await api(k+'.delete',{id,confirm:val('delConf')});closeSheet();TRASH=null;if(k!=='test'){while(stack.length&&/^(school|class|stu|itest):/.test(stack[stack.length-1]))stack.pop()}if(k==='test'&&testId===id){testId=0}toast('O’chirildi. “O’chirilganlar” bo’limidan qaytarish mumkin');await load();break}
   case 'trRestore':{await api('trash.restore',{id:+d.id});TRASH=null;toast('Qaytarildi');await load();break}
   case 'trPurge':{if(!confirm('Butunlay o’chirilsinmi? Keyin qaytarib bo’lmaydi.'))break;await api('trash.purge',{id:+d.id});TRASH=null;toast('Butunlay o’chirildi');render();break}
   case 'absRest':{const n=+d.n,where=d.k==='class'?`${X.cl[+d.id]?.name} sinfida`:`${X.sc[+d.id]?.num}-maktabda`;
     if(!confirm(`${where} natijasi kiritilmagan ${n} ta bola “Kelmadi” deb belgilanadi.\n\nBarcha kelgan bolalar natijasi kiritib bo’lindimi?`))break;
     const r=await api('results.absentRest',{test_id:testId,[d.k==='class'?'class_id':'school_id']:+d.id});toast(`${r.n} ta bola “Kelmadi” deb belgilandi`);await load();break}
   case 'toCheck':{const t=S.tests.find(x=>x.id===+d.id);if(!t)break;if(!confirm('Barcha maktablarda sinov o’tkazildimi? Sinov Tekshiruv bosqichiga o’tadi.'))break;
     await api('test.save',{id:t.id,name:t.name,date:t.date,status:'tekshiruv',gifted_top:t.gifted_top,gifted_min:t.gifted_min});toast('Tekshiruvga o’tkazildi');await load();break}
   case 'testSave':{const r=await api('test.save',{id:+$('#sheet').dataset.id||undefined,name:val('fTN'),date:val('fTD'),status:val('fTS'),gifted_top:val('fTG'),gifted_min:val('fTM')});if(!testId){testId=r.id;ls.set('test',testId)}closeSheet();toast('Saqlandi');await load();break}
   case 'keyEdit':{const tid=+d.id;const k=S.keys?.[tid]||{};openSheet(`<div class="sh-top"><div class="m"><h2>Kalit kiritish</h2><div class="s">Har sinf uchun javoblar ketma-ket, masalan: ABECDCBDCE…</div></div><button class="ib" data-act="close">${I.x}</button></div>
     ${[2,3,4].map(g=>`<label class="field"><span class="label">${g}-sinf</span><input id="key${g}" value="${esc(k[g]&&!k[g].includes('?')?k[g]:'')}" autocapitalize="characters" placeholder="${k[g]?'kiritilgan':'20 ta harf'}" style="font-family:ui-monospace,monospace;letter-spacing:.1em"></label>`).join('')}
     <p class="note">Kalit o’zgartirilsa, shu sinovdagi harflar bilan kiritilgan natijalar o’zi qayta hisoblanadi.</p><button class="btn pri" data-act="keySave" data-id="${tid}">Saqlash</button>`);break}
   case 'keySave':{let n=0;for(const g of [2,3,4]){const v=val('key'+g).toUpperCase().replace(/[^A-E]/g,'');if(v){await api('key.save',{test_id:+d.id,grade:g,key:v});n++}}closeSheet();toast(n?'Kalit saqlandi':'O’zgarish yo’q');await load();break}
   case 'pinIssue':{const r=await api('pin.issue',{kind:d.k,ref:d.r});PINS=null;showPin(r,d.k);render();break}
   case 'pinMenu':{const x=PINS.find(p=>p.kind===d.k&&String(p.ref)===d.r);openSheet(`<div class="sh-top"><div class="m"><h2>${esc(x.name)}</h2><div class="s">${ph(x.phone)}</div></div><button class="ib" data-act="close">${I.x}</button></div>
     <div class="card pad" style="align-items:center"><span class="code">${esc(x.user.pin)}</span><span class="note">Berilgan: ${fmtDate(x.user.pin_at)}${x.user.last_login?' · oxirgi kirish '+fmtDate(x.user.last_login):' · hali kirmagan'}</span></div>
     <button class="btn sec" data-act="pinShow" data-k="${x.kind}" data-r="${esc(x.ref)}">SMS matnini ko’rsatish</button>
     <button class="btn sec" data-act="pinIssue" data-k="${x.kind}" data-r="${esc(x.ref)}">Yangi PIN berish</button>
     <button class="btn dan" data-act="pinRevoke" data-id="${x.user.id}">PIN’ni o’chirish</button>`);break}
   case 'pinShow':{const x=PINS.find(p=>p.kind===d.k&&String(p.ref)===d.r);showPin({pin:x.user.pin,name:x.name,phone:x.phone},x.kind);break}
   case 'pinRevoke':await api('pin.revoke',{user_id:+d.id});closeSheet();PINS=null;toast('PIN o’chirildi');render();break;
   case 'pinBulk':{const l=PINS.filter(x=>x.kind===pinKind&&(!pinSchool||x.school_id===pinSchool)&&!x.user?.pin&&(x.phone||x.kind!=='ota'));
     openSheet(`<div class="sh-top"><div class="m"><h2>${l.length} ta PIN berilsinmi?</h2><div class="s">Har biriga alohida 6 xonali PIN yaratiladi</div></div><button class="ib" data-act="close">${I.x}</button></div><button class="btn pri" data-act="pinBulkGo">Ha, PIN berish</button><button class="btn sec" data-act="close">Bekor qilish</button>`);break}
   case 'pinBulkGo':{const l=PINS.filter(x=>x.kind===pinKind&&(!pinSchool||x.school_id===pinSchool)&&!x.user?.pin&&(x.phone||x.kind!=='ota'));const out=[];
     for(const x of l){try{out.push({...(await api('pin.issue',{kind:x.kind,ref:x.ref})),kind:x.kind})}catch(err){}}
     PINS=null;openSheet(`<div class="sh-top"><div class="m"><h2>${out.length} ta PIN berildi</h2><div class="s">Har biriga bosib SMS yuboring</div></div><button class="ib" data-act="close">${I.x}</button></div>
     <div class="card list">${out.map(o=>`<div class="row"><div class="m"><div class="n">${esc(o.name)}</div><div class="s">${ph(o.phone)}</div></div><span class="num" style="font-family:var(--display)">${o.pin}</span>${o.phone?`<a class="btn pri sm" style="text-decoration:none" href="sms:+998${o.phone}?body=${encodeURIComponent(smsText(o.pin,o.kind))}">SMS</a>`:''}</div>`).join('')}</div>`);render();break}
   case 'copySms':{const t=$('#smsText').textContent;try{await navigator.clipboard.writeText(t);toast('Nusxalandi')}catch(err){toast('Nusxalab bo’lmadi. Matnni bosib turib nusxalang',true)}break}
   case 'teamEdit':{const u=d.id?(S.team||[]).find(x=>x.id===+d.id):{perms:{kiritish:true}};const PL={kiritish:'Natija kiritish',maktab:'Maktab, sinf, o’quvchi, sinov qo’shish',tuzatish:'Natijani tekshirish va tuzatish',kalit:'Kalitni ko’rish (sinovdan keyin)',reyting:'Tuman reytingi',pinlar:'PIN ro’yxatini ko’rish',pin_korish:'PIN raqamlarini ko’rish',tarix:'O’zgarishlar tarixi',xabar:'Xabarlarga javob berish',mashq:'Mashg’ulot qo’shish'};
     openSheet(`<div class="sh-top"><div class="m"><h2>${d.id?esc(u.name):'Yangi a’zo'}</h2></div><button class="ib" data-act="close">${I.x}</button></div>
     <label class="field"><span class="label">Ism familiya</span><input id="tmN" value="${esc(u.name||'')}"></label><label class="field"><span class="label">Telefon</span><input id="tmP" type="tel" inputmode="tel" placeholder="90 123 45 67" value="${esc(u.phone||'')}"><span class="note" style="margin-top:4px;font-size:12.5px">${TG_HINT}</span></label>
     <div class="card list"><label class="check"><input type="checkbox" id="pm_sardor" ${u.perms.sardor?'checked':''} data-act="sardorToggle"><b>Jamoa sardori</b>&nbsp;— e’lonni tasdiqlaydi</label>${Object.entries(PL).map(([k,l])=>`<label class="check"><input type="checkbox" id="pm_${k}" ${u.perms[k]?'checked':''}>${l}</label>`).join('')}</div>
     <p class="note">PIN berish faqat sizda qoladi.</p><button class="btn pri" data-act="teamSave" data-id="${d.id||''}">Saqlash</button>${d.id?`<button class="btn dan" data-act="teamRemove" data-id="${d.id}">Jamoadan chiqarish</button>`:''}`);
     $('#pm_sardor').onchange=e=>{if(e.target.checked)Object.keys(PL).forEach(k=>{if(k!=='pin_korish')$('#pm_'+k).checked=true})};break}
   case 'teamSave':{PINS=null;const perms={sardor:$('#pm_sardor').checked};S.perms.forEach(k=>perms[k]=$('#pm_'+k)?.checked||false);const r=await api('team.save',{id:+d.id||undefined,name:val('tmN'),phone:val('tmP'),perms});
     if(r.pin)showPin({pin:r.pin,name:val('tmN'),phone:val('tmP').replace(/\D/g,'').slice(-9)},'jamoa');else{closeSheet();toast('Saqlandi')}await load();break}
   case 'teamRemove':await api('team.remove',{id:+d.id});closeSheet();toast('Jamoadan chiqarildi');await load();break;
   case 'noteSave':{const t=val('noteText');if(!t)break;await api('note.save',{student_id:+d.id,text:t});toast('Izoh saqlandi');await load();break}
   case 'noteSummary':await api('note.summary',{id:+d.id});await load();break;
   case 'history':stack.push('history');HIST=null;histStudent=+d.id;render();scrollTo(0,0);break;
   case 'resImport':{let j;try{j=JSON.parse(val('resImp'))}catch(err){$('#resImpMsg').textContent='Matn noto’g’ri. To’liq nusxalanganini tekshiring.';break}
     const r=await api('results.import',{test_id:testId,rows:j.rows||j});$('#resImpMsg').textContent=`${r.ok} ta natija qo’shildi.${r.miss.length?' Topilmadi: '+r.miss.join('; '):''}`;await load();break}
  }}catch(err){toast(err.message,true)}
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(!S&&/^\d$/.test(e.key)){document.querySelector(`[data-d="${e.key}"]`)?.click()}if(!S&&e.key==='Backspace'){pin=pin.slice(0,-1);render()}});
if(location.pathname.startsWith('/t/'))renderVerify(decodeURIComponent(location.pathname.slice(3)));else load().then(flushQueue);
</script>
