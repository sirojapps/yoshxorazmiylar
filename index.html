<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Yosh Xorazmiylar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap">
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface2:#eef2f7; --fg:#1e293b; --muted:#64748b; --line:#e5eaf1;
  --navy:#2f4f8f; --stage:linear-gradient(135deg,#e9f3ff 0%,#e7f8f5 100%); --stage-fg:#1e293b; --stage-lb:#0b7f7c; --stage-line:rgba(15,157,154,.18); --stage-on:#12a39f; --accent:#12a39f; --accent-strong:#0b8581; --accent-soft:#e0f5f3; --gold:#a07612; --gold-soft:#f8ecd0;
  --good:#1f8a4c; --low:#6a7792; --wrong:#c2414b; --wrong-soft:#f7dfe1; --blank:#c3cad8; --on-accent:#fff;
  --display:"Golos Text",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media not all{:root{
  --bg:#0e1424; --surface:#161e33; --surface2:#1e2842; --fg:#e7ecf6; --muted:#9aa6bf; --line:#2a3552;
  --navy:#8fb0ff; --stage:linear-gradient(135deg,#1a2540 0%,#16303a 100%); --stage-fg:#e7ecf6; --stage-lb:#7fdcd7; --stage-line:rgba(255,255,255,.18); --stage-on:#5fe0d9; --accent:#2fb8b3; --accent-strong:#3cc7c2; --accent-soft:#163b3d; --gold:#e3b54a; --gold-soft:#3b3218;
  --good:#4cc47f; --low:#8d99b3; --wrong:#ee6b74; --wrong-soft:#41222a; --blank:#3a4562; --on-accent:#06201f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.xsteps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.xsteps span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);text-align:center}
.xsteps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}
.xsteps .done i{background:var(--accent-soft);color:var(--accent-strong)}.xsteps .on i{background:var(--accent);color:var(--on-accent)}.xsteps .on{color:var(--fg);font-weight:600}
.xstep>summary,.xsch>summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer}
.xstep>summary::-webkit-details-marker,.xsch>summary::-webkit-details-marker{display:none}
.xstep>summary>i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface2);color:var(--muted)}
.xstep.on>summary>i{background:var(--accent);color:var(--on-accent)}.xstep.done>summary>i{background:var(--accent-soft);color:var(--accent-strong)}
.xstep.on{border-color:var(--accent)}
.xstep .n,.xsch .n{font-weight:600}.xstep .s,.xsch .s{font-size:12.5px;color:var(--muted)}
.xbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.xsch{background:var(--bg)}.xcls{gap:8px;flex-wrap:wrap}.xcls .m{flex:1 1 100%}
.qa{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.scan{position:fixed;inset:0;z-index:40;background:#0b1220;color:#fff;display:flex;flex-direction:column;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.scan .scan-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0b1220;position:sticky;top:0;z-index:2}
.scan .scan-top .m{flex:1;min-width:0}.scan .scan-top b{display:block;font-size:15px}.scan .scan-top small{color:#9fb0cc;font-size:12px}
.scan .ib{background:rgba(255,255,255,.12);color:#fff}.scan .btn.sec{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
.scan-cam{position:relative;flex:1;min-height:52vh;display:grid;place-items:center;overflow:hidden;background:#000}
.scan-cam video{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
.scan-guide{position:absolute;width:88%;aspect-ratio:210/148.5;max-height:80%;pointer-events:none}
.scan-guide i{position:absolute;width:26px;height:26px;border:3px solid #5fe0d9}
.scan-guide i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.scan-guide i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.scan-guide i:nth-child(3){right:0;bottom:0;border-left:0;border-top:0}.scan-guide i:nth-child(4){left:0;bottom:0;border-right:0;border-top:0}
.scan-msg{padding:12px 16px;text-align:center;font-size:14px;color:#dbe6f7;min-height:46px}
.scan-ok{margin:10px 14px 0;padding:10px 12px;border-radius:12px;background:#14532d;display:flex;align-items:center;gap:10px}
.scan-ok .m{flex:1;min-width:0}.scan-ok b{display:block}.scan-ok small{color:#c9f2d7}
.scan-bot{display:flex;gap:10px;justify-content:center;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.scan-body{background:var(--bg);color:var(--fg);flex:1;padding:14px 16px 30px;display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.scan-body .btn.sec{background:var(--surface2);color:var(--fg)}
.scan-img{width:100%;border-radius:12px;border:1px solid var(--line)}
.scan-ans{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scan-ans button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center}
.scan-ans small{font-size:11px;color:var(--muted)}.scan-ans b{font-size:17px}
.scan-ans .e b{color:var(--muted)}.scan-ans .u{border-color:#e0a800;background:#fff6d6}.scan-ans .x{border-color:var(--wrong);background:var(--wrong-soft)}.scan-ans .x b{color:var(--wrong)}

.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);flex:none}
.role{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-strong);background:var(--accent-soft);padding:4px 8px;border-radius:999px;flex:none}
main{flex:1;padding-block:16px 100px;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent-strong)}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.stage{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--stage);color:var(--stage-fg);border:1px solid var(--line);border-radius:16px}
.stage .t{font-family:var(--display);font-size:17px;font-weight:700}
.stage .slb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--stage-lb)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps span{font-size:11px;text-align:center;padding-top:7px;border-top:3px solid var(--stage-line);opacity:.65;border-radius:2px}
.steps span.on{border-color:var(--stage-on);opacity:1;font-weight:600}
.steps span.done{border-color:var(--stage-on);opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;overflow:hidden}
.list>*{border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
.row .m{flex:1;min-width:0}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;flex:none}
.num small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.rank{width:24px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;flex:none}
.chev{color:var(--muted);flex:none}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.gray{background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent-strong)}
.pill.warn{background:var(--wrong-soft);color:var(--wrong)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(20,33,61,.12)}
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.q{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.q.ok{background:var(--accent-soft);color:var(--accent-strong)}
.q.no{background:var(--wrong-soft);color:var(--wrong)}
.q.bl{background:var(--surface2);color:var(--muted);border:1px dashed var(--blank)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hero{padding:18px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:17px;color:var(--muted);font-weight:500}
.cmp{display:flex;flex-direction:column;gap:10px;padding:14px}
.cmp .r{display:grid;grid-template-columns:104px 1fr 46px;align-items:center;gap:10px;font-size:13.5px}
.cmp .track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.cmp .track i{display:block;height:100%;border-radius:5px}
.note{font-size:13px;color:var(--muted);margin:0}
.inst{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:12px}
.inst .go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px 0;text-align:left;font-size:14px;font-weight:600;color:var(--accent-strong)}
.inst .go img{width:26px;height:26px;flex:none}
.inst .go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inst .ib{width:32px;height:32px;background:none;color:var(--muted)}
.warnc{border-color:var(--gold);background:var(--gold-soft)}
.isteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.hard{display:flex;gap:6px;flex-wrap:wrap}
.hard span{padding:6px 10px;border-radius:10px;background:var(--wrong-soft);color:var(--wrong);font-size:13px;font-weight:600}
.hard span small{font-weight:500;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:13px;font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:disabled{opacity:.45}
.btn.sec{background:var(--surface2)}
.btn.dan{background:var(--wrong-soft);color:var(--wrong)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.lnk{color:var(--accent-strong);font-weight:600;font-size:14px;padding:6px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.field textarea{min-height:110px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.check{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.empty{padding:20px 16px;text-align:center;color:var(--muted);font-size:14px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:13px 14px 13px 42px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 30px}
.sh-top{display:flex;align-items:flex-start;gap:12px}
.sh-top .m{flex:1;min-width:0}
.sh-top h2{font-size:20px;margin:0;line-height:1.25}
.sh-top .s{color:var(--muted);font-size:13.5px}
.score{display:flex;align-items:baseline;gap:8px;padding:14px 16px}
.score b{font-family:var(--display);font-size:32px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.score .r{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1/.82;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--display);font-size:20px;font-weight:500;display:grid;place-items:center}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.letters{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.lcol{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:22px repeat(5,1fr);gap:3px;align-items:center}
.lrow>span{font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;padding-right:3px}
.lb{height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.lb[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--wrong);color:#fff}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:44px 32px;text-align:center}
.logo{width:140px;height:140px}
.login h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0;color:var(--navy)}
.pinbox{display:flex;gap:8px;justify-content:center}
.pinbox span{width:42px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.pinbox span.f{border-color:var(--accent)}
.kp{display:grid;grid-template-columns:repeat(3,74px);gap:10px;justify-content:center}
.kp button{height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:600}
.err{color:var(--wrong);font-size:14px;min-height:20px;margin:0}
.code{font-family:var(--display);font-size:22px;letter-spacing:.12em;color:var(--accent-strong)}
.sms{white-space:pre-wrap;font-size:14px;background:var(--surface2);padding:12px;border-radius:10px}
.tbl{overflow-x:auto}
.ti{position:relative;display:inline-flex}
.tabs .badge{position:absolute;top:-4px;right:-10px}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--wrong);color:#fff;font-size:11px;font-weight:700;margin-left:6px}
.msgs{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:14px 14px 4px 14px}
.bubble .who{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.bubble img{display:block;max-width:100%;border-radius:10px;margin-top:6px;cursor:zoom-in}
.bubble .who{display:flex;align-items:center;gap:6px}
.bubble .mm{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px 0 8px;cursor:pointer}
.bubble .ma{display:flex;gap:14px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
.bubble .ma button{border:0;background:none;padding:2px 0;font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-strong);cursor:pointer}
.bubble .ma button.del{color:var(--wrong)}
.bubble .ed{font-size:11px;color:var(--muted);margin-top:3px;text-align:right}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;overflow:auto}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
.zoom .zb{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;right:12px}
.zoom .zb a,.zoom .zb button{display:inline-grid;place-items:center;height:42px;min-width:42px;padding:0 14px;border-radius:21px;border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.offline{background:var(--gold-soft);color:var(--fg);font-size:13px;padding:8px 14px;border-radius:10px}
@media (min-width:900px){
.app:has(> .tabs){max-width:none;margin:0 0 0 256px}
.app:has(> .tabs) .top,.app:has(> .tabs) main{padding-left:40px;padding-right:40px}

async function load(auto){

}

function idx(){
  const sc=Object.fromEntries((S.schools||[]).map(x=>[x.id,x]));
  const cl=Object.fromEntries((S.classes||[]).map(x=>[x.id,x]));
  const st=(S.students||[]).map(s=>{const c=cl[s.class_id]||{};return{...s,cls:c.name,grade:c.grade,school_id:c.school_id,num:sc[c.school_id]?.num}});
  const res={};(S.results||[]).forEach(r=>{(res[r.test_id]||={})[r.student_id]=r});
  return{sc,cl,st,res};
}
let X=null; // cached indexes per render
const curTest=()=>S.tests.find(t=>t.id===testId)||null;
const R=(sid,tid=testId)=>X.res[tid]?.[sid]||null;
const pct=r=>r&&!r.absent&&r.score!=null?(r.qn===100?Math.round(r.score*10)/10:Math.round(r.score/r.qn*100)):null; // 100 ballik: ball o'zi (15,5 → 15,5), yaxlitlanmaydi
const r1=x=>Math.round(x*10)/10, pf=x=>x==null?'—':String(x).replace('.',',');
// teng ball bo'lsa o'rin: avval qiyin guruhlar (16–20, 11–15 …) bo'yicha to'g'ri javoblar soni, keyin oxirgi savoldan boshlab
function tieCmp(a,b){const x=a?.bits||'',y=b?.bits||'';if(!x||!y||x.length!==y.length||a.qn!==100)return 0;const n=x.length,one=(s,i,j)=>[...s.slice(i,j)].filter(c=>c==='1').length;
  for(let g=Math.floor((n-1)/5);g>=0;g--){const d=one(y,g*5,g*5+5)-one(x,g*5,g*5+5);if(d)return d}
  for(let i=n-1;i>=0;i--){if(x[i]!==y[i])return x[i]==='1'?-1:1}return 0}
const resCmp=(a,b)=>{const d=(b?.score??-1)-(a?.score??-1);return Math.abs(d)>1e-9?d:tieCmp(a,b)};
// 100 ballik tizim: score — ball, qn — 100; ok — to'g'ri javoblar soni
const num=x=>String(Math.round(x*100)/100).replace('.',',');
const is100=r=>r&&r.qn===100;
const bl=r=>is100(r)?`${num(r.score)} ball`:`${r.score}/${r.qn}`;
const blSm=r=>is100(r)?`${num(r.score)}<small>ball</small>`:`${r.score}/${r.qn}<small>${pf(pct(r))}%</small>`;
const blBig=r=>is100(r)?`${num(r.score)}<small> ball${r.ok!=null?` · ${r.ok}/${r.nq} to’g’ri`:''}</small>`:`${r.score}<small>/${r.qn} · ${pct(r)}%</small>`;
const wPts=(w,bits)=>w&&w.length===bits.length?bits.reduce((a,x,i)=>a+(x==='1'?w[i]:0),0):null;
function avgPct(list,tid=testId){const v=list.map(s=>pct(R(s.id,tid))).filter(x=>x!=null);return v.length?r1(v.reduce((a,b)=>a+b,0)/v.length):null}
function present(list,tid=testId){return list.filter(s=>{const r=R(s.id,tid);return r&&!r.absent})}
function giftedSet(tid=testId){
  const t=S.tests.find(x=>x.id===tid);const set=new Set();if(!t)return set;
  if(!isTeam()){(S.gifted||[]).forEach(k=>{const[a,b]=k.split(':');if(+a===tid)set.add(+b)});return set}
  [...new Set(X.st.map(s=>s.school_id+':'+s.grade))].forEach(g=>{ // har bir maktab va sinf bosqichi alohida
    const p=present(X.st.filter(s=>s.school_id+':'+s.grade===g),tid).map(s=>R(s.id,tid)).filter(r=>r.score!=null).sort((a,b)=>b.score-a.score);
    if(!p.length)return;const cut=p[Math.max(0,Math.ceil(p.length*t.gifted_top/100)-1)].score;
    p.forEach(r=>{if(r.score>=cut&&r.score/r.qn*100>=t.gifted_min)set.add(r.student_id)});});
  return set;
}
function hardest(list,k=5,tid=testId){const p=present(list,tid).map(s=>R(s.id,tid)).filter(r=>r.bits);if(!p.length)return[];
  const n=Math.max(...p.map(r=>r.bits.length));const w=Array(n).fill(0);p.forEach(r=>[...r.bits].forEach((c,i)=>{if(c!=='1')w[i]++}));
  return w.map((x,i)=>({q:i+1,p:Math.round(x/p.length*100)})).sort((a,b)=>b.p-a.p).slice(0,k)}
const colorFor=p=>p>=70?'var(--good)':p>=45?'var(--accent)':'var(--low)';

  let steps,i,note='';
  if(sid){
    steps=['Kutilmoqda','Kiritilmoqda','Tekshiruv','E’lon'];
    i=ap.done?3:!n?0:left>0?1:2;
  }else{
    steps=STATUS.map(x=>x[1]);

    i=Math.max(auto,STATUS.findIndex(x=>x[0]===t.status));

  if(i===0&&!n)note=sid?'Hali birorta natija kiritilmagan.':'';

  else if(i===1)note=`${left?`<b>${left}</b> ta o’quvchi hali kiritilmagan. `:''}Barcha maktablarda sinov o’tkazilib bo’lgach, sinovni Tekshiruvga o’tkazing.${P('maktab')?`<div style="margin-top:10px"><button class="btn sec sm" data-act="toCheck" data-id="${t.id}">Tekshiruvga o’tkazish</button></div>`:''}`;
  else if(i===2)note=sid?`Hamma kiritildi. E’lon uchun tasdiq: ${ap.ceo?'CEO ✓':'CEO'} · ${ap.hasSardor?(ap.sardor?'Sardor ✓':'Sardor'):'sardor yo’q'}`:'Hamma kiritildi. Maktablar e’lon qilingach, sinovni yakunlang.';
  return `<div class="stage"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="slb">${sid?`${X.sc[sid]?.num}-maktab · bosqich`:'Joriy sinov'}</div><div class="t">${esc(t.name)}</div></div>
   <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${isTeam()&&S.tests.length>1?`<button class="pill gray" data-act="pickTest" style="color:var(--fg)">almashtirish</button>`:''}${isTeam()?`<button class="pill gray" data-go="exam:${t.id}" style="color:var(--fg)">ochish →</button>`:''}</span></div>
   <div class="steps">${steps.map((s,k)=>`<span class="${k<i?'done':k===i?'on':''}">${s}</span>`).join('')}</div>${note?`<div style="font-size:13px;opacity:.85">${note}</div>`:''}</div>`}
const absBtn=(k,id,n)=>n>0&&P('kiritish')&&curTest()?`<div style="margin-top:10px"><button class="btn sec sm" data-act="absRest" data-k="${k}" data-id="${id}" data-n="${n}">Qolgan ${n} tasini “Kelmadi” qilish</button></div>`:'';

const nKey=n=>String(n||'').toLowerCase().replace(/[`‘’'ʻʼ´]/g,"'").replace(/\s+/g,' ').trim();
function findDups(list){const m={};list.forEach(s=>{const k=s.class_id+'|'+nKey(s.name);(m[k]=m[k]||[]).push(s)});
  return Object.values(m).filter(g=>g.length>1).map(g=>{
    const rank=s=>{const r=R(s.id);return !r?0:r.absent?1:2};
    const sorted=[...g].sort((a,b)=>rank(b)-rank(a)||a.id-b.id);const keep=sorted[0];
    const extra=sorted.slice(1).filter(s=>rank(s)<2); // natijasi bor ikkinchisini o'zi o'chirmaydi
    return{g,keep,extra,manual:sorted.slice(1).some(s=>rank(s)===2)}})}
function dupBox(list){if(!isTeam())return'';const d=findDups(list);if(!d.length)return'';
  const st=s=>{const r=R(s.id);return !r?'kiritilmagan':r.absent?'kelmadi':bl(r)};
  const fix=d.flatMap(x=>x.extra.map(s=>x.keep.id+'-'+s.id));
  return `<div class="card pad warnc" style="gap:10px"><p class="label" style="margin:0;color:var(--wrong)">⚠ Ikki marta kiritilgan bolalar: ${d.length} ta</p>
   <p class="note" style="margin:0">Bir sinfda bir xil familiya va ism bir necha marta bor. Ortiqchasini o’chiring, aks holda “Kelmadi” bo’lib qoladi.</p>
   <div class="card list">${d.map(x=>x.g.map(s=>`<button class="row" data-go="stu:${s.id}"><div class="m"><div class="n">${esc(s.name)}</div><div class="s">${esc(s.cls||'')} · ${st(s)}${x.extra.includes(s)?' · <b style="color:var(--wrong)">ortiqcha</b>':''}</div></div>${I.chev}</button>`).join('')).join('')}</div>
   ${d.some(x=>x.manual)?`<p class="note" style="margin:0">Ba’zilarida ikkalasiga ham ball kiritilgan — qaysi biri to’g’riligini ochib ko’rib, keraksizini o’zingiz o’chiring.</p>`:''}
   ${fix.length&&ED()?`<button class="btn sec sm" data-act="dupFix" data-ids="${fix.join(',')}">Ortiqchalarini o’chirish (${fix.length} ta)</button>`:''}</div>`}

  if(sortBy==='ism')a.sort((x,y)=>x.name.localeCompare(y.name,'uz'));
  else{const k=id=>{const r=R(id);return !r?-3:r.absent?-2:r.score??-1}; // avval qatnashganlar (0 ball ham), keyin kelmaganlar, oxirida kiritilmaganlar
    a.sort((x,y)=>k(y.id)-k(x.id)||x.name.localeCompare(y.name,'uz'))}return a}

const SHOW_HARD=false;
function hardBox(list,title){if(!SHOW_HARD)return '';
  const t=curTest(); if(!t)return'';
  const blocks=[...new Set(list.map(s=>s.grade))].filter(Boolean).sort((a,b)=>a-b).map(g=>{
    const gl=list.filter(s=>s.grade===g); const n=present(gl).filter(s=>R(s.id)?.bits).length;
    const h=hardest(gl).filter(x=>x.p>0); if(!h.length)return'';
    return `<div class="card pad"><div class="sec-h"><b>${g}-sinf testi</b><span class="pill gray">${n} ta bola</span></div>
     <div class="hard">${h.map(x=>`<span>${x.q}-savol <small>· ${x.p}% xato</small></span>`).join('')}</div>

  if(!blocks.length)return'';

   <p class="note" style="margin:0">«${esc(t.name)}» sinovi bo’yicha. Har sinfning testi alohida, shuning uchun savollar sinflar bo’yicha ajratilgan. Foiz — shu savolga noto’g’ri javob bergan yoki javob bermagan bolalar ulushi.</p>
   ${blocks.join('')}
   ${isTeam()?`<p class="note">Biror savolni ko’pchilik xato qilgan bo’lsa, e’londan oldin shu sinf kalitini tekshirib ko’ring.</p>`:''}</section>`}
function gradeBars(list){return `<div class="card cmp">${[...new Set(list.map(s=>s.grade))].sort().map(g=>{const v=avgPct(list.filter(s=>s.grade===g));

function qGrid(r){if(r&&!r.absent&&r.mode==='ball')return `<div class="card pad"><p class="note" style="margin:0">Bu sinovda faqat umumiy ball kiritilgan. Savollar bo’yicha ma’lumot yo’q.</p></div>`;if(!r||r.absent||!r.bits)return'';
  return `<div class="card pad"><div class="qgrid">${[...r.bits].map((c,i)=>{const a=r.answers?.[i];const cls=c==='1'?'ok':(a==='-'?'bl':'no');return `<div class="q ${cls}" title="${i+1}-savol${a&&a!=='-'?': '+a:''}">${i+1}</div>`}).join('')}</div>
  <div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>to’g’ri</span><span><i style="background:var(--wrong-soft);border:1px solid var(--wrong)"></i>xato</span>${r.mode==='harf'?`<span><i style="background:var(--surface2);border:1px dashed var(--blank)"></i>javobsiz</span>`:''}</div></div>`}

const digits=x=>String(x||'').replace(/\D/g,'');
function searchBox(ph){return `<label class="search">${I.search}<input id="gq" type="search" autocomplete="off" placeholder="${ph}" value="${esc(gq)}" aria-label="Qidirish"></label><div id="gres">${searchRes()}</div>`}
function searchRes(){
  let raw=String(gq); const cm=raw.match(/(^|\s)(\d{1,2})\s*-?\s*([a-zA-Zа-яА-Я])(?=\s|$)/); const want=cm?(cm[2]+'-'+cm[3]).toUpperCase():'';
  if(cm)raw=raw.replace(cm[0],' ');
  const t=norm(raw).trim().split(/\s+/).filter(Boolean); if(!t.length&&!want)return'';
  const okC=n=>!want||String(n||'').toUpperCase()===want;
  const hit=(words,phone)=>t.every(x=>words.some(w=>w.startsWith(x))||(x.length>=4&&/^\d+$/.test(x)&&digits(phone).includes(x)));
  const many=S.schools.length>1;
  const st=X.st.filter(s=>okC(s.cls)&&hit(norm(`${s.name} ${s.cls||''} ${s.num||''} maktab`).split(' ').filter(Boolean),s.phone)).sort((a,b)=>a.name.localeCompare(b.name,'uz'));
  const ppl=[];
  if(isTeam()||S.me.role==='direktor'){
    S.classes.forEach(c=>{if((c.teacher_name||c.teacher_phone)&&okC(c.name)){const sc=X.sc[c.school_id];if(hit(norm(`${c.teacher_name||''} ${c.name} ${sc?.num||''} maktab rahbar`).split(' ').filter(Boolean),c.teacher_phone))ppl.push({go:'class:'+c.id,n:c.teacher_name||'Ismi kiritilmagan',s:`Sinf rahbari · ${many?sc?.num+'-maktab · ':''}${c.name}`})}});
    if(isTeam()&&!want)S.schools.forEach(sc=>{if(sc.director_name||sc.director_phone){if(hit(norm(`${sc.director_name||''} ${sc.num} maktab direktor`).split(' ').filter(Boolean),sc.director_phone))ppl.push({go:'school:'+sc.id,n:sc.director_name||'Ismi kiritilmagan',s:`Direktor · ${sc.num}-maktab`})}});
  }
  if(!st.length&&!ppl.length)return `<div class="empty">Hech narsa topilmadi. Harflarni tekshiring.</div>`;
  const sub=s=>`${many?s.num+'-maktab · ':''}${s.cls||''}`;
  return `${ppl.length?`<section class="sec"><p class="label">Xodimlar · ${ppl.length}</p><div class="card list">${ppl.slice(0,15).map(x=>`<button class="row" data-go="${x.go}"><div class="m"><div class="n">${esc(x.n)}</div><div class="s">${esc(x.s)}</div></div>${I.chev}</button>`).join('')}</div></section>`:''}
  ${st.length?`<section class="sec"><p class="label">O’quvchilar · ${st.length}</p><div class="card list">${st.slice(0,30).map((x,i)=>stuRow(x,i,{sub})).join('')}</div>${st.length>30?`<p class="note">Yana ${st.length-30} ta bor. Qidiruvni aniqroq yozing.</p>`:''}</section>`:''}`}

// tanlangan bosqich/imtihonlar bo'yicha reyting: bittasi yoki birgalikda (o'rtacha foiz).
// Birgalikda: faqat hammasiga qatnashgan bolalar o'rin oladi, qolganlari alohida ko'rsatiladi.
let rSel=null, rSchool=0;
function rankTests(){const ok=S.tests.filter(t=>(S.results||[]).some(r=>r.test_id===t.id&&!r.absent));
  rSel=(rSel||[]).filter(id=>ok.some(t=>t.id===id));if(!rSel.length){const d=ok.find(t=>t.id===testId)||ok[0];rSel=d?[d.id]:[]}return ok}
function comboPct(sid){if(!rSel.length)return null;const v=rSel.map(tid=>pct(R(sid,tid)));return v.some(x=>x==null)?null:r1(v.reduce((a,b)=>a+b,0)/v.length)}
const anyPct=sid=>rSel.some(tid=>pct(R(sid,tid))!=null);
function rankAvg(l){const v=l.map(s=>comboPct(s.id)).filter(x=>x!=null);return v.length?{v:r1(v.reduce((a,b)=>a+b,0)/v.length),c:v.length}:null}
function scrRanking(){
  const ok=rankTests();const one=rSel.length===1;
  const grades=[...new Set(S.classes.map(c=>c.grade))].sort((a,b)=>a-b);if(!grades.includes(rGrade)&&grades.length)rGrade=grades[0];
  if(rSchool&&!X.sc[rSchool])rSchool=0;
  const st=X.st.filter(s=>s.grade===rGrade&&(!rSchool||s.school_id===rSchool));const gifted=one?giftedSet(rSel[0]):new Set();
  let body='';
  if(rMode==='bola'){const full=st.filter(s=>comboPct(s.id)!=null).sort((a,b)=>one?resCmp(R(a.id,rSel[0]),R(b.id,rSel[0])):comboPct(b.id)-comboPct(a.id)),part=st.filter(s=>comboPct(s.id)==null&&anyPct(s.id));
    const RR=s=>R(s.id,rSel[0]),plc=[];full.forEach((s,i)=>{plc[i]=i&&(one?resCmp(RR(full[i-1]),RR(s))===0:comboPct(full[i-1].id)===comboPct(s.id))?plc[i-1]:i+1});
    const tieUp=i=>one&&i!=null&&full[i+1]&&Math.abs(RR(full[i]).score-RR(full[i+1]).score)<1e-9&&tieCmp(RR(full[i]),RR(full[i+1]))<0;
    const row=(s,i)=>{const r=one?R(s.id,rSel[0]):null;const g=gifted.has(s.id);
      return `<button class="row" data-go="stu:${s.id}">${i!=null?`<span class="rank">${plc[i]}</span>`:''}<div class="m"><div class="n">${esc(s.name)}</div><div class="s">${s.num}-maktab · ${esc(s.cls)}${g?' <span class="pill gold">★ iqtidorli</span>':''}${tieUp(i)?' <span class="pill gray">▲ qiyin savollar hisobiga</span>':''}</div></div>
       ${i==null?`<span class="pill gray">${rSel.filter(tid=>pct(R(s.id,tid))!=null).length} / ${rSel.length} ta</span>`:one?`<div class="num">${blSm(r)}</div>`:`<div class="num">${pf(comboPct(s.id))}%</div>`}</button>`};
    body=`<div class="card list">${full.slice(0,100).map((s,i)=>row(s,i)).join('')||'<div class="empty">Natija yo’q</div>'}</div>
     ${part.length?`<details class="sec"><summary class="label" style="cursor:pointer">Hammasiga qatnashmaganlar (${part.length})</summary><p class="note">Tanlangan imtihonlardan biriga kelmagan bolalar o’rin olmaydi.</p><div class="card list">${part.map(s=>row(s,null)).join('')}</div></details>`:''}`}
  else if(rMode==='maktab'){const r=S.schools.filter(sc=>!rSchool||sc.id===rSchool).map(sc=>({sc,a:rankAvg(st.filter(s=>s.school_id===sc.id))})).filter(x=>x.a).sort((a,b)=>b.a.v-a.a.v);
    body=`<div class="card list">${r.map((x,i)=>`<button class="row" data-go="school:${x.sc.id}"><span class="rank">${i+1}</span><div class="m"><div class="n">${x.sc.num}-maktab</div><div class="s">${x.a.c} ta bola</div></div><div class="num">${pf(x.a.v)}%</div></button>`).join('')||'<div class="empty">Natija yo’q</div>'}</div>`}
  else if(rMode==='iqt'){ // butun tuman (yoki tanlangan maktab) iqtidorlilari — hamma sinflar bitta sahifada
    if(!one)body=`<div class="card empty">Iqtidorlilar bitta imtihon bo’yicha aniqlanadi. Yuqoridan bitta imtihonni tanlang.</div>`;
    else{const tid=rSel[0];const all=X.st.filter(s=>gifted.has(s.id)&&(!rSchool||s.school_id===rSchool));
     const byG=grades.map(g=>[g,all.filter(s=>s.grade===g)]).filter(x=>x[1].length);
     body=`<div class="card hero"><p class="label">${rSchool?X.sc[rSchool].num+'-maktab':'Butun tuman'} · jami iqtidorlilar</p><div class="big">${all.length}<small> ta</small></div><p class="note">${byG.map(([g,l])=>`${g}-sinf: <b>${l.length}</b>`).join(' · ')||'Bu imtihonda hali iqtidorli yo’q'}</p></div>
     ${byG.map(([g,l])=>{const so=[...l].sort((a,b)=>resCmp(R(a.id,tid),R(b.id,tid)));const pl=[];so.forEach((s,i)=>{pl[i]=i&&resCmp(R(so[i-1].id,tid),R(s.id,tid))===0?pl[i-1]:i+1});
      return `<section class="sec"><div class="sec-h"><p class="label">${g}-sinf</p><span class="pill gold">${l.length} ta</span></div><div class="card list">${so.map((s,i)=>`<button class="row" data-go="stu:${s.id}"><span class="rank">${pl[i]}</span><div class="m"><div class="n">${esc(s.name)}</div><div class="s">${s.num}-maktab · ${esc(s.cls)}</div></div><div class="num">${blSm(R(s.id,tid))}</div></button>`).join('')}</div></section>`}).join('')}`}}
  else{const r=S.classes.filter(c=>c.grade===rGrade&&(!rSchool||c.school_id===rSchool)).map(c=>({c,a:rankAvg(st.filter(s=>s.class_id===c.id))})).filter(x=>x.a).sort((a,b)=>b.a.v-a.a.v);
    body=`<div class="card list">${r.map((x,i)=>`<button class="row" data-go="class:${x.c.id}"><span class="rank">${i+1}</span><div class="m"><div class="n">${X.sc[x.c.school_id].num}-maktab · ${esc(x.c.name)}</div><div class="s">${x.a.c} ta bola</div></div><div class="num">${pf(x.a.v)}%</div></button>`).join('')||'<div class="empty">Natija yo’q</div>'}</div>`}
  const t1=one?S.tests.find(t=>t.id===rSel[0]):null;
  return ['Reyting',one?t1?.name||'':`${rSel.length} ta imtihon birgalikda`,`
  <div class="card pad"><p class="label" style="margin:0">Qaysi bosqich yoki imtihonlar bo’yicha?</p><div class="chips">${ok.map(t=>`<button class="chip" data-rt="${t.id}" aria-pressed="${rSel.includes(t.id)}">${rSel.includes(t.id)?'✓ ':''}${esc(t.name)}</button>`).join('')||'<span class="note">Hali natija yo’q</span>'}</div>
   <p class="note" style="margin:0">${one?'Bittasini tanlasangiz — shu imtihon bo’yicha. Bir nechtasini belgilasangiz — birgalikda (o’rtacha foiz) hisoblanadi.':'Birgalikda: tanlangan imtihonlardagi foizlarning o’rtachasi. Hammasiga qatnashgan bolalargina o’rin oladi.'}</p></div>
  <div class="seg"><button data-rsc="0" aria-pressed="${!rSchool}">Butun tuman</button>${[...S.schools].sort((a,b)=>a.num-b.num).map(sc=>`<button data-rsc="${sc.id}" aria-pressed="${rSchool===sc.id}">${sc.num}-maktab</button>`).join('')}</div>
  ${rMode==='iqt'?'':`<div class="seg">${grades.map(g=>`<button data-rg="${g}" aria-pressed="${rGrade===g}">${g}-sinf</button>`).join('')}</div>`}
  <div class="seg">${[['bola','O’quvchilar'],['maktab','Maktablar'],['sinf','Sinflar'],['iqt','★ Iqtidorlilar']].map(([k,l])=>`<button data-rm="${k}" aria-pressed="${rMode===k}">${l}</button>`).join('')}</div>
  ${one&&t1&&present(X.st,t1.id).length?`<button class="btn sec" data-act="rankDl" data-id="${t1.id}">⬇ Natijalarni yuklab olish</button>`:''}
  ${body}${one&&t1?`<p class="note">★ iqtidorli: o’z maktabida, o’z sinf bosqichida eng yaxshi ${t1.gifted_top??10}% ichida va kamida ${t1.gifted_min??70}%.</p>`:''}
  <p class="note">Viloyat reytingi boshqa tumanlar qo’shilganda shu yerda chiqadi.</p>`]}
// ---------------- yuqori natijalar: chegaradan yuqori olgan barcha bolalar (hamma maktablar)
function topStu(min=topMin,g=topGrade,sc=topSchool){
  return present(X.st).filter(s=>{const r=R(s.id);return r.score!=null&&pct(r)>=min&&(!g||s.grade===g)&&(!sc||s.school_id===sc)})
   .sort((a,b)=>pct(R(b.id))-pct(R(a.id))||a.name.localeCompare(b.name,'uz'))}
function topList(){const l=topStu();const many=S.schools.length>1;
  return `<div class="sec-h"><p class="label">${topMin}% va undan yuqori</p><span class="pill gold">${l.length} ta bola</span></div>
  ${l.length?`<div class="card list">${l.map((s,i)=>stuRow(s,i,{rank:true,sub:s=>`${many?s.num+'-maktab · ':''}${s.cls}`})).join('')}</div>`:`<div class="card empty">Bu chegaradan yuqori natija yo’q. Foizni pasaytirib ko’ring.</div>`}`}
function scrTop(){
  const grades=[...new Set(X.st.map(s=>s.grade))].filter(Boolean).sort((a,b)=>a-b);if(topGrade&&!grades.includes(topGrade))topGrade=0;
  if(topSchool&&!X.sc[topSchool])topSchool=0;
  return ['Yuqori natijalar',curTest()?.name||'',`
  <div class="card pad"><label style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span>Kamida necha foiz?</span>
   <input id="topMin" type="number" inputmode="numeric" min="0" max="100" value="${topMin}" style="width:84px;padding:8px;border-radius:10px;border:1px solid var(--line,#ccd);font:inherit;text-align:center"></label>
   <p class="note" style="margin:0">Masalan 70 — 70% va undan yuqori olgan barcha bolalar chiqadi.</p></div>
  ${grades.length>1?`<div class="seg"><button data-tg="0" aria-pressed="${!topGrade}">Hammasi</button>${grades.map(g=>`<button data-tg="${g}" aria-pressed="${topGrade===g}">${g}-sinflar</button>`).join('')}</div>`:''}
  ${S.schools.length>1?`<div class="seg"><button data-ts="0" aria-pressed="${!topSchool}">Barcha maktablar</button>${[...S.schools].sort((a,b)=>a.num-b.num).map(sc=>`<button data-ts="${sc.id}" aria-pressed="${topSchool===sc.id}">${sc.num}-maktab</button>`).join('')}</div>`:''}
  ${dlBtn('top')}

// ---------------- entry (kiritish)
function scrEntry(){

  if(!t)return ['Kiritish','',`<div class="card empty">Avval sinov yarating.</div>`];
  const st=X.st.filter(s=>covers(t,X.cl[s.class_id])); const done=st.filter(s=>R(s.id)).length; const pq=queue().length;
  return ['Kiritish',t.name,`
  ${pq?`<div class="offline">${pq} ta natija hali yuborilmagan. Internet kelishi bilan o’zi yuboriladi.</div>`:''}
  <div class="card pad"><div class="sec-h"><span class="note">Kiritildi</span><b class="num">${done} / ${st.length}</b></div><div class="bar" style="margin:0"><i style="width:${st.length?done/st.length*100:0}%"></i></div></div>
  <label class="search">${I.search}<input id="q" type="search" autocomplete="off" placeholder="Familiya yoki ism…" value="${esc(q)}" aria-label="Bolani qidirish"></label>
  <div class="seg"><button data-qs="0" aria-pressed="${qSchool===0}">Hammasi</button>${S.schools.map(sc=>`<button data-qs="${sc.id}" aria-pressed="${qSchool===sc.id}">${sc.num}-maktab</button>`).join('')}</div>
  <div id="res">${entryList()}</div>
  ${P('maktab')||P('kiritish')?`<button class="lnk" data-act="studentEdit" data-quick="1" style="align-self:flex-start">+ Ro’yxatda yo’q bolani qo’shish</button>`:''}`]}
function entryList(){
  const ct=curTest();const pool=X.st.filter(s=>(!qSchool||s.school_id===qSchool)&&covers(ct,X.cl[s.class_id]));
  const t=norm(q).trim().split(/\s+/).filter(Boolean);
  if(!t.length){const mine=(S.results||[]).filter(r=>r.test_id===testId&&r.entered_by===S.me.id).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,8).map(r=>pool.find(s=>s.id===r.student_id)).filter(Boolean);
    return mine.length?`<p class="label" style="margin-bottom:8px">Oxirgi kiritganlaringiz</p><div class="card list">${mine.map(entryRow).join('')}</div>`:`<div class="empty">Kitobchadagi bolaning familiyasidan 2–3 harf yozing.</div>`}
  const hits=pool.filter(s=>{const w=norm(s.name).split(' ');return t.every(x=>w.some(y=>y.startsWith(x)))}).slice(0,40);
  return hits.length?`<div class="card list">${hits.map(entryRow).join('')}</div>`:`<div class="empty">Topilmadi. Harflarni tekshiring yoki bolani ro’yxatga qo’shing.</div>`}
function entryRow(s){const r=R(s.id);const qd=queue().some(x=>x.student_id===s.id);
  const tag=qd?`<span class="pill gold">yuborilmagan</span>`:!r?'':r.absent?`<span class="pill gray">kelmadi</span>`:`<span class="pill ok">${r.score==null?'?':bl(r)}</span>`;
  return `<button class="row" data-act="enter" data-id="${s.id}"><div class="m"><div class="n">${esc(s.name)}</div><div class="s">${s.num}-maktab · ${esc(s.cls)}</div></div>${tag}</button>`}
// offline queue
const queue=()=>ls.get('queue',[]);
async function flushQueue(){let qd=queue();if(!qd.length)return;const left=[];
  for(const it of qd){try{await api('result.save',it)}catch(e){if(/Failed to fetch|NetworkError|Load failed/i.test(e.message))left.push(it);else toast(e.message,true)}}
  ls.set('queue',left);if(left.length<qd.length)await load()}
window.addEventListener('online',flushQueue);setInterval(()=>{if(queue().length)flushQueue()},20000);

let E=null; // entry sheet state
function openEntry(id){
  const s=X.st.find(x=>x.id===id); const r=R(id); const ev=r?.variant||'A'; const key=keyOf(testId,s.grade,ev)||(ev!=='A'&&vinfo(testId,s.grade)?'?'.repeat(vinfo(testId,s.grade).qn):'');
  const qn=key.length||r?.nq||(r&&r.qn!==100?r.qn:0)||20;
  E={s,mode:r?.mode||ls.get('mode','belgi'),wasBall:null,total:r&&!r.absent&&r.mode==='ball'?(is100(r)?r.ok:r.score):null,bits:(r&&!r.absent&&r.bits?r.bits:'0'.repeat(qn)).padEnd(qn,'0').split(''),ans:(r?.answers||'-'.repeat(qn)).padEnd(qn,'-').split(''),qn,existed:!!r,key,v:ev};
  drawEntry();
}
function drawEntry(){
  const {s,qn}=E; const marked=E.bits.filter(x=>x==='1').length; const filled=E.ans.filter(a=>a!=='-').length;
  const keyKnown=E.key&&!E.key.includes('?');
  const sc=E.mode==='ball'?E.total:E.mode==='belgi'?marked:keyKnown?E.ans.filter((a,i)=>a===E.key[i]).length:null;
  openSheet(`<div class="sh-top"><div class="m"><h2>${esc(s.name)}</h2><div class="s">${s.num}-maktab · ${esc(s.cls)}${E.existed?' · avval kiritilgan':''}${E.wasBall!=null?` · hozir faqat ball: ${E.wasBall}`:''}</div></div><button class="ib" data-act="close" aria-label="Yopish">${I.x}</button></div>
   <div class="seg"><button data-mode="ball" aria-pressed="${E.mode==='ball'}">Soni</button><button data-mode="belgi" aria-pressed="${E.mode==='belgi'}">Belgilash</button><button data-mode="harf" aria-pressed="${E.mode==='harf'}">Harflar</button></div>
   <div class="card score">${E.mode==='ball'&&sc==null?`<b>—</b><span class="note">/ ${qn} to’g’ri</span>`:sc!=null?`<b>${sc}</b><span class="note">/ ${qn} to’g’ri</span>`:`<b>${filled}</b><span class="note">/ ${qn} javob yozildi</span>`}<div class="r">${(()=>{const w=vinfo(testId,s.grade)?.w;const b=E.mode==='belgi'?E.bits:E.mode==='harf'&&keyKnown?E.ans.map((a,i)=>a===E.key[i]?'1':'0'):null;const t100=curTest()?.scoring==='100';const p=!t100?null:b?wPts(w,b):E.mode==='ball'&&sc!=null?Math.round(sc/qn*200)/2:null;return `${p!=null?`<b style="font-size:20px">${num(p)}</b> ball`:''}${E.mode==='harf'?`<div>${qn-filled} ta javobsiz</div>`:''}`})()}</div></div>
   ${E.mode==='ball'?`<p class="note">Bola nechta savolni to’g’ri yechgan bo’lsa, shu sonni bosing.${curTest()?.scoring==='100'?' Qaysi savollar to’g’riligi noma’lum bo’lgani uchun ball taxminan, ulush bo’yicha hisoblanadi — aniq ball uchun “Belgilash”dan foydalaning.':''}</p>
    <div class="tiles">${Array.from({length:qn+1},(_,n)=>`<button class="tile" data-total="${n}" aria-pressed="${E.total===n}">${n}</button>`).join('')}</div>`
   :E.mode==='belgi'?`<p class="note">Bola to’g’ri yechgan savollarni bosing. Bosilmaganlari xato hisoblanadi.</p>
    <div class="tiles">${E.bits.map((v,i)=>`<button class="tile" data-bit="${i}" aria-pressed="${v==='1'}">${i+1}</button>`).join('')}</div>
    <div style="display:flex;gap:16px"><button class="lnk" data-act="allOn">Hammasi to’g’ri</button><button class="lnk" data-act="allOff">Tozalash</button></div>`

const REC={on:false,to:'',data:'',mr:null,ch:[],t0:0,tm:0,stream:null,drop:false};
const AUD={};
const recFmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function recBox(to){let h='';
  if(REC.to===to&&REC.on)h=`<div class="card pad" style="flex-direction:row;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--wrong);animation:pulse 1s infinite;flex:none"></span><b id="recT" style="font-variant-numeric:tabular-nums">${recFmt(Math.floor((Date.now()-REC.t0)/1000))}</b><span class="note">Ovoz yozilmoqda… eng ko’pi 3 daqiqa</span></div>`;
  else if(REC.to===to&&REC.data)h=`<div class="card pad" style="flex-direction:row;align-items:center;gap:10px"><audio controls src="${REC.data}" style="flex:1;min-width:0;height:40px"></audio><button class="btn dan sm" data-act="recDel">O’chirish</button></div>`;
  return `<div id="recbox-${to}">${h}</div>`}
function recBtn(to){const on=REC.on&&REC.to===to;return `<span id="recbtn-${to}" style="display:contents"><button class="btn ${on?'dan':'sec'}" data-act="${on?'recStop':'recStart'}" data-to="${to}">${on?'■ To’xtatish':'🎤 Ovoz'}</button></span>`}
function recRedraw(){['cm','rp'].forEach(to=>{const b=$('#recbox-'+to);if(b)b.outerHTML=recBox(to);const t=$('#recbtn-'+to);if(t)t.outerHTML=recBtn(to)})}
async function recStart(to){
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Bu brauzerda ovoz yozib bo’lmaydi. Chrome orqali oching.',true);return}
  if(REC.on)return; recClear();
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Mikrofonga ruxsat berilmadi. Brauzer sozlamasidan ruxsat bering.',true);return}
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m=>MediaRecorder.isTypeSupported?.(m))||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{});
  Object.assign(REC,{on:true,to,data:'',mr,ch:[],t0:Date.now(),stream,drop:false});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.ch.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(REC.tm);const keep=!REC.drop;REC.on=false;
    if(!keep||!REC.ch.length){recRedraw();return}
    const blob=new Blob(REC.ch,{type:mr.mimeType||mime||'audio/webm'});
    const fr=new FileReader();fr.onload=()=>{const v=String(fr.result);if(v.length>4.4e6){toast('Ovozli xabar juda uzun. Qisqaroq yozing.',true);REC.data=''}else REC.data=v;recRedraw()};fr.readAsDataURL(blob)};
  mr.start(1000);
  REC.tm=setInterval(()=>{const s=Math.floor((Date.now()-REC.t0)/1000);const t=$('#recT');if(t)t.textContent=recFmt(s);if(s>=180)recStop()},500);
  recRedraw()}
function recStop(){if(REC.on&&REC.mr&&REC.mr.state!=='inactive')REC.mr.stop()}
function recClear(){if(REC.on&&REC.mr){REC.drop=true;try{REC.mr.stop()}catch(e){}}clearInterval(REC.tm);REC.on=false;REC.data='';REC.to='';REC.ch=[]}

    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(p[i+3]<10){p[i+3]=0;continue}
      // ko'k/rangli siyoh rang to'yinganligidan, qora siyoh esa fondan ancha to'qligidan topiladi (soya va notekis yorug'lik hisobga olinmaydi)
      const mx=Math.max(p[i],p[i+1],p[i+2]),mn=Math.min(p[i],p[i+1],p[i+2]),chroma=(mx-mn)-(Math.max(r,gg,b)-Math.min(r,gg,b));
      const dark=(r+gg+b)/3-(p[i]+p[i+1]+p[i+2])/3;
      const a=Math.max(0,Math.min(1,Math.max((chroma-14)/30,(dark-60)/40)));
      p[i+3]=Math.round(p[i+3]*a);
      if(a>.5){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}}
    g.putImageData(d,0,0);
    if(x1<=x0||y1<=y0)return img;
    const pad=Math.round(Math.max(x1-x0,y1-y0)*.04);x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
    const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o}
  catch(e){return img}}

let cfSchool=0,cfGrade=0,cfClass=0,cfTest=0;
function certFiltered(){
  const all=(S.certs||[]).map(c=>({...c,s:X.st.find(x=>x.id===c.student_id)})).filter(c=>c.s);
  const tests=[...new Set(all.map(c=>c.test_id))];if(cfTest&&!tests.includes(cfTest))cfTest=0;
  let l=all.filter(c=>!cfTest||c.test_id===cfTest);
  const schools=[...new Set(l.map(c=>c.s.school_id))].map(id=>X.sc[id]).filter(Boolean).sort((a,b)=>a.num-b.num);if(cfSchool&&!schools.some(x=>x.id===cfSchool)){cfSchool=0;cfGrade=0;cfClass=0}
  l=l.filter(c=>!cfSchool||c.s.school_id===cfSchool);
  const grades=[...new Set(l.map(c=>c.s.grade))].filter(Boolean).sort((a,b)=>a-b);if(cfGrade&&!grades.includes(cfGrade)){cfGrade=0;cfClass=0}
  l=l.filter(c=>!cfGrade||c.s.grade===cfGrade);
  const classes=cfSchool&&cfGrade?[...new Set(l.map(c=>c.s.class_id))].map(id=>X.cl[id]).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'uz',{numeric:true})):[];if(cfClass&&!classes.some(x=>x.id===cfClass))cfClass=0;
  l=l.filter(c=>!cfClass||c.s.class_id===cfClass);
  l.sort((a,b)=>(a.s.num-b.s.num)||a.s.cls.localeCompare(b.s.cls,'uz',{numeric:true})||a.s.name.localeCompare(b.s.name,'uz'));
  return {l,tests,schools,grades,classes}}
function certLabel(){const p=[];p.push(cfSchool?X.sc[cfSchool]?.num+'-maktab':(isTeam()?'Butun tuman':''));if(cfGrade)p.push(cfGrade+'-sinflar');if(cfClass)p.push(X.cl[cfClass]?.name+' sinf');return p.filter(Boolean).join(' · ')}

function parseTestText(txt){
  const L=String(txt||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n').split('\n');
  const H=/^\s*=+\s*(\d{1,2})\s*-?\s*sinf\b\s*[·.,:;|\-–—]*\s*([A-Da-d])\b(?:\s*-?\s*variant)?\s*=*\s*$/i;
  const Q=/^\s*(\d{1,2})\s*[.)]\s+(.*\S)\s*$/, O=/^\s*([A-Ea-e])\s*\)\s*(.*\S)?\s*$/, K=/^\s*(?:to.?g.?ri\s+)?javob\s*[:\-–—]\s*([A-Ea-e])\s*\.?\s*$/i;
  const secs=[],errs=[];let sec=null,q=null;
  const end=()=>{if(q&&sec)sec.qs.push(q);q=null};
  for(const s of L){let m;
    if((m=s.match(H))){end();sec={grade:+m[1],variant:m[2].toUpperCase(),qs:[]};secs.push(sec);continue}
    if(!sec||!s.trim())continue;
    if((m=s.match(K))){if(q)q.a=m[1].toUpperCase();continue}
    if(q&&(m=s.match(O))){q.o.push((m[2]||'').trim());continue}
    if((m=s.match(Q))){end();q={n:+m[1],q:m[2],o:[],a:''};continue}
    if(q){if(q.o.length)q.o[q.o.length-1]+=' '+s.trim();else q.q+='\n'+s.trim()}
  }
  end();
  for(const sc of secs){const tag=`${sc.grade}-sinf ${sc.variant} variant`;
    if(!sc.qs.length)errs.push(`${tag}: savol topilmadi`);
    sc.qs.forEach((x,i)=>{if(x.n!==i+1)errs.push(`${tag}: ${i+1}-savol raqami ${x.n} deb yozilgan`);
      if(x.o.length<2)errs.push(`${tag}: ${i+1}-savolda javob variantlari yo’q`);
      if(!x.a)errs.push(`${tag}: ${i+1}-savolda “Javob: …” qatori yo’q`);
      else if('ABCDE'.indexOf(x.a)>=x.o.length)errs.push(`${tag}: ${i+1}-savol javobi ${x.a}, lekin bunday variant yo’q`)})}
  if(!secs.length)errs.push('Faylda “=== 3-sinf · A variant ===” kabi sarlavha topilmadi. Claude tayyorlagan faylni o’zgartirmasdan yuklang.');
  return {secs:secs.map(s=>({grade:s.grade,variant:s.variant,qs:s.qs.map(x=>({q:x.q,o:x.o,a:x.a}))})),errs};
}

const TIW=210,TIH=148.5;
function tLayout(qn,nopt){
  const cols=qn<=10?1:Math.ceil(qn/10),rows=Math.ceil(qn/cols),top=56,bot=128,rh=Math.min(7.6,(bot-top)/rows);
  let sp=9,gap=10;const lab=9,tw=()=>cols*(lab+nopt*sp)+(cols-1)*gap;
  while(tw()>176&&sp>5){sp-=.25;if(gap>5)gap-=.25}
  const d=Math.min(rh*.8,sp*.78,6.4),x0=(TIW-tw())/2,y0=top+((bot-top)-rows*rh)/2;
  const q=[];for(let i=0;i<qn;i++){const c=Math.floor(i/rows),r=i%rows,cx=x0+c*(lab+nopt*sp+gap);
    q.push({lx:cx+lab-2.2,y:y0+r*rh+rh/2,o:Array.from({length:nopt},(_,k)=>cx+lab+k*sp+sp/2)})}
  return {mk:[[14,14],[196,14],[196,134.5],[14,134.5]],ms:8,q,d,qr:{x:160,y:21,s:27}};
}
function qrMat(txt){const q=qrcode(0,'M');q.addData(txt,'Alphanumeric');q.make();const n=q.getModuleCount();return {n,dark:(r,c)=>q.isDark(r,c)}}
function drawQR(pdf,txt,x,y,s){const m=qrMat(txt),u=s/m.n;pdf.setFillColor(0,0,0);
  for(let r=0;r<m.n;r++){let c=0;while(c<m.n){if(!m.dark(r,c)){c++;continue}let e=c;while(e<m.n&&m.dark(r,e))e++;pdf.rect(x+c*u,y+r*u,(e-c)*u+.03,u+.03,'F');c=e}}}

  drawQR(pdf,it.qr,L.qr.x,oy+L.qr.y,L.qr.s);

  pdf.setFontSize(7);pdf.setTextColor(120);pdf.text(pdfTxt('Varaqni bukmang. Burchakdagi qora kvadratlar va QR kodga yozmang.'),TIW/2,oy+143,{align:'center'});
}

function scanOpen(cid,tid){const t=S.tests.find(x=>x.id===tid);if(!t){toast('Imtihon topilmadi',true);return}if(!P('kiritish')){toast('Natija kiritish huquqi kerak',true);return}
  SC={cid,tid:t.id,stream:null,busy:false,live:true,last:'',same:0,view:'live',res:null,msg:'Kamera ochilmoqda…',okMsg:null,timer:0};
  let el=$('#scan');if(!el){el=document.createElement('div');el.id='scan';el.className='scan';document.body.appendChild(el);el.addEventListener('click',scanClick)}
  el.hidden=false;document.body.style.overflow='hidden';scanDraw();navSync();loadJsQR();scanStart()}
function scanClose(){if(!SC)return;clearTimeout(SC.timer);SC.stream?.getTracks().forEach(t=>t.stop());SC=null;const el=$('#scan');if(el){el.hidden=true;el.innerHTML=''}if($('#sheet').hidden)document.body.style.overflow='';navSync();render()}
async function scanStart(){
  if(!navigator.mediaDevices?.getUserMedia){SC.msg='Bu brauzerda kamera ochilmadi. “Rasmdan” tugmasini bosing.';scanDraw();return}
  try{SC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}
  catch(e){if(SC){SC.msg='Kameraga ruxsat berilmadi. Brauzer sozlamasida kameraga ruxsat bering yoki “Rasmdan” tugmasini bosing.';scanDraw()}return}
  if(!SC){return}const v=$('#scanV');if(v){v.srcObject=SC.stream;try{await v.play()}catch(e){}}SC.msg='Titulni ramkaga sig’diring: 4 ta qora kvadrat va QR kod ko’rinsin';scanDraw(true);scanLoop()}
function scanLoop(){if(!SC)return;clearTimeout(SC.timer);SC.timer=setTimeout(async()=>{if(!SC)return;
  if(SC.view==='live'&&!SC.busy){const v=$('#scanV');if(v&&v.readyState>=2){SC.busy=true;try{await scanHandle(await omrRead(v),false)}catch(e){console.error(e)}SC.busy=false}}
  scanLoop()},160)}
const SC_ERR={kamera:'Kamera tayyorlanmoqda…',marker:'Titulni ramkaga sig’diring',qr:'4 burchak topildi, QR o’qilmoqda — bir soniya kuting',one:'Bir vaqtda faqat bitta titulni tuting'};
function scanOverlay(r){const ov=$('#scanOv'),v=$('#scanV');if(!ov||!v)return;const cv=r&&r.cv;const qd=r&&(r.quad||r.quads?.[0]?.p);
  if(!cv||!qd){ov.width=ov.width;return}if(ov.width!==cv.width||ov.height!==cv.height){ov.width=cv.width;ov.height=cv.height}
  const g=ov.getContext('2d');g.clearRect(0,0,ov.width,ov.height);g.strokeStyle=r.err?'#ffd54f':'#3ddc84';g.lineWidth=Math.max(3,ov.width/220);g.beginPath();qd.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.stroke();
  g.fillStyle=g.strokeStyle;qd.forEach(p=>{g.beginPath();g.arc(p.x,p.y,ov.width/70,0,7);g.fill()})}
async function scanHandle(r,still){
  if(!still)scanOverlay(r);
  if(r.err){if(still){toast(SC_ERR[r.err]==null?'O’qib bo’lmadi':SC_ERR[r.err].replace('Titulni ramkaga','Rasmda titulni'),true)}SC.same=0;scanMsg(SC_ERR[r.err]);return}
  const q=r.qr;if(q.tid!==SC.tid){const o=S.tests.find(x=>x.id===q.tid);scanMsg(o?`Bu titul «${o.name}» uchun chiqarilgan. Bu yerda «${S.tests.find(x=>x.id===SC.tid)?.name}» tekshirilyapti`:'Bu titul boshqa imtihon uchun chiqarilgan');return}
  const key=r.raw+'|'+r.ans;if(!still){if(key!==SC.last){SC.last=key;SC.same=1;scanMsg('O’qilmoqda… qimirlatmang');return}if(++SC.same<2)return}
  const st=q.spare?null:X.st.find(s=>s.id===q.id);
  if(!q.spare&&!st){scanMsg('Bu bola ro’yxatda topilmadi (o’chirilgan bo’lishi mumkin)');return}
  const old=st?R(st.id,SC.tid):null;
  if(old&&!old.absent&&old.mode==='harf'&&old.answers===r.ans.replace(/\*/g,'-')&&(old.variant||'A')===q.v){scanMsg(`✓ ${st.name} allaqachon saqlangan: ${old.score??'?'}/${old.qn}`);return}
  const blanks=[...r.ans].filter(a=>a==='-').length,multi=[...r.ans].filter(a=>a==='*').length;
  const other=st&&st.class_id!==SC.cid;
  const uns=(r.unsure||[]).filter(Boolean).length;r.uns=uns;r.st=st;r.old=old;r.multi=multi;r.blanks=blanks;r.other=other;r.ans=r.ans.split('');
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  // muammosiz titul avtomatik saqlanadi; shubhali joyi bo'lsa — tasdiqlash oynasi
  if(!still&&st&&!multi&&!uns&&blanks<=Math.floor(q.qn*.3)&&!other&&!(old&&!old.absent)){await scanSave(r,true);return}
  SC.res=r;SC.view='check';scanDraw()}
function scanMsg(m){if(!SC||SC.msg===m)return;SC.msg=m;const el=$('#scanMsg');if(el)el.textContent=m}
async function scanSave(r,auto){
  const ans=r.ans.join('').replace(/\*/g,'-');let st=r.st;
  if(!st){const nm=fixNameC(val('scName'));if(nm.split(' ').length<2){toast('Familiya va ismni yozing',true);return}
    const same=X.st.find(s=>s.class_id===SC.cid&&nKey(s.name)===nKey(nm));
    if(same)st=same;else{try{const x=await api('student.save',{name:nm,class_id:SC.cid,phone:''});await load();st=X.st.find(s=>s.id===x.id)}catch(e){toast(e.message,true);return}}
    if(!st){toast('Bola qo’shilmadi',true);return}}
  const body={test_id:SC.tid,student_id:st.id,absent:false,mode:'harf',answers:ans,bits:'',variant:r.qr.v,src:'skaner'};
  SC.msg=SC_ERR.marker;
  try{const x=await api('result.save',body);SC.okMsg={name:st.name,score:x.score,qn:x.qn,r:{...r,st}};SC.view='live';SC.res=null;scanDraw(true);await load();scanDraw(true)}
  catch(e){if(/Failed to fetch|NetworkError|Load failed/i.test(e.message)){const qd=queue().filter(y=>y.student_id!==body.student_id);qd.push(body);ls.set('queue',qd);SC.okMsg={name:st.name,score:null,qn:r.qr.qn,r:{...r,st}};SC.view='live';SC.res=null;scanDraw(true)}
    else{toast(e.message,true);if(auto){SC.res=r;SC.view='check';scanDraw()}}}}
const fixNameC=v=>String(v||'').trim().replace(/\s+/g,' ').replace(/([oOgG])[`'‘’ʻʼ´]/g,'$1‘').split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(' ');
function scanPhoto(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=async()=>{URL.revokeObjectURL(im.src);if(!SC)return;scanMsg('Rasm o’qilmoqda…');
    await loadJsQR();const r=await omrRead(im);await scanHandle(r,true)};im.src=URL.createObjectURL(f)};i.click()}
function scanPreview(r){const c=document.createElement('canvas'),s=r.cv,k=Math.min(1,900/s.width);c.width=s.width*k;c.height=s.height*k;const g=c.getContext('2d');g.drawImage(s,0,0,c.width,c.height);g.scale(k,k);
  g.lineWidth=3/k*1.3;g.strokeStyle='#12a39f';g.beginPath();r.quad.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.stroke();
  r.marks.forEach((row,i)=>row.forEach(o=>{if(!o.on&&!o.u)return;g.strokeStyle=o.u&&!o.on?'#e0a800':r.ans[i]==='*'?'#c2414b':'#1f8a4c';g.lineWidth=Math.max(2,o.r*.25);g.beginPath();g.arc(o.x,o.y,o.r*1.25,0,7);g.stroke()}));
  return c.toDataURL('image/jpeg',.8)}

     :`<div class="n" style="font-weight:700">Zaxira titul</div><div class="note">Bola ismini titulga qo’lda yozgan</div>`}</div><span class="pill gold">${VL(q.v)}-variant</span></div>

    ${r.other?`<div class="note" style="color:var(--wrong)">Bu bola ${esc(r.st.cls)} sinfdan. Natija o’z sinfiga yoziladi.</div>`:''}

const STEP_L=['Test','Titullar','Tekshirish','E’lon','Yakun'];
function examInfo(t){
  const cls=S.classes.filter(c=>covers(t,c)),gs=[...new Set(cls.map(c=>c.grade))].sort((a,b)=>a-b),keyed=gs.filter(g=>vinfo(t.id,g));
  const st=X.st.filter(s=>covers(t,X.cl[s.class_id])),done=st.filter(s=>R(s.id,t.id)).length;
  const schools=[...new Set(cls.map(c=>c.school_id))].sort((a,b)=>(X.sc[a]?.num||0)-(X.sc[b]?.num||0));
  const ap=S.approvals?.[t.id]||{},withRes=schools.filter(id=>st.some(s=>s.school_id===id&&R(s.id,t.id))),ann=withRes.filter(id=>ap[id]?.done).length;
  const fin=!!ap[0]?.done||t.status==='yakunlandi';
  const step=!gs.length||keyed.length<gs.length?1:!done?2:done<st.length&&t.status!=='tekshiruv'?3:ann<withRes.length||!withRes.length?4:fin?6:5;
  return {cls,gs,keyed,st,done,schools,withRes,ann,fin,step}}
function stepDots(step){return `<div class="xsteps">${STEP_L.map((l,i)=>`<span class="${i+1<step?'done':i+1===step?'on':''}"><i>${i+1<step?'✓':i+1}</i>${l}</span>`).join('')}</div>`}
function examCard(t){const e=examInfo(t);
  const what=e.step===1?(e.gs.length?`${e.gs.length-e.keyed.length} ta sinf bosqichiga test berilmagan`:'Qamrovda sinf yo’q'):e.step===2?'Titullarni chop eting va imtihonni o’tkazing':e.step===3?`${e.done} / ${e.st.length} ta bola tekshirildi`:e.step===4?`${e.ann} / ${e.withRes.length} ta maktab e’lon qilindi`:e.step===5?'Imtihonni yakunlang va sertifikatlarni chiqaring':'Yakunlangan';

   ${stepDots(e.step)}<div class="note" style="margin:0"><b>${e.step<6?e.step+'-qadam':'✓'}</b> · ${what}</div>${e.step===3&&e.st.length?`<div class="bar" style="margin:0"><i style="width:${e.done/e.st.length*100}%"></i></div>`:''}</button>`}

async function pdfScan(file){await loadLib(PDFJS,()=>window.pdfjsLib);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJSW;

  return pdfDetect(pages)}
function pdfDetect(pages){const cand={},txt=[];let hasE=false,chars=0;
  pages.forEach(p=>{p.items.forEach(t=>{const s=String(t.s).trim();chars+=s.length;if(/^E\s*\)/.test(s)||/(^|\s)E\)\s*\S/.test(s))hasE=true;
    // savol raqamlari odatda bitta ustunda turadi: eng ko'p raqam turgan ustun olinadi
    const m=s.match(/^(\d{1,2})\s*[.)]?$/)||s.match(/^(\d{1,2})\s*[.)]\s+\S/);if(m&&t.x<p.w*.25)(cand[Math.round(t.x/6)]||=new Set()).add(+m[1])});
    // qatorlarni tiklash: bir xil balandlikdagi bo'laklar ketma-ket
    const rows={};p.items.forEach(t=>{const k=Math.round(t.y/3);(rows[k]||=[]).push(t)});Object.keys(rows).sort((a,b)=>b-a).forEach(k=>txt.push(rows[k].sort((a,b)=>a.x-b.x).map(t=>t.s).join(' ')))});
  const run=st=>{let n=0;while(st.has(n+1))n++;return n};const cols=Object.keys(cand).map(Number);
  let qn=0;for(const c of cols){const st=new Set([...(cand[c-1]||[]),...cand[c],...(cand[c+1]||[])]);qn=Math.max(qn,run(st))}

  return {qn:qn>=5?Math.min(50,qn):0,nopt:hasE||(kOk&&key.includes('E'))?5:4,key:kOk?Array.from({length:qn},(_,i)=>key[i]||''):[],noText:chars<40}}

let histD=+(history.state?.yxd||0),navSkip=0,navT=0,exitArmed=false;
function firstTab(){if(!S)return null;const t=TABS[isTeam()?'team':S.me.role]();return t[0]?.[0]||null}
function appDepth(){if(!S)return 0;return (exitArmed?0:1)+(SC?1:0)+(!$('#sheet').hidden?1:0)+stack.length+(tab&&tab!==firstTab()?1:0)}
function navSync(){if(!navT)navT=setTimeout(navDo,0)}
function navDo(){navT=0;if(navSkip)return;const d=appDepth();
  try{if(d>histD){for(let i=histD+1;i<=d;i++)history.pushState({yxd:i},'');histD=d}
  else if(d<histD){const n=d-histD;histD=d;navSkip=1;history.go(n)}}catch(e){}}
addEventListener('popstate',e=>{
  if($('#zoom')&&!navSkip){closeZoom();try{history.pushState({yxd:histD},'')}catch(_){}return} // orqaga: avval kattalashtirilgan rasm yopiladi
  if(navSkip){navSkip=0;navDo();return}
  const d=+(e.state?.yxd||0);
  while(appDepth()>d){
    if(SC){clearTimeout(SC.timer);SC.stream?.getTracks().forEach(t=>t.stop());SC=null;const se=$('#scan');if(se){se.hidden=true;se.innerHTML=''}if($('#sheet').hidden)document.body.style.overflow=''}
    else if(!$('#sheet').hidden)closeSheet();
    else if(stack.length)stack.pop();
    else if(tab&&tab!==firstTab()){tab=firstTab();stack=[]}
    else break}
  if(d===0&&S&&!exitArmed){exitArmed=true;toast('Chiqish uchun yana bir marta bosing')}
  histD=d;render();scrollTo(0,0)});
// Bosh sahifada: birinchi "orqaga" — ogohlantirish, ikkinchisi — chiqish. Har qanday bosish himoyani qayta yoqadi.
