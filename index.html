<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yosh Xorazmiylar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Yosh Xorazmiylar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap">
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface2:#eef2f7; --fg:#1e293b; --muted:#64748b; --line:#e5eaf1;
  --navy:#2f4f8f; --stage:linear-gradient(135deg,#e9f3ff 0%,#e7f8f5 100%); --stage-fg:#1e293b; --stage-lb:#0b7f7c; --stage-line:rgba(15,157,154,.18); --stage-on:#12a39f; --accent:#12a39f; --accent-strong:#0b8581; --accent-soft:#e0f5f3; --gold:#a07612; --gold-soft:#f8ecd0;
  --good:#1f8a4c; --low:#6a7792; --wrong:#c2414b; --wrong-soft:#f7dfe1; --blank:#c3cad8; --on-accent:#fff;
  --display:"Golos Text",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media not all{:root{
  --bg:#0e1424; --surface:#161e33; --surface2:#1e2842; --fg:#e7ecf6; --muted:#9aa6bf; --line:#2a3552;
  --navy:#8fb0ff; --stage:linear-gradient(135deg,#1a2540 0%,#16303a 100%); --stage-fg:#e7ecf6; --stage-lb:#7fdcd7; --stage-line:rgba(255,255,255,.18); --stage-on:#5fe0d9; --accent:#2fb8b3; --accent-strong:#3cc7c2; --accent-soft:#163b3d; --gold:#e3b54a; --gold-soft:#3b3218;
  --good:#4cc47f; --low:#8d99b3; --wrong:#ee6b74; --wrong-soft:#41222a; --blank:#3a4562; --on-accent:#06201f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);flex:none}
.role{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-strong);background:var(--accent-soft);padding:4px 8px;border-radius:999px;flex:none}
main{flex:1;padding-block:16px 100px;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent-strong)}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.stage{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--stage);color:var(--stage-fg);border:1px solid var(--line);border-radius:16px}
.stage .t{font-family:var(--display);font-size:17px;font-weight:700}
.stage .slb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--stage-lb)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps span{font-size:11px;text-align:center;padding-top:7px;border-top:3px solid var(--stage-line);opacity:.65;border-radius:2px}
.steps span.on{border-color:var(--stage-on);opacity:1;font-weight:600}
.steps span.done{border-color:var(--stage-on);opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;overflow:hidden}
.list>*{border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
.row .m{flex:1;min-width:0}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;flex:none}
.num small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.rank{width:24px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;flex:none}
.chev{color:var(--muted);flex:none}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.gray{background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent-strong)}
.pill.warn{background:var(--wrong-soft);color:var(--wrong)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(20,33,61,.12)}
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.q{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.q.ok{background:var(--accent-soft);color:var(--accent-strong)}
.q.no{background:var(--wrong-soft);color:var(--wrong)}
.q.bl{background:var(--surface2);color:var(--muted);border:1px dashed var(--blank)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hero{padding:18px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:17px;color:var(--muted);font-weight:500}
.cmp{display:flex;flex-direction:column;gap:10px;padding:14px}
.cmp .r{display:grid;grid-template-columns:104px 1fr 46px;align-items:center;gap:10px;font-size:13.5px}
.cmp .track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.cmp .track i{display:block;height:100%;border-radius:5px}
.note{font-size:13px;color:var(--muted);margin:0}
.inst{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:12px}
.inst .go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px 0;text-align:left;font-size:14px;font-weight:600;color:var(--accent-strong)}
.inst .go img{width:26px;height:26px;flex:none}
.inst .go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inst .ib{width:32px;height:32px;background:none;color:var(--muted)}
.warnc{border-color:var(--gold);background:var(--gold-soft)}
.isteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.hard{display:flex;gap:6px;flex-wrap:wrap}
.hard span{padding:6px 10px;border-radius:10px;background:var(--wrong-soft);color:var(--wrong);font-size:13px;font-weight:600}
.hard span small{font-weight:500;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:13px;font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:disabled{opacity:.45}
.btn.sec{background:var(--surface2)}
.btn.dan{background:var(--wrong-soft);color:var(--wrong)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.lnk{color:var(--accent-strong);font-weight:600;font-size:14px;padding:6px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.field textarea{min-height:110px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.check{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.empty{padding:20px 16px;text-align:center;color:var(--muted);font-size:14px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:13px 14px 13px 42px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 30px}
.sh-top{display:flex;align-items:flex-start;gap:12px}
.sh-top .m{flex:1;min-width:0}
.sh-top h2{font-size:20px;margin:0;line-height:1.25}
.sh-top .s{color:var(--muted);font-size:13.5px}
.score{display:flex;align-items:baseline;gap:8px;padding:14px 16px}
.score b{font-family:var(--display);font-size:32px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.score .r{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1/.82;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--display);font-size:20px;font-weight:500;display:grid;place-items:center}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.letters{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.lcol{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:22px repeat(5,1fr);gap:3px;align-items:center}
.lrow>span{font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;padding-right:3px}
.lb{height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.lb[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--wrong);color:#fff}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:44px 32px;text-align:center}
.logo{width:140px;height:140px}
.login h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0;color:var(--navy)}
.pinbox{display:flex;gap:8px;justify-content:center}
.pinbox span{width:42px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.pinbox span.f{border-color:var(--accent)}
.kp{display:grid;grid-template-columns:repeat(3,74px);gap:10px;justify-content:center}
.kp button{height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:600}
.err{color:var(--wrong);font-size:14px;min-height:20px;margin:0}
.code{font-family:var(--display);font-size:22px;letter-spacing:.12em;color:var(--accent-strong)}
.sms{white-space:pre-wrap;font-size:14px;background:var(--surface2);padding:12px;border-radius:10px}
.tbl{overflow-x:auto}
.ti{position:relative;display:inline-flex}
.tabs .badge{position:absolute;top:-4px;right:-10px}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--wrong);color:#fff;font-size:11px;font-weight:700;margin-left:6px}
.msgs{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:14px 14px 4px 14px}
.bubble .who{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.bubble img{display:block;max-width:100%;border-radius:10px;margin-top:6px;cursor:zoom-in}
.bubble .who{display:flex;align-items:center;gap:6px}
.bubble .mm{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px 0 8px;cursor:pointer}
.bubble .ma{display:flex;gap:14px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
.bubble .ma button{border:0;background:none;padding:2px 0;font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-strong);cursor:pointer}
.bubble .ma button.del{color:var(--wrong)}
.bubble .ed{font-size:11px;color:var(--muted);margin-top:3px;text-align:right}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;overflow:auto}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
.zoom .zb{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;right:12px}
.zoom .zb a,.zoom .zb button{display:inline-grid;place-items:center;height:42px;min-width:42px;padding:0 14px;border-radius:21px;border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.offline{background:var(--gold-soft);color:var(--fg);font-size:13px;padding:8px 14px;border-radius:10px}
@media (min-width:900px){
.app:has(> .tabs){max-width:none;margin:0 0 0 256px}
.app:has(> .tabs) .top,.app:has(> .tabs) main{padding-left:40px;padding-right:40px}
.app:has(> .tabs) main{max-width:1040px;width:100%;padding-bottom:48px}
.top h1{font-size:20px}
.tabs{top:0;bottom:0;right:auto;width:240px;border-top:0;border-right:1px solid var(--line);padding:20px 14px}
.tabs .in{max-width:none;display:flex;flex-direction:column;gap:3px;min-height:100%}
.tabs{width:256px;overflow-y:auto;scrollbar-width:thin}
.tabs .in>.dk{display:flex}
.brand{align-items:center;gap:12px;padding:2px 6px 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.brand img{width:54px;height:54px;border-radius:50%;flex:none;background:#fff;box-shadow:0 0 0 3px #fff,0 4px 14px rgba(31,56,100,.22)}
.brand b{display:block;font-family:"Unbounded",var(--display);font-weight:600;font-size:15px;line-height:1.25;color:var(--navy)}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.side-l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:16px 14px 4px}
.tabs button.sl{padding:8px 14px;font-size:14px;color:var(--fg)}
.tabs button.sl svg{width:18px;height:18px;color:var(--muted)}
.tabs button.sl[aria-current="true"]{background:var(--accent-soft);color:var(--accent-strong)}
.tabs .sch{margin-top:auto;padding-top:16px}
.tabs .sch .schc{padding:14px;font-size:12.5px}
.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:9px 14px;border-radius:11px;font-size:15px}
.tabs button[aria-current="true"]{background:var(--accent-soft)}
.tabs .badge{position:static;margin-left:auto}
.kpis{grid-template-columns:repeat(6,1fr)}
.sheet{background:rgba(15,23,42,.38);padding:40px 16px}
.sheet .in{max-width:600px;background:var(--bg);border-radius:18px;padding:20px 24px 26px}
.toast{bottom:28px}
}

/* ============ atmosfera: har bo'limga o'z yumshoq rangi, sokin harakat ============ */
@property --c1{syntax:'<color>';inherits:true;initial-value:#cdeeea}
@property --c2{syntax:'<color>';inherits:true;initial-value:#d6e6ff}
@property --c3{syntax:'<color>';inherits:true;initial-value:#fdf3d8}
body{--c1:#b6ebe3;--c2:#c6dbff;--c3:#ffeab8;--gop:.13;transition:--c1 .9s ease,--c2 .9s ease,--c3 .9s ease}
body[data-theme=mint]{--c1:#bdeccb;--c2:#def3b4;--c3:#bfe8ec}
body[data-theme=sand]{--c1:#ffd9b8;--c2:#ffecbd;--c3:#d4ece7;--gop:.08}
body[data-theme=lilac]{--c1:#dccfff;--c2:#c9e0ff;--c3:#fbd5e6}
body[data-theme=rose]{--c1:#ffd1dc;--c2:#ffe3bb;--c3:#ddd6ff}
body[data-theme=dusk]{--c1:#ccd2ff;--c2:#b8e9e3;--c3:#ecdcff}
body[data-theme=sun]{--c1:#ffe89c;--c2:#c4eed3;--c3:#ffd4c2}
@media not all{
 body{--c1:#123a3d;--c2:#1a2a52;--c3:#3a3320;--gop:.11}
 body[data-theme=mint]{--c1:#14402c;--c2:#2c3d18;--c3:#123a40}
 body[data-theme=sand]{--c1:#46301c;--c2:#3d3518;--c3:#14373a;--gop:.08}
 body[data-theme=lilac]{--c1:#2e2456;--c2:#18305a;--c3:#45203a}
 body[data-theme=rose]{--c1:#4a2030;--c2:#43331a;--c3:#2a2552}
 body[data-theme=dusk]{--c1:#232a60;--c2:#123f3d;--c3:#3a2552}
 body[data-theme=sun]{--c1:#45401a;--c2:#163d29;--c3:#45281e}
}
#atmo{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#atmo .b{position:absolute;width:80vmax;height:80vmax;border-radius:50%;opacity:1}
#atmo .b1{background:radial-gradient(circle at center,var(--c1) 0,transparent 62%);left:-30vmax;top:-32vmax;animation:drift1 46s ease-in-out infinite alternate}
#atmo .b2{background:radial-gradient(circle at center,var(--c2) 0,transparent 62%);right:-32vmax;top:18vh;animation:drift2 58s ease-in-out infinite alternate}
#atmo .b3{background:radial-gradient(circle at center,var(--c3) 0,transparent 62%);left:5vw;bottom:-45vmax;animation:drift3 64s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.08)}}
@keyframes drift2{to{transform:translate(-10vw,-8vh) scale(1.12)}}
@keyframes drift3{to{transform:translate(14vw,-6vh) scale(.94)}}
#atmo .pat{position:absolute;inset:0;opacity:.5;color:var(--navy);

<script>
'use strict';
// ================================================================ basics
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[ʻʼ'`‘’]/g,'').replace(/[^a-z0-9а-яё ]/g,' ');
const ls={get(k,d){try{const v=localStorage.getItem('yx_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('yx_'+k,JSON.stringify(v))}catch(e){}}};
// --- telefonga ilova qilib o'rnatish ---
let DPI=null;
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isPC=()=>!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)&&!isIOS();
const instL=()=>isPC()?'Kompyuterga ilova qilib o’rnatish':'Telefonga ilova qilib o’rnatish';
const inTg=()=>/Telegram/i.test(navigator.userAgent)||!!window.TelegramWebviewProxy;
const reInst=()=>{if($('#app')?.children.length&&!location.pathname.startsWith('/t/'))render()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DPI=e;reInst()});
addEventListener('appinstalled',()=>{DPI=null;toast('Ilova o’rnatildi! Endi telefon ekranidan oching');reInst()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
const instBtn=(cls='btn sec')=>isApp()?'':`<button class="${cls}" data-act="install">${isPC()?'💻':'📲'} ${instL()}</button>`;
const instBanner=()=>isApp()||ls.get('noinst',false)?'':`<div class="card inst"><button class="go" data-act="install"><img src="/icon-192.png" alt=""><span>${instL()}</span></button><button class="ib" data-act="noinst" aria-label="Yopish">${I.x}</button></div>`;
async function doInstall(){
  if(DPI){const p=DPI;DPI=null;p.prompt();try{await p.userChoice}catch(e){}render();return}
  const ios=isIOS(),pc=isPC();
  openSheet(`<div class="sh-top"><div class="m"><h2>Ilova qilib o’rnatish</h2><div class="s">${pc?'Kompyuter':ios?'iPhone':'Android'} uchun</div></div><button class="ib" data-act="close" aria-label="Yopish">${I.x}</button></div>
  ${inTg()?`<div class="card pad" style="background:var(--gold-soft)"><b>Avval saytni brauzerda oching.</b><div class="note">Telegram ichida o’rnatib bo’lmaydi. Yuqoridagi ⋮ (yoki ⋯) tugmasini bosing → <b>“Brauzerda ochish”</b>. Keyin shu tugmani yana bosing.</div></div>`:''}
  <div class="card pad">${pc?`<ol class="isteps"><li>Saytni <b>Chrome</b> yoki <b>Edge</b>da oching</li><li>Manzil satrining o’ng chetidagi <b>o’rnatish belgisini</b> (monitor va ↓ strelka) bosing. Ko’rinmasa: o’ng yuqoridagi <b>⋮</b> → <b>“Saqlash va ulashish” → “Ilovani o’rnatish”</b></li><li><b>“O’rnatish”</b> ni bosing</li></ol>`:ios?`<ol class="isteps"><li>Saytni <b>Safari</b>da oching (yoshxorazmiylar.uz)</li><li>Pastdagi <b>Ulashish</b> tugmasini bosing (kvadrat ichida ↑ strelka)</li><li>Ro’yxatdan <b>“Ekranga qo’shish”</b> (“На экран «Домой»” / “Add to Home Screen”) ni tanlang</li><li>O’ng yuqoridagi <b>“Qo’shish”</b> ni bosing</li></ol>`
   :`<ol class="isteps"><li>Saytni <b>Chrome</b>da oching (yoshxorazmiylar.uz)</li><li>O’ng yuqoridagi <b>⋮</b> (uch nuqta) tugmasini bosing</li><li><b>“Ilovani o’rnatish”</b> yoki <b>“Bosh ekranga qo’shish”</b> (“Установить приложение” / “Install app”) ni tanlang</li><li><b>“O’rnatish”</b> ni bosing</li></ol>`}</div>
  <p class="note">Shundan keyin ${pc?'ish stolida':'telefon ekranida'} “Yosh Xorazmiylar” belgisi paydo bo’ladi. PIN kodni bir marta kiritsangiz, keyin qayta so’ralmaydi.</p>
  <button class="btn pri" data-act="close">Tushunarli</button>`);
}
let toastT;function toast(t,err){const el=$('#toast');el.textContent=t;el.className='toast'+(err?' err':'');el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,err?4000:2200)}
async function api(name,body){
  let r;try{r=await fetch('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{}),credentials:'same-origin'})}
  catch(e){const er=new Error('Server bilan aloqa yo’q. Internetni tekshiring yoki birozdan keyin qayta urinib ko’ring.');er.net=true;throw er}
  if(r.status>=502&&r.status<=504){const er=new Error('Sayt bir daqiqaga yangilanmoqda. Birozdan keyin qayta urinib ko’ring.');er.net=true;throw er}
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&name!=='login'){S=null;render();throw new Error(d.error||'Qaytadan kiring')}
  if(!r.ok)throw new Error(d.error||'Xatolik');
  return d;
}
const fmtDate=iso=>{if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toTimeString().slice(0,5)};
const ph=p=>p?`+998 ${p.slice(0,2)} ${p.slice(2,5)} ${p.slice(5,7)} ${p.slice(7)}`:'';

const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 school:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M10 21v-5h4v5M9 11h.01M15 11h.01"/></svg>',
 pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>',
 rank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V11H3v10zM15.5 21V4h-7v17zM21 21v-7h-5.5v7z"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>',
 users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>',
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
 x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 out:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H4"/></svg>',
 chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
 search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
};
const LOGO=`<img class="logo" src="/icon-512.png" alt="Yosh Xorazmiylar logotipi">`;
const STATUS=[['tayyor','Tayyor'],['otkazildi','O’tkazildi'],['tekshiruv','Tekshiruv'],['yakunlandi','E’lon']];
const ROLE_L={ceo:'CEO',jamoa:'Jamoa',direktor:'Direktor',rahbar:'Sinf rahbari',ota:'Ota-ona'};

// ================================================================ state
let S=null;            // server state
let homeSchool=0, homeClass=0, gq='', schGrade=0, schClass=0;
let topMin=ls.get('topmin',70), topGrade=0, topSchool=0; // "Yuqori natijalar" bo'limi
let tab=null, stack=[], pin='', pinErr='', sortBy='ball', rGrade=2, rMode='bola', q='', qSchool=0;
// sahifa yangilanganda (refresh) o'sha sahifada qolish uchun joriy holatni eslab qolamiz
const NAV={get(){try{return JSON.parse(sessionStorage.getItem('yx_nav')||'null')}catch(e){return null}},set(v){try{sessionStorage.setItem('yx_nav',JSON.stringify(v))}catch(e){}}};
(function(){const n=NAV.get();if(n){if(typeof n.tab==='string')tab=n.tab;if(Array.isArray(n.stack))stack=n.stack.filter(x=>typeof x==='string').slice(-20);if(n.hs!=null)window.__hs=n.hs}})();
let testId=ls.get('test',null);
const P=k=>!!S?.me?.perms?.[k];
const isDir=()=>S?.me?.role==='direktor';
const ED=()=>P('maktab')||isDir(); // o'quvchi/sinf ma'lumotlarini tahrirlay oladi
const isTeam=()=>S&&(S.me.role==='ceo'||S.me.role==='jamoa');

let netTry=0,netTimer=null,SJ='';
// auto=true — har daqiqadagi fon yangilanishi: ma'lumot o'zgarmagan bo'lsa sahifa qayta chizilmaydi (qotib qolmasligi uchun)
async function load(auto){
  try{const n=await api('state');const j=JSON.stringify(n);if(auto&&S&&!netTry&&j===SJ)return;SJ=j;S=n;if(netTry){netTry=0;pinErr='';if(S)toast('Aloqa tiklandi')}}
  catch(e){
    if(!e.net){S=null;if(netTry){netTry=0;pinErr=''}}
    else{ // aloqa uzilsa — tizimdan chiqarmaymiz, o'zi qayta urinadi
      netTry++;if(netTry===1)toast(e.message,true);
      if(!S)pinErr=e.message;
      clearTimeout(netTimer);netTimer=setTimeout(load,Math.min(30000,4000*netTry));
      if(S)return;
    }
  }
  if(S){if(!S.tests.some(t=>t.id===testId))testId=S.tests[0]?.id??null;}
  render();
}
// --- indexes
function idx(){
  const sc=Object.fromEntries((S.schools||[]).map(x=>[x.id,x]));
  const cl=Object.fromEntries((S.classes||[]).map(x=>[x.id,x]));
  const st=(S.students||[]).map(s=>{const c=cl[s.class_id]||{};return{...s,cls:c.name,grade:c.grade,school_id:c.school_id,num:sc[c.school_id]?.num}});
  const res={};(S.results||[]).forEach(r=>{(res[r.test_id]||={})[r.student_id]=r});
  return{sc,cl,st,res};
}
let X=null; // cached indexes per render
const curTest=()=>S.tests.find(t=>t.id===testId)||null;
const R=(sid,tid=testId)=>X.res[tid]?.[sid]||null;
const pct=r=>r&&!r.absent&&r.score!=null?Math.round(r.score/r.qn*100):null;
function avgPct(list,tid=testId){const v=list.map(s=>pct(R(s.id,tid))).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
function present(list,tid=testId){return list.filter(s=>{const r=R(s.id,tid);return r&&!r.absent})}
function giftedSet(tid=testId){
  const t=S.tests.find(x=>x.id===tid);const set=new Set();if(!t)return set;
  if(!isTeam()){(S.gifted||[]).forEach(k=>{const[a,b]=k.split(':');if(+a===tid)set.add(+b)});return set}
  [...new Set(X.st.map(s=>s.school_id+':'+s.grade))].forEach(g=>{ // har bir maktab va sinf bosqichi alohida
    const p=present(X.st.filter(s=>s.school_id+':'+s.grade===g),tid).map(s=>R(s.id,tid)).filter(r=>r.score!=null).sort((a,b)=>b.score-a.score);
    if(!p.length)return;const cut=p[Math.max(0,Math.ceil(p.length*t.gifted_top/100)-1)].score;
    p.forEach(r=>{if(r.score>=cut&&r.score/r.qn*100>=t.gifted_min)set.add(r.student_id)});});
  return set;
}
function hardest(list,k=5,tid=testId){const p=present(list,tid).map(s=>R(s.id,tid)).filter(r=>r.bits);if(!p.length)return[];
  const n=Math.max(...p.map(r=>r.bits.length));const w=Array(n).fill(0);p.forEach(r=>[...r.bits].forEach((c,i)=>{if(c!=='1')w[i]++}));
  return w.map((x,i)=>({q:i+1,p:Math.round(x/p.length*100)})).sort((a,b)=>b.p-a.p).slice(0,k)}
const colorFor=p=>p>=70?'var(--good)':p>=45?'var(--accent)':'var(--low)';

// ================================================================ shared ui bits
function stageBox(t,sid=0){
  if(!t)return `<div class="stage"><div class="slb">Sinov</div><div class="t">Hali sinov yaratilmagan</div></div>`;
  // bosqich natijalar kiritilishiga qarab o'zi o'tadi; qo'lda qo'yilgan holat undan yuqori bo'lsa, o'sha ko'rinadi
  const list=sid?X.st.filter(s=>s.school_id===sid):X.st; const n=list.filter(s=>R(s.id,t.id)).length; const left=list.length-n;
  const ap=S.approvals?.[t.id]?.[sid]||{};
  let steps,i,note='';
  if(sid){
    steps=['Kutilmoqda','Kiritilmoqda','Tekshiruv','E’lon'];
    i=ap.done?3:!n?0:left>0?1:2;
  }else{
    steps=STATUS.map(x=>x[1]);
    const auto=t.status==='yakunlandi'?3:n?1:0; // Tekshiruvga faqat qo'lda o'tkaziladi: maktablar hali qo'shilishi mumkin
    i=Math.max(auto,STATUS.findIndex(x=>x[0]===t.status));
  }
  if(i===0&&!n)note=sid?'Hali birorta natija kiritilmagan.':'';
  else if(i===1&&sid)note=`<b>${left}</b> ta o’quvchi hali kiritilmagan. Hammasi kiritib bo’lingach, qolganlarini bir bosishda “Kelmadi” qiling.${absBtn('school',sid,left)}`;
  else if(i===1)note=`${left?`<b>${left}</b> ta o’quvchi hali kiritilmagan. `:''}Barcha maktablarda sinov o’tkazilib bo’lgach, sinovni Tekshiruvga o’tkazing.${P('maktab')?`<div style="margin-top:10px"><button class="btn sec sm" data-act="toCheck" data-id="${t.id}">Tekshiruvga o’tkazish</button></div>`:''}`;
  else if(i===2)note=sid?`Hamma kiritildi. E’lon uchun tasdiq: ${ap.ceo?'CEO ✓':'CEO'} · ${ap.hasSardor?(ap.sardor?'Sardor ✓':'Sardor'):'sardor yo’q'}`:'Hamma kiritildi. Maktablar e’lon qilingach, sinovni yakunlang.';
  return `<div class="stage"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="slb">${sid?`${X.sc[sid]?.num}-maktab · bosqich`:'Joriy sinov'}</div><div class="t">${esc(t.name)}</div></div>
   ${isTeam()&&S.tests.length>1?`<button class="pill gray" data-act="pickTest" style="color:var(--fg)">almashtirish</button>`:''}</div>
   <div class="steps">${steps.map((s,k)=>`<span class="${k<i?'done':k===i?'on':''}">${s}</span>`).join('')}</div>${note?`<div style="font-size:13px;opacity:.85">${note}</div>`:''}</div>`}
const absBtn=(k,id,n)=>n>0&&P('kiritish')&&curTest()?`<div style="margin-top:10px"><button class="btn sec sm" data-act="absRest" data-k="${k}" data-id="${id}" data-n="${n}">Qolgan ${n} tasini “Kelmadi” qilish</button></div>`:'';
// bir sinfda bir xil familiya-ism ikki marta kiritilgan bo'lsa, o'zi topib ogohlantiradi
const nKey=n=>String(n||'').toLowerCase().replace(/[`‘’'ʻʼ´]/g,"'").replace(/\s+/g,' ').trim();
function findDups(list){const m={};list.forEach(s=>{const k=s.class_id+'|'+nKey(s.name);(m[k]=m[k]||[]).push(s)});
  return Object.values(m).filter(g=>g.length>1).map(g=>{
    const rank=s=>{const r=R(s.id);return !r?0:r.absent?1:2};
    const sorted=[...g].sort((a,b)=>rank(b)-rank(a)||a.id-b.id);const keep=sorted[0];
    const extra=sorted.slice(1).filter(s=>rank(s)<2); // natijasi bor ikkinchisini o'zi o'chirmaydi
    return{g,keep,extra,manual:sorted.slice(1).some(s=>rank(s)===2)}})}
function dupBox(list){if(!isTeam())return'';const d=findDups(list);if(!d.length)return'';
  const st=s=>{const r=R(s.id);return !r?'kiritilmagan':r.absent?'kelmadi':`${r.score}/${r.qn}`};
  const fix=d.flatMap(x=>x.extra.map(s=>x.keep.id+'-'+s.id));
  return `<div class="card pad warnc" style="gap:10px"><p class="label" style="margin:0;color:var(--wrong)">⚠ Ikki marta kiritilgan bolalar: ${d.length} ta</p>
   <p class="note" style="margin:0">Bir sinfda bir xil familiya va ism bir necha marta bor. Ortiqchasini o’chiring, aks holda “Kelmadi” bo’lib qoladi.</p>
   <div class="card list">${d.map(x=>x.g.map(s=>`<button class="row" data-go="stu:${s.id}"><div class="m"><div class="n">${esc(s.name)}</div><div class="s">${esc(s.cls||'')} · ${st(s)}${x.extra.includes(s)?' · <b style="color:var(--wrong)">ortiqcha</b>':''}</div></div>${I.chev}</button>`).join('')).join('')}</div>
   ${d.some(x=>x.manual)?`<p class="note" style="margin:0">Ba’zilarida ikkalasiga ham ball kiritilgan — qaysi biri to’g’riligini ochib ko’rib, keraksizini o’zingiz o’chiring.</p>`:''}
   ${fix.length&&ED()?`<button class="btn sec sm" data-act="dupFix" data-ids="${fix.join(',')}">Ortiqchalarini o’chirish (${fix.length} ta)</button>`:''}</div>`}
const dlBtn=(k,id=0)=>`<button class="btn sec" data-act="dl" data-k="${k}" data-id="${id}">⬇ Natijalarni yuklab olish</button>`;
const kpis=items=>`<div class="kpis">${items.map(([v,l])=>`<div class="card kpi"><b>${v??'—'}</b><small>${l}</small></div>`).join('')}</div>`;
function stuRow(s,i,o={}){
  const r=R(s.id); const g=o.gifted&&o.gifted.has(s.id);
  const right=!r?`<span class="pill gray">kiritilmagan</span>`:r.absent?`<span class="pill gray">kelmadi</span>`:r.score==null?`<span class="pill gray">kalit yo’q</span>`:`<div class="num">${r.score}/${r.qn}<small>${pct(r)}%</small></div>`;
  return `<button class="row" data-go="stu:${s.id}">${o.rank?`<span class="rank">${r&&!r.absent&&r.score!=null?i+1:''}</span>`:''}${s.avatar?avHtml(s.avatar,30,s.name,s.id):''}<div class="m"><div class="n">${esc(s.name)}</div>${o.sub||g?`<div class="s">${o.sub?esc(o.sub(s)):''}${g?` <span class="pill gold">★ iqtidorli</span>`:''}</div>`:''}</div>${right}</button>`}
function sortStu(list){const a=[...list];
  if(sortBy==='ism')a.sort((x,y)=>x.name.localeCompare(y.name,'uz'));
  else{const k=id=>{const r=R(id);return !r?-3:r.absent?-2:r.score??-1}; // avval qatnashganlar (0 ball ham), keyin kelmaganlar, oxirida kiritilmaganlar
    a.sort((x,y)=>k(y.id)-k(x.id)||x.name.localeCompare(y.name,'uz'))}return a}
const sortSeg=()=>`<div class="seg"><button data-sort="ball" aria-pressed="${sortBy==='ball'}">Ball bo’yicha</button><button data-sort="ism" aria-pressed="${sortBy==='ism'}">Ism bo’yicha</button></div>`;
// "Eng ko'p xato qilingan savollar" bo'limi hozircha o'chirilgan (natijalar asosan umumiy ball bilan kiritilgan). Qaytarish uchun true qiling.
const SHOW_HARD=false;
function hardBox(list,title){if(!SHOW_HARD)return '';
  const t=curTest(); if(!t)return'';
  const blocks=[...new Set(list.map(s=>s.grade))].filter(Boolean).sort((a,b)=>a-b).map(g=>{
    const gl=list.filter(s=>s.grade===g); const n=present(gl).filter(s=>R(s.id)?.bits).length;
    const h=hardest(gl).filter(x=>x.p>0); if(!h.length)return'';
    return `<div class="card pad"><div class="sec-h"><b>${g}-sinf testi</b><span class="pill gray">${n} ta bola</span></div>
     <div class="hard">${h.map(x=>`<span>${x.q}-savol <small>· ${x.p}% xato</small></span>`).join('')}</div>
     ${n<10?`<p class="note" style="margin:0">Faqat ${n} ta bolaning javoblari savol bo’yicha kiritilgan, shuning uchun bu ko’rsatkich hali aniq emas.</p>`:''}</div>`}).filter(Boolean);
  if(!blocks.length)return'';
  return `<section class="sec"><p class="label">${title||'Eng ko’p xato qilingan savollar'}</p>
   <p class="note" style="margin:0">«${esc(t.name)}» sinovi bo’yicha. Har sinfning testi alohida, shuning uchun savollar sinflar bo’yicha ajratilgan. Foiz — shu savolga noto’g’ri javob bergan yoki javob bermagan bolalar ulushi.</p>
   ${blocks.join('')}
   ${isTeam()?`<p class="note">Biror savolni ko’pchilik xato qilgan bo’lsa, e’londan oldin shu sinf kalitini tekshirib ko’ring.</p>`:''}</section>`}
function gradeBars(list){return `<div class="card cmp">${[...new Set(list.map(s=>s.grade))].sort().map(g=>{const v=avgPct(list.filter(s=>s.grade===g));
  return `<div class="r"><span>${g}-sinflar</span><div class="track"><i style="width:${v||0}%;background:${colorFor(v)}"></i></div><b class="num">${v==null?'—':v+'%'}</b></div>`}).join('')}</div>`}
function qGrid(r){if(r&&!r.absent&&r.mode==='ball')return `<div class="card pad"><p class="note" style="margin:0">Bu sinovda faqat umumiy ball kiritilgan. Savollar bo’yicha ma’lumot yo’q.</p></div>`;if(!r||r.absent||!r.bits)return'';
  return `<div class="card pad"><div class="qgrid">${[...r.bits].map((c,i)=>{const a=r.answers?.[i];const cls=c==='1'?'ok':(a==='-'?'bl':'no');return `<div class="q ${cls}" title="${i+1}-savol${a&&a!=='-'?': '+a:''}">${i+1}</div>`}).join('')}</div>
  <div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>to’g’ri</span><span><i style="background:var(--wrong-soft);border:1px solid var(--wrong)"></i>xato</span>${r.mode==='harf'?`<span><i style="background:var(--surface2);border:1px dashed var(--blank)"></i>javobsiz</span>`:''}</div></div>`}

// ================================================================ umumiy qidiruv
const digits=x=>String(x||'').replace(/\D/g,'');
function searchBox(ph){return `<label class="search">${I.search}<input id="gq" type="search" autocomplete="off" placeholder="${ph}" value="${esc(gq)}" aria-label="Qidirish"></label><div id="gres">${searchRes()}</div>`}
function searchRes(){
  let raw=String(gq); const cm=raw.match(/(^|\s)(\d{1,2})\s*-?\s*([a-zA-Zа-яА-Я])(?=\s|$)/); const want=cm?(cm[2]+'-'+cm[3]).toUpperCase():'';
  if(cm)raw=raw.replace(cm[0],' ');
  const t=norm(raw).trim().split(/\s+/).filter(Boolean); if(!t.length&&!want)return'';
  const okC=n=>!want||String(n||'').toUpperCase()===want;
  const hit=(words,phone)=>t.every(x=>words.some(w=>w.startsWith(x))||(x.length>=4&&/^\d+$/.test(x)&&digits(phone).includes(x)));
  const many=S.schools.length>1;
  const st=X.st.filter(s=>okC(s.cls)&&hit(norm(`${s.name} ${s.cls||''} ${s.num||''} maktab`).split(' ').filter(Boolean),s.phone)).sort((a,b)=>a.name.localeCompare(b.name,'uz'));
  const ppl=[];
  if(isTeam()||S.me.role==='direktor'){
    S.classes.forEach(c=>{if((c.teacher_name||c.teacher_phone)&&okC(c.name)){const sc=X.sc[c.school_id];if(hit(norm(`${c.teacher_name||''} ${c.name} ${sc?.num||''} maktab rahbar`).split(' ').filter(Boolean),c.teacher_phone))ppl.push({go:'class:'+c.id,n:c.teacher_name||'Ismi kiritilmagan',s:`Sinf rahbari · ${many?sc?.num+'-maktab · ':''}${c.name}`})}});
    if(isTeam()&&!want)S.schools.forEach(sc=>{if(sc.director_name||sc.director_phone){if(hit(norm(`${sc.director_name||''} ${sc.num} maktab direktor`).split(' ').filter(Boolean),sc.director_phone))ppl.push({go:'school:'+sc.id,n:sc.director_name||'Ismi kiritilmagan',s:`Direktor · ${sc.num}-maktab`})}});
  }
  if(!st.length&&!ppl.length)return `<div class="empty">Hech narsa topilmadi. Harflarni tekshiring.</div>`;
  const sub=s=>`${many?s.num+'-maktab · ':''}${s.cls||''}`;
  return `${ppl.length?`<section class="sec"><p class="label">Xodimlar · ${ppl.length}</p><div class="card list">${ppl.slice(0,15).map(x=>`<button class="row" data-go="${x.go}"><div class="m"><div class="n">${esc(x.n)}</div><div class="s">${esc(x.s)}</div></div>${I.chev}</button>`).join('')}</div></section>`:''}
  ${st.length?`<section class="sec"><p class="label">O’quvchilar · ${st.length}</p><div class="card list">${st.slice(0,30).map((x,i)=>stuRow(x,i,{sub})).join('')}</div>${st.length>30?`<p class="note">Yana ${st.length-30} ta bor. Qidiruvni aniqroq yozing.</p>`:''}</section>`:''}`}

function scrRanking(){
  const st=X.st.filter(s=>s.grade===rGrade); const gifted=giftedSet();
  let body='';
  if(rMode==='bola'){const p=present(st).filter(s=>R(s.id).score!=null).sort((a,b)=>R(b.id).score-R(a.id).score).slice(0,50);
    body=`<div class="card list">${p.map((s,i)=>stuRow(s,i,{rank:true,gifted,sub:s=>`${s.num}-maktab · ${s.cls}`})).join('')||'<div class="empty">Natija yo’q</div>'}</div>`}
  else if(rMode==='maktab'){const r=S.schools.map(sc=>{const l=st.filter(s=>s.school_id===sc.id);return{sc,v:avgPct(l),c:present(l).length}}).filter(x=>x.c).sort((a,b)=>b.v-a.v);
    body=`<div class="card list">${r.map((x,i)=>`<button class="row" data-go="school:${x.sc.id}"><span class="rank">${i+1}</span><div class="m"><div class="n">${x.sc.num}-maktab</div><div class="s">${x.c} ta bola qatnashdi</div></div><div class="num">${x.v}%</div></button>`).join('')||'<div class="empty">Natija yo’q</div>'}</div>`}
  else{const r=S.classes.filter(c=>c.grade===rGrade).map(c=>{const l=X.st.filter(s=>s.class_id===c.id);return{c,v:avgPct(l),k:present(l).length}}).filter(x=>x.k).sort((a,b)=>b.v-a.v);
    body=`<div class="card list">${r.map((x,i)=>`<button class="row" data-go="class:${x.c.id}"><span class="rank">${i+1}</span><div class="m"><div class="n">${X.sc[x.c.school_id].num}-maktab · ${esc(x.c.name)}</div><div class="s">${x.k} ta bola</div></div><div class="num">${x.v}%</div></button>`).join('')||'<div class="empty">Natija yo’q</div>'}</div>`}
  const grades=[...new Set(S.classes.map(c=>c.grade))].sort(); if(!grades.includes(rGrade)&&grades.length)rGrade=grades[0];

// ---------------- yuqori natijalar: chegaradan yuqori olgan barcha bolalar (hamma maktablar)
function topStu(min=topMin,g=topGrade,sc=topSchool){
  return present(X.st).filter(s=>{const r=R(s.id);return r.score!=null&&pct(r)>=min&&(!g||s.grade===g)&&(!sc||s.school_id===sc)})
   .sort((a,b)=>pct(R(b.id))-pct(R(a.id))||a.name.localeCompare(b.name,'uz'))}
function topList(){const l=topStu();const many=S.schools.length>1;
  return `<div class="sec-h"><p class="label">${topMin}% va undan yuqori</p><span class="pill gold">${l.length} ta bola</span></div>
  ${l.length?`<div class="card list">${l.map((s,i)=>stuRow(s,i,{rank:true,sub:s=>`${many?s.num+'-maktab · ':''}${s.cls}`})).join('')}</div>`:`<div class="card empty">Bu chegaradan yuqori natija yo’q. Foizni pasaytirib ko’ring.</div>`}`}
function scrTop(){
  const grades=[...new Set(X.st.map(s=>s.grade))].filter(Boolean).sort((a,b)=>a-b);if(topGrade&&!grades.includes(topGrade))topGrade=0;
  if(topSchool&&!X.sc[topSchool])topSchool=0;
  return ['Yuqori natijalar',curTest()?.name||'',`
  <div class="card pad"><label style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span>Kamida necha foiz?</span>
   <input id="topMin" type="number" inputmode="numeric" min="0" max="100" value="${topMin}" style="width:84px;padding:8px;border-radius:10px;border:1px solid var(--line,#ccd);font:inherit;text-align:center"></label>
   <p class="note" style="margin:0">Masalan 70 — 70% va undan yuqori olgan barcha bolalar chiqadi.</p></div>
  ${grades.length>1?`<div class="seg"><button data-tg="0" aria-pressed="${!topGrade}">Hammasi</button>${grades.map(g=>`<button data-tg="${g}" aria-pressed="${topGrade===g}">${g}-sinflar</button>`).join('')}</div>`:''}
  ${S.schools.length>1?`<div class="seg"><button data-ts="0" aria-pressed="${!topSchool}">Barcha maktablar</button>${[...S.schools].sort((a,b)=>a.num-b.num).map(sc=>`<button data-ts="${sc.id}" aria-pressed="${topSchool===sc.id}">${sc.num}-maktab</button>`).join('')}</div>`:''}
  ${dlBtn('top')}
  <section class="sec" id="topRes">${topList()}</section>`]}

// ---------------- entry (kiritish)
function scrEntry(){
  const t=curTest();
  if(!t)return ['Kiritish','',`<div class="card empty">Avval sinov yarating.</div>`];
  const st=X.st; const done=st.filter(s=>R(s.id)).length; const pq=queue().length;
  return ['Kiritish',t.name,`
  ${pq?`<div class="offline">${pq} ta natija hali yuborilmagan. Internet kelishi bilan o’zi yuboriladi.</div>`:''}
  <div class="card pad"><div class="sec-h"><span class="note">Kiritildi</span><b class="num">${done} / ${st.length}</b></div><div class="bar" style="margin:0"><i style="width:${st.length?done/st.length*100:0}%"></i></div></div>
  <label class="search">${I.search}<input id="q" type="search" autocomplete="off" placeholder="Familiya yoki ism…" value="${esc(q)}" aria-label="Bolani qidirish"></label>
  <div class="seg"><button data-qs="0" aria-pressed="${qSchool===0}">Hammasi</button>${S.schools.map(sc=>`<button data-qs="${sc.id}" aria-pressed="${qSchool===sc.id}">${sc.num}-maktab</button>`).join('')}</div>
  <div id="res">${entryList()}</div>
  ${P('maktab')||P('kiritish')?`<button class="lnk" data-act="studentEdit" data-quick="1" style="align-self:flex-start">+ Ro’yxatda yo’q bolani qo’shish</button>`:''}`]}
function entryList(){
  const pool=X.st.filter(s=>!qSchool||s.school_id===qSchool);
  const t=norm(q).trim().split(/\s+/).filter(Boolean);
  if(!t.length){const mine=(S.results||[]).filter(r=>r.test_id===testId&&r.entered_by===S.me.id).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,8).map(r=>pool.find(s=>s.id===r.student_id)).filter(Boolean);
    return mine.length?`<p class="label" style="margin-bottom:8px">Oxirgi kiritganlaringiz</p><div class="card list">${mine.map(entryRow).join('')}</div>`:`<div class="empty">Kitobchadagi bolaning familiyasidan 2–3 harf yozing.</div>`}
  const hits=pool.filter(s=>{const w=norm(s.name).split(' ');return t.every(x=>w.some(y=>y.startsWith(x)))}).slice(0,40);
  return hits.length?`<div class="card list">${hits.map(entryRow).join('')}</div>`:`<div class="empty">Topilmadi. Harflarni tekshiring yoki bolani ro’yxatga qo’shing.</div>`}
function entryRow(s){const r=R(s.id);const qd=queue().some(x=>x.student_id===s.id);
  const tag=qd?`<span class="pill gold">yuborilmagan</span>`:!r?'':r.absent?`<span class="pill gray">kelmadi</span>`:`<span class="pill ok">${r.score??'?'}/${r.qn}</span>`;
  return `<button class="row" data-act="enter" data-id="${s.id}"><div class="m"><div class="n">${esc(s.name)}</div><div class="s">${s.num}-maktab · ${esc(s.cls)}</div></div>${tag}</button>`}
// offline queue
const queue=()=>ls.get('queue',[]);
async function flushQueue(){let qd=queue();if(!qd.length)return;const left=[];
  for(const it of qd){try{await api('result.save',it)}catch(e){if(/Failed to fetch|NetworkError|Load failed/i.test(e.message))left.push(it);else toast(e.message,true)}}
  ls.set('queue',left);if(left.length<qd.length)await load()}
window.addEventListener('online',flushQueue);setInterval(()=>{if(queue().length)flushQueue()},20000);

let E=null; // entry sheet state
function openEntry(id){
  const s=X.st.find(x=>x.id===id); const r=R(id); const key=S.keys?.[testId]?.[s.grade]||'';
  const qn=key.length||r?.qn||20;
  E={s,mode:r?.mode||ls.get('mode','belgi'),wasBall:null,total:r&&!r.absent&&r.mode==='ball'?r.score:null,bits:(r&&!r.absent&&r.bits?r.bits:'0'.repeat(qn)).padEnd(qn,'0').split(''),ans:(r?.answers||'-'.repeat(qn)).padEnd(qn,'-').split(''),qn,existed:!!r,key};
  drawEntry();
}
function drawEntry(){
  const {s,qn}=E; const marked=E.bits.filter(x=>x==='1').length; const filled=E.ans.filter(a=>a!=='-').length;
  const keyKnown=E.key&&!E.key.includes('?');
  const sc=E.mode==='ball'?E.total:E.mode==='belgi'?marked:keyKnown?E.ans.filter((a,i)=>a===E.key[i]).length:null;
  openSheet(`<div class="sh-top"><div class="m"><h2>${esc(s.name)}</h2><div class="s">${s.num}-maktab · ${esc(s.cls)}${E.existed?' · avval kiritilgan':''}${E.wasBall!=null?` · hozir faqat ball: ${E.wasBall}`:''}</div></div><button class="ib" data-act="close" aria-label="Yopish">${I.x}</button></div>
   <div class="seg"><button data-mode="ball" aria-pressed="${E.mode==='ball'}">Ball</button><button data-mode="belgi" aria-pressed="${E.mode==='belgi'}">Belgilash</button><button data-mode="harf" aria-pressed="${E.mode==='harf'}">Harflar</button></div>
   <div class="card score">${E.mode==='ball'&&sc==null?`<b>—</b><span class="note">/ ${qn} to’g’ri</span>`:sc!=null?`<b>${sc}</b><span class="note">/ ${qn} to’g’ri</span>`:`<b>${filled}</b><span class="note">/ ${qn} javob yozildi</span>`}<div class="r">${E.mode==='harf'?`${qn-filled} ta javobsiz`:''}</div></div>
   ${E.mode==='ball'?`<p class="note">Bola nechta savolni to’g’ri yechgan bo’lsa, shu sonni bosing.</p>
    <div class="tiles">${Array.from({length:qn+1},(_,n)=>`<button class="tile" data-total="${n}" aria-pressed="${E.total===n}">${n}</button>`).join('')}</div>`
   :E.mode==='belgi'?`<p class="note">Bola to’g’ri yechgan savollarni bosing. Bosilmaganlari xato hisoblanadi.</p>
    <div class="tiles">${E.bits.map((v,i)=>`<button class="tile" data-bit="${i}" aria-pressed="${v==='1'}">${i+1}</button>`).join('')}</div>
    <div style="display:flex;gap:16px"><button class="lnk" data-act="allOn">Hammasi to’g’ri</button><button class="lnk" data-act="allOff">Tozalash</button></div>`
   :`<p class="note">Varaqadagi harflarni kiriting. Sayt kalit bilan o’zi tekshiradi.${E.key?'':' <b>Bu sinf uchun kalit hali kiritilmagan</b> — ball kalit kiritilgach hisoblanadi.'}</p>
    <div class="letters">${[0,Math.ceil(qn/2)].map((st,ci)=>`<div class="lcol">${Array.from({length:ci?qn-st:st||Math.ceil(qn/2)},(_,j)=>{const i=st+j;const a=E.ans[i];
      return `<div class="lrow"><span>${i+1}</span>${'ABCDE'.split('').map(L=>`<button class="lb" data-q="${i}" data-l="${L}" aria-pressed="${a===L}">${L}</button>`).join('')}</div>`}).join('')}</div>`).join('')}</div>`}
   ${E.existed&&(P('tuzatish')||R(s.id)?.entered_by===S.me.id)?`<button class="btn dan" data-act="entryDel">Kiritilgan natijani o’chirish</button>`:''}
   <div class="actions"><button class="btn sec" data-act="entrySave" data-absent="1">Kelmadi</button><button class="btn pri" data-act="entrySave">Saqlash${sc!=null?' · '+sc+' ball':''}</button></div>`);
}
async function entrySave(absent){
  if(!absent&&E.mode==='ball'&&E.total==null){toast('Ballni tanlang',true);return}
  const body={test_id:testId,student_id:E.s.id,absent:!!absent,mode:E.mode,bits:E.bits.join(''),answers:E.mode==='harf'?E.ans.join(''):'',score:E.total};
  ls.set('mode',E.mode); const name=E.s.name;
  try{const r=await api('result.save',body);closeSheet();toast(absent?`${name}: kelmadi`:`${name}: ${r.score??'?'} ball saqlandi`);q='';await load();$('#q')?.focus()}
  catch(e){if(/Failed to fetch|NetworkError|Load failed/i.test(e.message)){const qd=queue().filter(x=>x.student_id!==body.student_id);qd.push(body);ls.set('queue',qd);closeSheet();toast(`${name}: internet yo’q, telefonda saqlandi`);q='';render()}else toast(e.message,true)}
}

function inkOnly(img){
  if(!img)return null;
  try{const W=img.width,H=img.height,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(img,0,0);
    const d=g.getImageData(0,0,W,H),p=d.data;
    // fon rangi: chetlardagi piksellarning o'rtachasi
    let r=0,gg=0,b=0,n=0;const add=i=>{r+=p[i];gg+=p[i+1];b+=p[i+2];n++};
    for(let x=0;x<W;x+=4){add((x)*4);add(((H-1)*W+x)*4)}for(let y=0;y<H;y+=4){add((y*W)*4);add((y*W+W-1)*4)}
    r/=n;gg/=n;b/=n;
    let x0=W,y0=H,x1=0,y1=0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(p[i+3]<10){p[i+3]=0;continue}
      // ko'k/rangli siyoh rang to'yinganligidan, qora siyoh esa fondan ancha to'qligidan topiladi (soya va notekis yorug'lik hisobga olinmaydi)
      const mx=Math.max(p[i],p[i+1],p[i+2]),mn=Math.min(p[i],p[i+1],p[i+2]),chroma=(mx-mn)-(Math.max(r,gg,b)-Math.min(r,gg,b));
      const dark=(r+gg+b)/3-(p[i]+p[i+1]+p[i+2])/3;
      const a=Math.max(0,Math.min(1,Math.max((chroma-14)/30,(dark-60)/40)));
      p[i+3]=Math.round(p[i+3]*a);
      if(a>.5){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}}
    g.putImageData(d,0,0);
    if(x1<=x0||y1<=y0)return img;
    const pad=Math.round(Math.max(x1-x0,y1-y0)*.04);x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
    const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o}
  catch(e){return img}}

  const tests=[...new Set(all.map(c=>c.test_id))];if(cfTest&&!tests.includes(cfTest))cfTest=0;
  let l=all.filter(c=>!cfTest||c.test_id===cfTest);
  const schools=[...new Set(l.map(c=>c.s.school_id))].map(id=>X.sc[id]).filter(Boolean).sort((a,b)=>a.num-b.num);if(cfSchool&&!schools.some(x=>x.id===cfSchool)){cfSchool=0;cfGrade=0;cfClass=0}
  l=l.filter(c=>!cfSchool||c.s.school_id===cfSchool);
  const grades=[...new Set(l.map(c=>c.s.grade))].filter(Boolean).sort((a,b)=>a-b);if(cfGrade&&!grades.includes(cfGrade)){cfGrade=0;cfClass=0}
  l=l.filter(c=>!cfGrade||c.s.grade===cfGrade);
