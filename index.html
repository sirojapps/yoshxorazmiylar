      <label class="field"><span class="label">Qaysi sinfga?</span><select id="mvTo">${o.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select></label>
      <p class="note">Natijalari ham bola bilan birga ko’chadi. Kim ko’chirgani tarixda yoziladi.</p>
      <button class="btn pri" data-act="moveGo" data-id="${st.id}">Ko’chirish</button>`);break}
   case 'moveGo':{const st=X.st.find(x=>x.id===+d.id);const to=+val('mvTo');await api('student.move',{id:+d.id,class_id:to});closeSheet();
     toast(`${st?.name||'O’quvchi'} ko’chirildi`);await load();break}
   case 'studentDel':{const sid=+d.id||+$('#sheet')?.dataset.id;const st=X.st.find(x=>x.id===sid);if(!sid)break;const r=R(sid);
     if(!confirm(`${st?.name||'O’quvchi'} (${st?.cls||''}) ro’yxatdan o’chirilsinmi?${r&&!r.absent?`\n\nDiqqat: bu bolaga ${bl(r)} kiritilgan!`:''}\n\n30 kun ichida “O’chirilganlar” bo’limidan qaytarish mumkin.`))break;
     await api('student.delete',{id:sid});closeSheet();stack.pop();toast('O’chirildi. “O’chirilganlar”dan qaytarish mumkin');await load();break;}
   case 'restore':await api('student.restore',{id:+d.id});toast('Qaytarildi');HIST=null;TRASH=null;await load();break;
   case 'import':openImport();break;
   case 'impSave':{const num=val('impNum');if(!num){toast('Maktab raqamini yozing',true);break}const r=await api('students.import',{school_num:num,rows:IMP,test_id:testId});closeSheet();toast(`${r.added} ta qo’shildi${r.skipped?`, ${r.skipped} ta avvaldan bor edi`:''}${r.results?`, ${r.results} ta natija yozildi`:''}${r.absents?`, ${r.absents} ta kelmadi`:''}`,!!r.errors?.length);if(r.errors?.length)alert('Natija yozilmadi:\n'+r.errors.join('\n'));await load();break}
   case 'testEdit':{const t=d.id?S.tests.find(x=>x.id===+d.id):{status:'tayyor',gifted_top:10,gifted_min:70};
     formSheet(d.id?'Tahrirlash':'Yangi sinov yoki imtihon',[{id:'fTN',label:'Nomi',value:t.name,ph:'Masalan: 2026–2027 · 2-bosqich'},{id:'fTD',label:'Sana',type:'date',value:t.date},{id:'fTS',label:'Holati',type:'select',options:STATUS.slice(0,3).concat(t.status==='yakunlandi'?[STATUS[3]]:[]),value:t.status},{id:'fTG',label:'Iqtidorli: eng yaxshi necha foiz',value:t.gifted_top,mode:'numeric'},{id:'fTM',label:'Iqtidorli: kamida necha foiz ball',value:t.gifted_min,mode:'numeric'}],'testSave',scopeHtml(t));$('#sheet').dataset.id=d.id||'';break}
   case 'dupFix':{const pairs=d.ids.split(',').map(x=>x.split('-').map(Number)).filter(x=>x[0]&&x[1]);
     if(!confirm(`${pairs.length} ta ortiqcha nusxa olib tashlanadi. Natijasi bor nusxa qoladi, ortiqchasidagi telefon va boshqa ma’lumotlar unga o’tkaziladi.`))break;
     const r=await api('students.merge',{pairs});toast(`${r.n} ta ortiqcha nusxa olib tashlandi`);await load();break}
   case 'itEdit':openItEdit(+d.id||0,+d.school||S.schools[0]?.id);break;
   case 'itSave':{const sh=$('#sheet').dataset;const r=await api('itest.save',{id:+sh.id||undefined,school_id:+sh.school,name:val('itN'),subject:val('itS'),day:val('itD'),qn:val('itQ'),grade:val('itG')[0]==='g'?+val('itG').slice(1):0,class_id:val('itG')[0]==='c'?+val('itG').slice(1):0});closeSheet();toast('Saqlandi');await load();if(!sh.id){stack.push('itest:'+r.id);render()}break}
   case 'itDel':{if(!confirm('Bu ichki sinov va uning hamma natijalari o’chiriladi. 30 kun ichida “O’chirilganlar” bo’limidan qaytarish mumkin. Davom etasizmi?'))break;await api('itest.delete',{id:+d.id});stack.pop();toast('O’chirildi');await load();break}
   case 'irAbs':{const tid=+(stack[stack.length-1]||'').split(':')[1];const r=IR(tid,+d.sid);await api('iresult.save',r?.absent?{itest_id:tid,student_id:+d.sid,clear:1}:{itest_id:tid,student_id:+d.sid,absent:1});await load();break}
   case 'avPick':openAvPick(0);break;
   case 'kidAv':openAvPick(+d.id);break;
   case 'avUpload':{const kid=+d.kid;pickImage(async u=>{try{if(kid){const r=await api('student.avatar',{id:kid,avatar:u});const s=(S.students||[]).find(x=>x.id===kid);if(s)s.avatar='ph:'+r.v}else{await api('me.avatar',{avatar:u});S.me.avatar=u}closeSheet();toast('Surat saqlandi');render()}catch(e){toast(e.message,true)}},kid?200:240);break}
   case 'avNudgeOff':ls.set('avn',1);render();break;
   case 'avSet':{const kid=+d.kid;if(kid){await api('student.avatar',{id:kid,avatar:d.v});const s=(S.students||[]).find(x=>x.id===kid);if(s)s.avatar=''}else{await api('me.avatar',{avatar:d.v});S.me.avatar=d.v}closeSheet();toast('Saqlandi');render();break}
   case 'reload':{const y=scrollY;b.style.opacity='.4';await load();requestAnimationFrame(()=>scrollTo(0,y));toast('Yangilandi');break}
   case 'delOpen':openDel(d.k,+d.id);break;
   case 'delGo':{const k=d.k,id=+d.id;await api(k+'.delete',{id,confirm:val('delConf')});closeSheet();TRASH=null;if(k!=='test'){while(stack.length&&/^(school|class|stu|itest):/.test(stack[stack.length-1]))stack.pop()}if(k==='test'&&testId===id){testId=0}toast('O’chirildi. “O’chirilganlar” bo’limidan qaytarish mumkin');await load();break}
   case 'trRestore':{await api('trash.restore',{id:+d.id});TRASH=null;toast('Qaytarildi');await load();break}
   case 'trPurge':{if(!confirm('Butunlay o’chirilsinmi? Keyin qaytarib bo’lmaydi.'))break;await api('trash.purge',{id:+d.id});TRASH=null;toast('Butunlay o’chirildi');render();break}
   case 'absRest':{const n=+d.n,where=d.k==='class'?`${X.cl[+d.id]?.name} sinfida`:`${X.sc[+d.id]?.num}-maktabda`;
     if(!confirm(`${where} natijasi kiritilmagan ${n} ta bola “Kelmadi” deb belgilanadi.\n\nBarcha kelgan bolalar natijasi kiritib bo’lindimi?`))break;
     const r=await api('results.absentRest',{test_id:testId,[d.k==='class'?'class_id':'school_id']:+d.id});toast(`${r.n} ta bola “Kelmadi” deb belgilandi`);await load();break}
   case 'toCheck':{const t=S.tests.find(x=>x.id===+d.id);if(!t)break;if(!confirm('Barcha maktablarda sinov o’tkazildimi? Sinov Tekshiruv bosqichiga o’tadi.'))break;
     await api('test.save',{id:t.id,name:t.name,date:t.date,status:'tekshiruv',gifted_top:t.gifted_top,gifted_min:t.gifted_min});toast('Tekshiruvga o’tkazildi');await load();break}
   case 'testSave':{const r=await api('test.save',{id:+$('#sheet').dataset.id||undefined,name:val('fTN'),date:val('fTD'),status:val('fTS'),gifted_top:val('fTG'),gifted_min:val('fTM'),scope:readScope()});const isNew=!$('#sheet').dataset.id;if(!testId){testId=r.id;ls.set('test',testId)}closeSheet();toast('Saqlandi');await load();if(isNew&&isTeam()){tab='imtihon';stack=[];go('exam:'+r.id)}break}
   case 'keyEdit':{const tid=+d.id;const k=S.keys?.[tid]||{};openSheet(`<div class="sh-top"><div class="m"><h2>Kalit kiritish</h2><div class="s">Har sinf uchun javoblar ketma-ket, masalan: ABECDCBDCE…</div></div><button class="ib" data-act="close">${I.x}</button></div>
     ${[2,3,4].map(g=>`<label class="field"><span class="label">${g}-sinf</span><input id="key${g}" value="${esc(k[g]&&!k[g].includes('?')?k[g]:'')}" autocapitalize="characters" placeholder="${k[g]?'kiritilgan':'20 ta harf'}" style="font-family:ui-monospace,monospace;letter-spacing:.1em"></label>`).join('')}
     <p class="note">Kalit o’zgartirilsa, shu sinovdagi harflar bilan kiritilgan natijalar o’zi qayta hisoblanadi.</p><button class="btn pri" data-act="keySave" data-id="${tid}">Saqlash</button>`);break}
   case 'keySave':{let n=0;for(const g of [2,3,4]){const v=val('key'+g).toUpperCase().replace(/[^A-E]/g,'');if(v){await api('key.save',{test_id:+d.id,grade:g,key:v});n++}}closeSheet();toast(n?'Kalit saqlandi':'O’zgarish yo’q');await load();break}
   case 'pinIssue':{const r=await api('pin.issue',{kind:d.k,ref:d.r});PINS=null;showPin(r,d.k);render();break}
   case 'pinMenu':{const x=PINS.find(p=>p.kind===d.k&&String(p.ref)===d.r);openSheet(`<div class="sh-top"><div class="m"><h2>${esc(x.name)}</h2><div class="s">${ph(x.phone)}</div></div><button class="ib" data-act="close">${I.x}</button></div>
     <div class="card pad" style="align-items:center"><span class="code">${esc(x.user.pin)}</span><span class="note">Berilgan: ${fmtDate(x.user.pin_at)}${x.user.last_login?' · oxirgi kirish '+fmtDate(x.user.last_login):' · hali kirmagan'}</span></div>
     <button class="btn sec" data-act="pinShow" data-k="${x.kind}" data-r="${esc(x.ref)}">SMS matnini ko’rsatish</button>
     <button class="btn sec" data-act="pinIssue" data-k="${x.kind}" data-r="${esc(x.ref)}">Yangi PIN berish</button>
     <button class="btn dan" data-act="pinRevoke" data-id="${x.user.id}">PIN’ni o’chirish</button>`);break}
   case 'pinShow':{const x=PINS.find(p=>p.kind===d.k&&String(p.ref)===d.r);showPin({pin:x.user.pin,name:x.name,phone:x.phone},x.kind);break}
   case 'pinRevoke':await api('pin.revoke',{user_id:+d.id});closeSheet();PINS=null;toast('PIN o’chirildi');render();break;
   case 'pinBulk':{const l=PINS.filter(x=>x.kind===pinKind&&(!pinSchool||x.school_id===pinSchool)&&!x.user?.pin&&(x.phone||x.kind!=='ota'));
     openSheet(`<div class="sh-top"><div class="m"><h2>${l.length} ta PIN berilsinmi?</h2><div class="s">Har biriga alohida 6 xonali PIN yaratiladi</div></div><button class="ib" data-act="close">${I.x}</button></div><button class="btn pri" data-act="pinBulkGo">Ha, PIN berish</button><button class="btn sec" data-act="close">Bekor qilish</button>`);break}
   case 'pinBulkGo':{const l=PINS.filter(x=>x.kind===pinKind&&(!pinSchool||x.school_id===pinSchool)&&!x.user?.pin&&(x.phone||x.kind!=='ota'));const out=[];
     for(const x of l){try{out.push({...(await api('pin.issue',{kind:x.kind,ref:x.ref})),kind:x.kind})}catch(err){}}
     PINS=null;openSheet(`<div class="sh-top"><div class="m"><h2>${out.length} ta PIN berildi</h2><div class="s">Har biriga bosib SMS yuboring</div></div><button class="ib" data-act="close">${I.x}</button></div>
     <div class="card list">${out.map(o=>`<div class="row"><div class="m"><div class="n">${esc(o.name)}</div><div class="s">${ph(o.phone)}</div></div><span class="num" style="font-family:var(--display)">${o.pin}</span>${o.phone?`<a class="btn pri sm" style="text-decoration:none" href="sms:+998${o.phone}?body=${encodeURIComponent(smsText(o.pin,o.kind))}">SMS</a>`:''}</div>`).join('')}</div>`);render();break}
   case 'copySms':{const t=$('#smsText').textContent;try{await navigator.clipboard.writeText(t);toast('Nusxalandi')}catch(err){toast('Nusxalab bo’lmadi. Matnni bosib turib nusxalang',true)}break}
   case 'teamEdit':{const u=d.id?(S.team||[]).find(x=>x.id===+d.id):{perms:{kiritish:true}};const PL={kiritish:'Natija kiritish',maktab:'Maktab, sinf, o’quvchi, sinov qo’shish',tuzatish:'Natijani tekshirish va tuzatish',kalit:'Kalitni ko’rish (sinovdan keyin)',reyting:'Tuman reytingi',pinlar:'PIN ro’yxatini ko’rish',pin_korish:'PIN raqamlarini ko’rish',tarix:'O’zgarishlar tarixi',xabar:'Xabarlarga javob berish',mashq:'Mashg’ulot qo’shish',yuklash:'Natijalarni yuklab olish (kuzatuvchi uchun)'};const KOFF=['kiritish','maktab','tuzatish','kalit','pinlar','pin_korish','mashq'];
     openSheet(`<div class="sh-top"><div class="m"><h2>${d.id?esc(u.name):'Yangi a’zo'}</h2></div><button class="ib" data-act="close">${I.x}</button></div>
     <label class="field"><span class="label">Ism familiya</span><input id="tmN" value="${esc(u.name||'')}"></label><label class="field"><span class="label">Telefon</span><input id="tmP" type="tel" inputmode="tel" placeholder="90 123 45 67" value="${esc(u.phone||'')}"><span class="note" style="margin-top:4px;font-size:12.5px">${TG_HINT}</span></label>
     <div class="card list"><label class="check"><input type="checkbox" id="pm_kuzatuvchi" ${u.perms.kuzatuvchi?'checked':''}><b>Kuzatuvchi</b>&nbsp;— hamma narsani faqat ko’radi, o’zgartira olmaydi</label><label class="check"><input type="checkbox" id="pm_sardor" ${u.perms.sardor?'checked':''} data-act="sardorToggle"><b>Jamoa sardori</b>&nbsp;— e’lonni tasdiqlaydi</label>${Object.entries(PL).map(([k,l])=>`<label class="check"><input type="checkbox" id="pm_${k}" ${u.perms[k]?'checked':''}>${l}</label>`).join('')}</div>
     <p class="note">PIN berish faqat sizda qoladi.</p><button class="btn pri" data-act="teamSave" data-id="${d.id||''}">Saqlash</button>${d.id?`<button class="btn dan" data-act="teamRemove" data-id="${d.id}">Jamoadan chiqarish</button>`:''}`);
     const kz=()=>{const on=$('#pm_kuzatuvchi').checked;KOFF.concat('sardor').forEach(k=>{const x=$('#pm_'+k);if(!x)return;if(on)x.checked=false;x.disabled=on;x.closest('label').style.opacity=on?.45:1})};
     $('#pm_sardor').onchange=e=>{if(e.target.checked){$('#pm_kuzatuvchi').checked=false;kz();Object.keys(PL).forEach(k=>{if(k!=='pin_korish'&&k!=='yuklash')$('#pm_'+k).checked=true})}};$('#pm_kuzatuvchi').onchange=kz;kz();break}
   case 'teamSave':{PINS=null;const perms={sardor:$('#pm_sardor').checked,kuzatuvchi:$('#pm_kuzatuvchi').checked};S.perms.forEach(k=>perms[k]=$('#pm_'+k)?.checked||false);const r=await api('team.save',{id:+d.id||undefined,name:val('tmN'),phone:val('tmP'),perms});
     if(r.pin)showPin({pin:r.pin,name:val('tmN'),phone:val('tmP').replace(/\D/g,'').slice(-9)},'jamoa');else{closeSheet();toast('Saqlandi')}await load();break}
   case 'teamRemove':await api('team.remove',{id:+d.id});closeSheet();toast('Jamoadan chiqarildi');await load();break;
   case 'noteSave':{const t=val('noteText');if(!t)break;await api('note.save',{student_id:+d.id,text:t});toast('Izoh saqlandi');await load();break}
   case 'noteSummary':await api('note.summary',{id:+d.id});await load();break;
   case 'history':stack.push('history');HIST=null;histStudent=+d.id;render();scrollTo(0,0);break;
   case 'resImport':{let j;try{j=JSON.parse(val('resImp'))}catch(err){$('#resImpMsg').textContent='Matn noto’g’ri. To’liq nusxalanganini tekshiring.';break}
     const r=await api('results.import',{test_id:testId,rows:j.rows||j});$('#resImpMsg').textContent=`${r.ok} ta natija qo’shildi.${r.miss.length?' Topilmadi: '+r.miss.join('; '):''}`;await load();break}
  }}catch(err){toast(err.message,true)}
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(!S&&/^\d$/.test(e.key)){document.querySelector(`[data-d="${e.key}"]`)?.click()}if(!S&&e.key==='Backspace'){pin=pin.slice(0,-1);render()}});
if(location.pathname.startsWith('/t/'))renderVerify(decodeURIComponent(location.pathname.slice(3)));else load().then(flushQueue);
</script>
