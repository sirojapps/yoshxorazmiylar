}

function tieCmp(a,b){const x=a?.bits||'',y=b?.bits||'';if(!x||!y||x.length!==y.length||a.qn!==100)return 0;const n=x.length,one=(s,i,j)=>[...s.slice(i,j)].filter(c=>c==='1').length;
  for(let g=Math.floor((n-1)/5);g>=0;g--){const d=one(y,g*5,g*5+5)-one(x,g*5,g*5+5);if(d)return d}

// offline queue
const queue=()=>ls.get('queue',[]);
async function flushQueue(){let qd=queue();if(!qd.length)return;const left=[];
  for(const it of qd){try{await api('result.save',it)}catch(e){if(/Failed to fetch|NetworkError|Load failed/i.test(e.message))left.push(it);else toast(e.message,true)}}
  ls.set('queue',left);if(left.length<qd.length)await load()}

let E=null; // entry sheet state
function openEntry(id){
  const s=X.st.find(x=>x.id===id); const r=R(id); const ev=r?.variant||'A'; const key=keyOf(testId,s.grade,ev)||(ev!=='A'&&vinfo(testId,s.grade)?'?'.repeat(vinfo(testId,s.grade).qn):'');

    <div class="tiles">${Array.from({length:qn+1},(_,n)=>`<button class="tile" data-total="${n}" aria-pressed="${E.total===n}">${n}</button>`).join('')}</div>`

   :`${varsOf(testId,s.grade).length>1?`<div class="seg">${varsOf(testId,s.grade).map(v=>`<button data-ev="${v}" aria-pressed="${E.v===v}">${VL(v)}-variant</button>`).join('')}</div>`:''}<p class="note">Varaqadagi harflarni kiriting. Sayt kalit bilan o’zi tekshiradi.${E.key?'':' <b>Bu sinf uchun kalit hali kiritilmagan</b> — ball kalit kiritilgach hisoblanadi.'}</p>
    <div class="letters">${[0,Math.ceil(qn/2)].map((st,ci)=>`<div class="lcol">${Array.from({length:ci?qn-st:st||Math.ceil(qn/2)},(_,j)=>{const i=st+j;const a=E.ans[i];

}

function histLine(h){const d=h.detail;
  if(h.action==='natija.tuzatish')return `${esc(h.stu||'')}: ${d.old?.absent?'kelmadi':esc(d.old?.score)} → ${d.new?.absent?'kelmadi':esc(d.new?.score)}`;
  if(h.action==='natija.kiritish')return `${esc(h.stu||'')}: ${d.absent?'kelmadi':esc(d.score)+' ball'}${d.skaner?' · skaner':''}`;
  if(h.action==='natija.ochirish')return `${esc(h.stu||'')}: ${d.old?.absent?'kelmadi':esc(d.old?.score)} — o’chirildi`;
  if(h.action.startsWith('sertifikat.'))return `${esc(d.name||'')}${d.code?' · № '+esc(d.code):''}${d.new_code?' → № '+esc(d.new_code):''}${d.soni?esc(d.soni)+' ta bola':''}${d.reason?' · '+esc(d.reason):''}`;
  return esc(h.stu||d.name||d.child||'')}
function histSub(h){const d=h.detail,p=[];if(h.num)p.push(mkN(h)+'');if(h.cls)p.push(esc(h.cls));
  if(h.action.startsWith('kalit'))p.push(`${esc(d.grade)}-sinf${d.qayta_hisoblandi?` · ${d.qayta_hisoblandi} ta natija qayta hisoblandi`:''}`);
  if(h.action==='oquvchi.kochirish')p.push(`${esc(d.name||'')}: ${esc(d.from||'')} → ${esc(d.to||'')}`);
  if(h.action==='natija.kelmadi_hammasi')p.push(`${esc(d.soni)} ta`);
  if(h.action==='royxat.import')p.push(`${esc(d.added)} ta qo’shildi`);
  if(h.test&&!h.action.startsWith('sertifikat.'))p.push(esc(h.test));
  p.push(esc(h.who||'—'));return p.join(' · ')}

  if(itClass&&!cls.some(c=>c.id===itClass))itClass=0;
  const ll=l.filter(s=>!itClass||s.class_id===itClass);
  const done=ll.filter(s=>{const r=IR(t.id,s.id);return r&&!r.absent});const abs=ll.filter(s=>IR(t.id,s.id)?.absent).length;
  const sorted=[...ll].sort((a,b)=>(IR(t.id,b.id)?.absent?-2:IR(t.id,b.id)?.score??-1)-(IR(t.id,a.id)?.absent?-2:IR(t.id,a.id)?.score??-1)||a.name.localeCompare(b.name,'uz'));

  const rows=sorted.map((s,i)=>{const r=IR(t.id,s.id);const ok=r&&!r.absent;if(ok&&r.score!==prev){place=i+1;prev=r.score}
    const p=itPct(t,r);const hl=ok&&place<=3?'background:rgba(247,207,98,.28)':ok&&place<=5?'background:rgba(253,241,210,.6)':'';

      :r?.absent?`<span class="pill gray">kelmadi</span>`:ok?`<div class="num">${r.score}/${t.qn}<small>${pf(p)}%</small></div>`:`<span class="pill gray">—</span>`;
    return `<div class="row" style="${hl}">${ok?`<span class="rank">${place}</span>`:'<span class="rank"></span>'}<div class="m"><div class="n">${esc(s.name)}</div><div class="s">${esc(s.cls||'')}${ok&&itCanEnter(t,s)?` · ${p}%`:''}</div></div>${right}</div>`}).join('');

const REC={on:false,to:'',data:'',mr:null,ch:[],t0:0,tm:0,stream:null,drop:false};
const AUD={};
const recFmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function recBox(to){let h='';
  if(REC.to===to&&REC.on)h=`<div class="card pad" style="flex-direction:row;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--wrong);animation:pulse 1s infinite;flex:none"></span><b id="recT" style="font-variant-numeric:tabular-nums">${recFmt(Math.floor((Date.now()-REC.t0)/1000))}</b><span class="note">Ovoz yozilmoqda… eng ko’pi 3 daqiqa</span></div>`;
  else if(REC.to===to&&REC.data)h=`<div class="card pad" style="flex-direction:row;align-items:center;gap:10px"><audio controls src="${REC.data}" style="flex:1;min-width:0;height:40px"></audio><button class="btn dan sm" data-act="recDel">O’chirish</button></div>`;
  return `<div id="recbox-${to}">${h}</div>`}
function recBtn(to){const on=REC.on&&REC.to===to;if(to==='rp')return `<span id="recbtn-rp" style="display:contents"><button class="tg-ib ${on?'rec':''}" data-act="${on?'recStop':'recStart'}" data-to="rp" title="${on?'To’xtatish':'Ovozli xabar'}" aria-label="${on?'To’xtatish':'Ovozli xabar'}">${on?'■':'🎤'}</button></span>`;return `<span id="recbtn-${to}" style="display:contents"><button class="btn ${on?'dan':'sec'}" data-act="${on?'recStop':'recStart'}" data-to="${to}">${on?'■ To’xtatish':'🎤 Ovoz'}</button></span>`}
function recRedraw(){['cm','rp'].forEach(to=>{const b=$('#recbox-'+to);if(b)b.outerHTML=recBox(to);const t=$('#recbtn-'+to);if(t)t.outerHTML=recBtn(to)})}
async function recStart(to){
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Bu brauzerda ovoz yozib bo’lmaydi. Chrome orqali oching.',true);return}
  if(REC.on)return; recClear();
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Mikrofonga ruxsat berilmadi. Brauzer sozlamasidan ruxsat bering.',true);return}
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m=>MediaRecorder.isTypeSupported?.(m))||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{});
  Object.assign(REC,{on:true,to,data:'',mr,ch:[],t0:Date.now(),stream,drop:false});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.ch.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(REC.tm);const keep=!REC.drop;REC.on=false;
    if(!keep||!REC.ch.length){recRedraw();return}
    const blob=new Blob(REC.ch,{type:mr.mimeType||mime||'audio/webm'});
    const fr=new FileReader();fr.onload=()=>{const v=String(fr.result);if(v.length>4.4e6){toast('Ovozli xabar juda uzun. Qisqaroq yozing.',true);REC.data=''}else REC.data=v;recRedraw()};fr.readAsDataURL(blob)};
  mr.start(1000);
  REC.tm=setInterval(()=>{const s=Math.floor((Date.now()-REC.t0)/1000);const t=$('#recT');if(t)t.textContent=recFmt(s);if(s>=180)recStop()},500);
  recRedraw()}
function recStop(){if(REC.on&&REC.mr&&REC.mr.state!=='inactive')REC.mr.stop()}
function recClear(){if(REC.on&&REC.mr){REC.drop=true;try{REC.mr.stop()}catch(e){}}clearInterval(REC.tm);REC.on=false;REC.data='';REC.to='';REC.ch=[]}

const TGA={id:0,on:false,a:null};
async function tgPlay(id){
  if(TGA.id===id&&TGA.a){if(TGA.on){TGA.a.pause()}else{TGA.a.play()}return}
  if(TGA.a){TGA.a.pause();TGA.a=null;tgWvSet(TGA.id,0,false)}
  try{if(!AUD[id])AUD[id]=(await api('msg.audio',{id})).audio}catch(e){toast(e.message,true);return}
  const a=new Audio(AUD[id]);Object.assign(TGA,{id,a,on:false});
  a.onplay=()=>{TGA.on=true;tgWvSet(id,a.currentTime/(a.duration||1),true)};a.onpause=()=>{TGA.on=false;tgWvSet(id,a.currentTime/(a.duration||1),false)};
  a.ontimeupdate=()=>tgWvSet(id,a.duration&&isFinite(a.duration)?a.currentTime/a.duration:0,TGA.on);

function inkOnly(img){
  if(!img)return null;
  try{const W=img.width,H=img.height,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(img,0,0);
    const d=g.getImageData(0,0,W,H),p=d.data;
    // fon rangi: chetlardagi piksellarning o'rtachasi
    let r=0,gg=0,b=0,n=0;const add=i=>{r+=p[i];gg+=p[i+1];b+=p[i+2];n++};
    for(let x=0;x<W;x+=4){add((x)*4);add(((H-1)*W+x)*4)}for(let y=0;y<H;y+=4){add((y*W)*4);add((y*W+W-1)*4)}
    r/=n;gg/=n;b/=n;
    let x0=W,y0=H,x1=0,y1=0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(p[i+3]<10){p[i+3]=0;continue}
      // ko'k/rangli siyoh rang to'yinganligidan, qora siyoh esa fondan ancha to'qligidan topiladi (soya va notekis yorug'lik hisobga olinmaydi)
      const mx=Math.max(p[i],p[i+1],p[i+2]),mn=Math.min(p[i],p[i+1],p[i+2]),chroma=(mx-mn)-(Math.max(r,gg,b)-Math.min(r,gg,b));
      const dark=(r+gg+b)/3-(p[i]+p[i+1]+p[i+2])/3;
      const a=Math.max(0,Math.min(1,Math.max((chroma-14)/30,(dark-60)/40)));
      p[i+3]=Math.round(p[i+3]*a);
      if(a>.5){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}}
    g.putImageData(d,0,0);
    if(x1<=x0||y1<=y0)return img;
    const pad=Math.round(Math.max(x1-x0,y1-y0)*.04);x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
    const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o}
  catch(e){return img}}

let cfSchool=0,cfGrade=0,cfClass=0,cfTest=0;
function certFiltered(){
  const all=(S.certs||[]).map(c=>({...c,s:X.st.find(x=>x.id===c.student_id)})).filter(c=>c.s);
  const tests=[...new Set(all.map(c=>c.test_id))];if(cfTest&&!tests.includes(cfTest))cfTest=0;
  let l=all.filter(c=>!cfTest||c.test_id===cfTest);
  const schools=[...new Set(l.map(c=>c.s.school_id))].map(id=>X.sc[id]).filter(Boolean).sort((a,b)=>a.num-b.num);if(cfSchool&&!schools.some(x=>x.id===cfSchool)){cfSchool=0;cfGrade=0;cfClass=0}
  l=l.filter(c=>!cfSchool||c.s.school_id===cfSchool);
  const grades=[...new Set(l.map(c=>c.s.grade))].filter(Boolean).sort((a,b)=>a-b);if(cfGrade&&!grades.includes(cfGrade)){cfGrade=0;cfClass=0}
  l=l.filter(c=>!cfGrade||c.s.grade===cfGrade);
  const classes=cfSchool&&cfGrade?[...new Set(l.map(c=>c.s.class_id))].map(id=>X.cl[id]).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'uz',{numeric:true})):[];if(cfClass&&!classes.some(x=>x.id===cfClass))cfClass=0;
  l=l.filter(c=>!cfClass||c.s.class_id===cfClass);
  l.sort((a,b)=>(a.s.num-b.s.num)||a.s.cls.localeCompare(b.s.cls,'uz',{numeric:true})||a.s.name.localeCompare(b.s.name,'uz'));
  return {l,tests,schools,grades,classes}}
function certLabel(){const p=[];p.push(cfSchool?mkN(X.sc[cfSchool])+'':(isTeam()?'Butun tuman':''));if(cfGrade)p.push(cfGrade+'-sinflar');if(cfClass)p.push(X.cl[cfClass]?.name+' sinf');return p.filter(Boolean).join(' · ')}

  ${l.length&&S.me.role==='ceo'?(()=>{const ds=l.map(c=>c.issued||String(c.at||'').slice(0,10)).filter(Boolean);const cnt={};ds.forEach(d=>cnt[d]=(cnt[d]||0)+1);const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'';const mixed=Object.keys(cnt).length>1;

  <div class="card list">${l.map(c=>`<div class="row"${c.status?' style="opacity:.6"':''}><div class="m"><div class="n">${esc(c.s.name)} ${certPill(c.status)}</div><div class="s">${c.code} · ${mkN(c.s)} · ${esc(c.s.cls)}${c.status?`<br>${esc(c.reason||'')}`:''}</div></div>${c.status?'':`<button class="btn sec sm" data-act="certView" data-c="${c.code}">👁 Ko’rish</button><button class="btn sec sm" data-act="certPng" data-c="${c.code}" aria-label="Yuklab olish">⬇</button>${canCert()?`<button class="btn sec sm" data-act="rvOpen" data-c="${c.code}" aria-label="Bekor qilish">⋯</button>`:''}`}</div>`).join('')||'<div class="empty">Sertifikatlar maktab natijalari e’lon qilinishi bilan o’sha maktabning iqtidorli o’quvchilariga beriladi.</div>'}</div>`]}

// ---------------- test fayli: "=== 3-sinf · A variant ===", "1. savol", "A) javob", "Javob: B"
function parseTestText(txt){
  const L=String(txt||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n').split('\n');
  const H=/^\s*=+\s*(\d{1,2})\s*-?\s*sinf\b\s*[·.,:;|\-–—]*\s*([A-Da-d])\b(?:\s*-?\s*variant)?\s*=*\s*$/i;
  const Q=/^\s*(\d{1,2})\s*[.)]\s+(.*\S)\s*$/, O=/^\s*([A-Ea-e])\s*\)\s*(.*\S)?\s*$/, K=/^\s*(?:to.?g.?ri\s+)?javob\s*[:\-–—]\s*([A-Ea-e])\s*\.?\s*$/i;
  const secs=[],errs=[];let sec=null,q=null;
  const end=()=>{if(q&&sec)sec.qs.push(q);q=null};
  for(const s of L){let m;
    if((m=s.match(H))){end();sec={grade:+m[1],variant:m[2].toUpperCase(),qs:[]};secs.push(sec);continue}
    if(!sec||!s.trim())continue;
    if((m=s.match(K))){if(q)q.a=m[1].toUpperCase();continue}
    if(q&&(m=s.match(O))){q.o.push((m[2]||'').trim());continue}
    if((m=s.match(Q))){end();q={n:+m[1],q:m[2],o:[],a:''};continue}
    if(q){if(q.o.length)q.o[q.o.length-1]+=' '+s.trim();else q.q+='\n'+s.trim()}
  }
  end();
  for(const sc of secs){const tag=`${sc.grade}-sinf ${sc.variant} variant`;
    if(!sc.qs.length)errs.push(`${tag}: savol topilmadi`);
    sc.qs.forEach((x,i)=>{if(x.n!==i+1)errs.push(`${tag}: ${i+1}-savol raqami ${x.n} deb yozilgan`);
      if(x.o.length<2)errs.push(`${tag}: ${i+1}-savolda javob variantlari yo’q`);
      if(!x.a)errs.push(`${tag}: ${i+1}-savolda “Javob: …” qatori yo’q`);
      else if('ABCDE'.indexOf(x.a)>=x.o.length)errs.push(`${tag}: ${i+1}-savol javobi ${x.a}, lekin bunday variant yo’q`)})}
  if(!secs.length)errs.push('Faylda “=== 3-sinf · A variant ===” kabi sarlavha topilmadi. Claude tayyorlagan faylni o’zgartirmasdan yuklang.');
  return {secs:secs.map(s=>({grade:s.grade,variant:s.variant,qs:s.qs.map(x=>({q:x.q,o:x.o,a:x.a}))})),errs};
}

function tLayout(qn,nopt){

    q.push({lx:cx+lab-2.2,y:y0+r*rh+rh/2,o:Array.from({length:nopt},(_,k)=>cx+lab+k*sp+sp/2)})}
  return {mk:[[14,14],[196,14],[196,134.5],[14,134.5]],ms:8,q,d,qr:{x:160,y:21,s:27}};

function pkPick(){const i=document.createElement('input');i.type='file';i.accept='.json,.txt,application/json,text/plain';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{const txt=String(r.result||'');

    :`<div id="pkProg" class="note"></div><button class="btn pri" data-pb="pkGo">Yuklash · ${on} ta misol bazaga${t?' + test':''}</button>`}`}
async function pkGo(btn){if(!PK)return;btn.disabled=true;const prog=m=>{const e=$('#pkProg');if(e)e.textContent=m};
  try{
    const wantT=!!PK.test&&$('#pkT')?.checked,tn=String($('#pkTN')?.value||'').trim(),nv=+($('#pkTV')?.value||1);

    const urls=[...new Set(PK.items.flatMap(x=>[x.img,...x.o.map(v=>v.i)]).filter(u=>u&&String(u).startsWith('data:')))],map={};
    for(let k=0;k<urls.length;k++){prog(`Rasmlar yuklanmoqda: ${k+1} / ${urls.length}`);map[urls[k]]=await mediaUp(dataBlob(urls[k]))}
    const fix=x=>({id:x.id||undefined,rep:x.rep?1:undefined,grade:x.grade,topic:x.topic,kind:x.kind,level:x.level,q:x.q||'',img:map[x.img]||x.img||'',o:x.o.map(v=>({t:v.t||'',i:map[v.i]||v.i||''})),a:x.a,fix:!!x.fix,sol:x.sol||'',src:x.src||PK.name});
    const all=PK.items.map(fix),on=all.filter((_,i)=>PK.items[i].on);let added=0,dup=0,upd=0,near=0;
    for(let k=0;k<on.length;k+=25){prog(`Misollar bazaga yozilmoqda: ${Math.min(k+25,on.length)} / ${on.length}`);const r=await api('pb.add',{items:on.slice(k,k+25)});added+=r.added;dup+=r.dup;upd+=r.updated||0;near+=r.near||0}

  catch(e){toast(e.message,true);btn.disabled=false;prog('')}}

// ================================================================ forms
function formSheet(title,fields,act,extra='',btn='Saqlash'){
  openSheet(`<div class="sh-top"><div class="m"><h2>${title}</h2></div><button class="ib" data-act="close" aria-label="Yopish">${I.x}</button></div>
  ${fields.map(f=>f.type==='select'?`<label class="field"><span class="label">${f.label}</span><select id="${f.id}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`
   :`<label class="field"><span class="label">${f.label}</span><input id="${f.id}" type="${f.type||'text'}" inputmode="${f.mode||'text'}" value="${esc(f.value??'')}" placeholder="${esc(f.ph||'')}">${f.hint?`<span class="note" style="margin-top:4px;font-size:12.5px">${f.hint}</span>`:''}</label>`).join('')}
  ${extra}<button class="btn pri" data-act="${act}">${btn}</button>`)}
const val=id=>($('#'+id)?.value||'').trim();
const classOpts=()=>S.classes.map(c=>[c.id,`${mkN(X.sc[c.school_id])} · ${c.name}`]);

// ---------------- excel import
async function loadXLSX(){if(window.XLSX)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('Excel o’quvchi yuklanmadi. Internetni tekshiring.'));document.head.appendChild(s)})}
let IMP=null;
function openImport(){
  openSheet(`<div class="sh-top"><div class="m"><h2>Ro’yxat yuklash</h2><div class="s">Excel fayl: o’quvchi, sinf, telefon ustunlari</div></div><button class="ib" data-act="close" aria-label="Yopish">${I.x}</button></div>
  <label class="field"><span class="label">Maktab raqami</span><input id="impNum" inputmode="numeric" placeholder="Masalan: 53"></label>
  <label class="field"><span class="label">Excel fayl</span><input id="impFile" type="file" accept=".xlsx,.xls,.csv"></label>
  <div id="impPrev"></div>`);
  $('#impFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
      const head=rows.findIndex(r=>r.some(c=>/sinf/i.test(c)));const H=(rows[head]||[]).map(c=>String(c).toLowerCase());
      const ci=re=>H.findIndex(c=>re.test(c));
      let cn=ci(/quvchi|f\.?i\.?o|ism/), cc=ci(/sinf/), cp=ci(/telefon|tel/), cb=ci(/^ball|natija|^ball$/);
      if(cn<0)cn=1;if(cc<0)cc=2;
      const data=rows.slice(head+1).map(r=>({name:String(r[cn]||'').replace(/ /g,' ').trim(),cls:String(r[cc]||'').replace(/ /g,'').trim(),phone:cp>=0?String(r[cp]||''):'',score:cb>=0?String(r[cb]??'').trim():''})).filter(r=>r.name&&r.cls);
      const m=f.name.match(/(\d+)/);if(m&&!val('impNum'))$('#impNum').value=m[1];
      const by={};data.forEach(r=>{const k=r.cls.toUpperCase();by[k]=(by[k]||0)+1});
      IMP=data;
      $('#impPrev').innerHTML=`<div class="card pad"><b>${data.length} ta o’quvchi topildi</b><div class="note">${Object.entries(by).sort().map(([k,v])=>`${esc(k)}: ${v}`).join(' · ')}</div>
       ${cb>=0?`<div class="note"><b>${data.filter(r=>r.score!==''&&!/^(kelmadi|yo.?q|-)$/i.test(r.score)).length} ta bolaning bali bor${data.some(r=>/^(kelmadi|yo.?q|-)$/i.test(r.score))?`, ${data.filter(r=>/^(kelmadi|yo.?q|-)$/i.test(r.score)).length} tasi kelmagan`:''}</b> — joriy sinovga (${esc(curTest()?.name||'sinov tanlanmagan')}) natija sifatida yoziladi.</div>`:''}<div class="note">${cp>=0?'Fayldagi telefon raqamlari ota-onaga bog’lanmaydi: ular faqat “tekshirilmagan” deb saqlanadi, haqiqiy raqamni sinf rahbari tekshirib kiritadi.':'Telefon ustuni yo’q.'} Otasining ismi olib tashlanadi, faqat familiya va ism qoladi.</div>
       <div class="note">Masalan: ${data.slice(0,3).map(r=>esc(r.name.split(/\s+/).slice(0,2).join(' '))).join(', ')}</div></div>
       <button class="btn pri" data-act="impSave">Yuklash</button>`;
    }catch(err){$('#impPrev').innerHTML=`<p class="err">${esc(err.message)}</p>`}};
}

const IDLE=30*60*1000,IDLE_MSG='30 daqiqa hech narsa bosilmadi. Xavfsizlik uchun qaytadan kiring.';let actPing=0;
const actGet=()=>{try{return +localStorage.getItem('yx_act')||0}catch(e){return 0}};
async function idleOut(){if(!S)return;S=null;stack=[];tab=null;pin='';pinErr=IDLE_MSG;

  try{closeSheet()}catch(e){}render();try{await fetch('/api/logout',{method:'POST',credentials:'same-origin'})}catch(e){}}
function markAct(){const n=Date.now(),a=actGet();if(S&&a&&n-a>IDLE){idleOut();return}
  try{if(S&&n-a>5000)localStorage.setItem('yx_act',String(n))}catch(e){}
  if(S&&n-actPing>60000){actPing=n;fetch('/api/ping',{method:'POST',credentials:'same-origin'}).catch(()=>{})}}
// harakat: bosish, yozish, aylantirish — ichki oynalarda ham (o'quvchi kabineti, darslar)
const ACT_EV=['pointerdown','keydown','wheel','touchstart','input'];
function actHook(w){try{const d=w.document;if(!d||d.__yxAct)return;d.__yxAct=1;ACT_EV.forEach(e=>d.addEventListener(e,markAct,{capture:true,passive:true}));
  d.addEventListener('load',ev=>{if(ev.target&&ev.target.tagName==='IFRAME')actHook(ev.target.contentWindow)},true);
  d.querySelectorAll('iframe').forEach(f=>actHook(f.contentWindow))}catch(e){}}
actHook(window);
function idleCheck(){const a=actGet();if(S&&a&&Date.now()-a>IDLE)idleOut()}
setInterval(idleCheck,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)idleCheck()});

else{const a=actGet();if(a&&Date.now()-a>IDLE){try{localStorage.removeItem('yx_act');localStorage.removeItem('yx_nav')}catch(e){}pinErr=IDLE_MSG;
  fetch('/api/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{}).then(()=>load()).then(flushQueue)}
 else load().then(flushQueue)}
