# Sayt Google qidiruvi uchun to'g'ri ochiq/yopiqligini o'zi tekshiradi (tekshiruv/google.js).
# Har kuni — haqiqiy saytni. Har yuklashdagi tekshiruv 24.11.2026 dan chiqarish.yml ichida (u o'tmasa asosiy saytga chiqmaydi).
name: Google tekshiruvi
on:
  schedule:
    - cron: '17 3 * * *' # har kuni 08:17 (Toshkent)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kod:
    name: Ombordagi kod
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tekshiruv/google.js
  sayt:
    name: Haqiqiy sayt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tekshiruv/google.js --jonli
